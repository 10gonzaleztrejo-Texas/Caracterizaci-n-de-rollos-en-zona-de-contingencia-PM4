<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0E1114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Inspección de rollos · Ternium</title>
<style>
  :root{
    --bg:#F1F2F4; --surface:#FFFFFF; --ink:#0E1114; --ink-mid:#3C444E; --ink-soft:#6B7481;
    --line:#DDE0E5; --line-strong:#C3C8D0; --brand:#0E1114;
    --on-brand:#FFFFFF; --on-brand-rgb:255,255,255; --on-brand-sub:#98A1AC; --accent:#0E1114;
    --conforme:#1F7A4C; --defecto:#B26A12; --scrap:#B32D25; --info:#2C5B7C;
    --radius:10px; --radius-lg:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);}
  body{font-family:"Helvetica Neue",Helvetica,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    color:var(--ink);overscroll-behavior-y:contain;-webkit-text-size-adjust:100%;}
  #rollo-app{min-height:100%;padding:0 0 96px 0;}

  .ra-logo{display:block;height:26px;width:auto;}
  .ra-logo-lg{height:52px;}

  .ra-header{position:sticky;top:0;z-index:20;background-color:var(--brand);background-image:var(--patron,none);color:var(--on-brand);
    padding:calc(13px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .ra-header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--franja,transparent);pointer-events:none;}
  .ra-header .sub{font-size:10.5px;color:var(--on-brand-sub);margin-top:6px;letter-spacing:.1em;}
  .ra-existe{border:1px solid var(--line);border-left:3px solid var(--info);background:#F6F9FB;padding:16px 15px;margin-top:16px;border-radius:var(--radius);}
  .ra-existe-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .ra-existe-zona{font-size:22px;font-weight:700;margin:2px 0 3px;letter-spacing:-.01em;}
  .ra-existe-mov{border-top:1px solid var(--line);margin-top:14px;padding-top:14px;}
  .ra-home{background:none;border:none;padding:4px 6px 4px 0;margin:-4px 0;color:var(--on-brand);cursor:pointer;
    text-align:left;font-family:inherit;border-radius:2px;transition:opacity .12s ease;}
  .ra-home:active{opacity:.6;}
  .ra-user{background:none;border:1px solid rgba(var(--on-brand-rgb),.3);border-radius:2px;padding:8px 12px;
    font-size:12.5px;font-weight:600;color:var(--on-brand);cursor:pointer;max-width:40vw;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;font-family:inherit;}
  .ra-steps{display:flex;background:var(--brand);padding:0 16px;}
  .ra-step-dot{height:3px;flex:1;background:rgba(var(--on-brand-rgb),.18);}
  .ra-step-dot.active{background:var(--on-brand);}
  .ra-step-dot.done{background:rgba(var(--on-brand-rgb),.55);}

  .ra-body{padding:18px 16px;max-width:540px;margin:0 auto;animation:raEnter .22s ease;}
  .ra-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px 18px;margin-bottom:14px;}
  .ra-h1{font-size:21px;font-weight:700;margin:0 0 5px;letter-spacing:-.01em;}
  .ra-h2{font-size:13.5px;color:var(--ink-soft);margin:0 0 16px;line-height:1.5;}
  .ra-label{font-size:11px;font-weight:700;color:var(--ink-soft);margin:0 0 7px;display:block;letter-spacing:.06em;}
  .ra-input{width:100%;padding:14px;font-size:16px;border-radius:var(--radius);border:1px solid var(--line-strong);
    background:#fff;color:var(--ink);margin-bottom:12px;font-family:inherit;}
  .ra-input:focus{outline:none;border-color:var(--ink);}
  .ra-input-err{border-color:var(--scrap)!important;background:#FDF4F3!important;}
  .ra-pin-input{text-align:center;font-size:24px;letter-spacing:10px;font-weight:700;}
  .ra-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}

  .ra-idbox{display:flex;align-items:stretch;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;margin-bottom:9px;background:#fff;}
  .ra-idbox:focus-within{border-color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink);}
  .ra-idbox.ok{border-color:var(--conforme);box-shadow:inset 0 -2px 0 var(--conforme);}
  .ra-idfix{display:flex;align-items:center;padding:0 13px;background:#F4F5F7;font-size:18px;font-weight:700;
    color:var(--ink-mid);border-right:1px solid var(--line);flex:none;}
  .ra-idfix.suffix{border-right:none;border-left:1px solid var(--line);}
  .ra-idmid{flex:1;min-width:0;border:none;outline:none;padding:16px 6px;font-size:23px;font-weight:700;
    text-align:center;letter-spacing:.12em;font-family:inherit;color:var(--ink);background:transparent;}
  .ra-idpreview{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;}
  .ra-idpreview b{color:var(--ink);font-weight:700;letter-spacing:.05em;}
  .ra-idpreview.warn{color:var(--defecto);}

  .ra-btn{display:flex;align-items:center;justify-content:center;text-align:center;gap:9px;border:none;
    border-radius:var(--radius);cursor:pointer;font-family:inherit;font-size:15.5px;font-weight:700;color:#fff;
    padding:17px 14px;min-height:56px;line-height:1.2;transition:opacity .12s ease;}
  .ra-btn:active{opacity:.82;}
  .ra-btn:disabled{opacity:.35;cursor:default;}
  .ra-btn-block{width:100%;margin-bottom:9px;}
  .ra-btn-sm{min-height:44px;font-size:13.5px;padding:11px 12px;}
  .ra-btn-primary{background:var(--brand);color:var(--on-brand);}
  .ra-btn-conforme{background:var(--conforme);}
  .ra-btn-defecto{background:var(--defecto);}
  .ra-btn-scrap{background:var(--scrap);}
  .ra-btn-info{background:var(--info);}
  .ra-btn-outline{background:#fff;color:var(--ink);border:1px solid var(--line-strong);font-weight:600;}
  .ra-btn-outline:active{background:#F4F5F7;}

  .ra-choice{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:15px 14px;margin-bottom:7px;
    display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:15px;font-weight:600;gap:10px;}
  .ra-choice:active{background:#F4F5F7;}
  .ra-choice .code{font-size:11.5px;color:var(--ink-soft);font-weight:700;background:#F1F2F4;padding:4px 8px;
    border-radius:2px;margin-right:11px;flex:none;min-width:54px;text-align:center;}
  .ra-choice-row{display:flex;align-items:center;flex:1;min-width:0;}
  .ra-choice-text{flex:1;min-width:0;}
  .ra-chev{color:var(--ink-soft);font-size:13px;flex:none;font-weight:600;}

  .ra-topbar{display:flex;align-items:center;margin-bottom:14px;}
  .ra-back{background:none;border:none;font-size:14px;font-weight:600;color:var(--ink-mid);padding:8px 0;cursor:pointer;font-family:inherit;}
  .ra-pill{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:2px;background:var(--accent);color:#fff;margin-left:8px;letter-spacing:.08em;}
  .ra-summary-line{display:flex;justify-content:space-between;gap:14px;padding:9px 0;font-size:13.5px;border-bottom:1px solid var(--line);}
  .ra-summary-line:last-child{border-bottom:none;}
  .ra-summary-line span{color:var(--ink-soft);}
  .ra-summary-line b{font-weight:700;text-align:right;}

  .ra-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom,0);}
  .ra-nav button{flex:1;background:none;border:none;padding:12px 2px 10px;font-size:9.5px;font-weight:700;
    color:var(--ink-soft);cursor:pointer;font-family:inherit;letter-spacing:.05em;border-top:2px solid transparent;margin-top:-1px;}
  .ra-nav button.active{color:var(--accent);border-top-color:var(--accent);}
  .ra-nav .ico{display:block;font-size:16px;margin-bottom:4px;font-weight:400;}

  .ra-toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:13px 22px;border-radius:2px;font-size:13.5px;font-weight:600;z-index:300;opacity:0;pointer-events:none;
    transition:opacity .22s ease, top .22s ease;max-width:88vw;text-align:center;}
  .ra-toast.show{opacity:1;top:calc(58px + env(safe-area-inset-top,0px));}

  .ra-photo-row{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap;}
  .ra-photo-thumb{position:relative;width:78px;height:78px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line-strong);}
  .ra-photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .ra-photo-thumb.nueva{border:2px solid var(--conforme);}
  .ra-foto-nueva{position:absolute;left:3px;bottom:3px;background:var(--conforme);color:#fff;font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 5px;border-radius:3px;}
  .ra-photo-thumb button{position:absolute;top:3px;right:3px;background:rgba(14,17,20,.78);color:#fff;border:none;
    border-radius:2px;width:22px;height:22px;font-size:12px;line-height:1;cursor:pointer;}
  .ra-add-photo{width:78px;height:78px;border-radius:var(--radius);border:1px dashed var(--line-strong);display:flex;
    align-items:center;justify-content:center;font-size:22px;color:var(--ink-soft);background:#fff;cursor:pointer;}
  .ra-empty{text-align:center;padding:48px 20px;color:var(--ink-soft);font-size:13.5px;line-height:1.6;}
  .ra-empty .big{font-size:28px;margin-bottom:10px;opacity:.35;}

  .ra-item{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:9px;}
  .ra-item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;gap:10px;}
  .ra-item-id{font-weight:700;font-size:15px;word-break:break-all;letter-spacing:.02em;}
  .ra-badge{font-size:10px;font-weight:700;padding:4px 9px;border-radius:2px;color:#fff;white-space:nowrap;letter-spacing:.07em;}
  .ra-badge.conforme{background:var(--conforme);}
  .ra-badge.defecto{background:var(--scrap);}
  .ra-badge.scrap{background:var(--scrap);}
  .ra-badge.zona{background:var(--info);}
  .ra-badge.sync{background:#6E4B10;}
  .ra-meta{font-size:12.5px;color:var(--ink-soft);line-height:1.55;}
  .ra-actions{display:flex;gap:16px;margin-top:9px;flex-wrap:wrap;}

  .ra-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-bottom:14px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .ra-stat{background:#fff;padding:14px 6px;text-align:center;}
  .ra-stat .n{font-size:20px;font-weight:800;letter-spacing:-.02em;}
  .ra-stat .l{font-size:9.5px;color:var(--ink-soft);font-weight:700;letter-spacing:.08em;margin-top:3px;}

  .ra-section-title{font-size:12.5px;font-weight:700;color:var(--ink-mid);margin:14px 0 8px;}
  .ra-tag-list{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px;}
  .ra-tag{background:#F4F5F7;border:1px solid var(--line);border-radius:2px;padding:7px 10px 7px 12px;font-size:13px;display:flex;align-items:center;gap:9px;}
  .ra-tag button{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:14px;padding:0;line-height:1;}
  .ra-inline-form{display:flex;gap:7px;margin-bottom:8px;}
  .ra-inline-form input{flex:1;min-width:0;}
  .ra-small-btn{border:none;background:var(--brand);color:var(--on-brand);border-radius:var(--radius);padding:0 17px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;flex:none;}
  .ra-link{color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;background:none;border:none;padding:5px 0;font-family:inherit;text-decoration:underline;text-underline-offset:3px;}
  .ra-link.danger{color:var(--scrap);}

  /* Timeline estilo tracking */
  .ra-tl{position:relative;padding-left:30px;margin-top:6px;}
  .ra-tl:before{content:"";position:absolute;left:8px;top:8px;bottom:12px;width:2px;background:var(--line);}
  .ra-tl-item{position:relative;padding-bottom:22px;}
  .ra-tl-item:last-child{padding-bottom:4px;}
  .ra-tl-dot{position:absolute;left:-30px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;
    border:2px solid var(--line-strong);}
  .ra-tl-item.done .ra-tl-dot{background:var(--ink-soft);border-color:var(--ink-soft);}
  .ra-tl-item.current .ra-tl-dot{background:var(--conforme);border-color:var(--conforme);box-shadow:0 0 0 4px rgba(31,122,76,.16);}
  .ra-tl-zona{font-size:15px;font-weight:700;}
  .ra-tl-item.current .ra-tl-zona{color:var(--conforme);}
  .ra-tl-meta{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.5;}
  .ra-tl-nota{font-size:12.5px;color:var(--ink-mid);margin-top:4px;font-style:italic;}
  .ra-zona-actual{background:#F0F5F9;border-left:3px solid var(--info);padding:14px 15px;margin-bottom:14px;}
  .ra-zona-actual .z{font-size:19px;font-weight:700;margin-top:3px;}

  .ra-video-modal{position:fixed;inset:0;background:#000;z-index:200;display:flex;flex-direction:column;}
  .ra-video-modal video{flex:1;width:100%;object-fit:cover;}
  .ra-scan-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(68vw,280px);aspect-ratio:1;border:2px solid #fff;box-shadow:0 0 0 100vmax rgba(0,0,0,.55);pointer-events:none;}
  .ra-video-modal .close-scan,.ra-video-modal .torch-btn{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));
    background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:2px;width:42px;height:42px;font-size:17px;z-index:3;cursor:pointer;}
  .ra-video-modal .close-scan{right:16px;}
  .ra-video-modal .torch-btn{left:16px;}
  .ra-video-modal .torch-btn.on{background:#fff;color:#000;}
  .ra-video-modal .hint{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;
    color:#fff;font-size:13.5px;background:rgba(0,0,0,.55);padding:12px;margin:0 20px;z-index:3;}

  .ra-lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:250;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
  .ra-lightbox img{max-width:100%;max-height:74vh;object-fit:contain;}
  .ra-lightbox .lb-close{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;background:rgba(255,255,255,.16);
    color:#fff;border:none;border-radius:2px;width:42px;height:42px;font-size:17px;cursor:pointer;}
  .ra-lightbox .lb-meta{color:#C3C8D0;font-size:12.5px;margin-top:16px;text-align:center;}
  .ra-photos-mini{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;}
  .ra-photos-mini img{width:54px;height:54px;object-fit:cover;border-radius:2px;border:1px solid var(--line);cursor:pointer;}

  .ra-zchips{display:flex;flex-wrap:wrap;gap:7px;}
  .ra-zchip{background:#fff;border:1px solid var(--line-strong);border-radius:2px;padding:9px 12px;font-size:13px;
    font-weight:600;font-family:inherit;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:8px;}
  .ra-zchip b{background:#F1F2F4;border-radius:2px;padding:2px 7px;font-size:11.5px;color:var(--ink-soft);}
  .ra-zchip.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .ra-zchip.on b{background:rgba(255,255,255,.2);color:#fff;}
  .ra-zchip.alerta{border-color:var(--defecto);color:var(--defecto);}
  .ra-zchip.alerta b{background:#FDF6E9;color:var(--defecto);}
  .ra-zchip.alerta.on{background:var(--defecto);color:#fff;border-color:var(--defecto);}
  .ra-zchip.alerta.on b{background:rgba(255,255,255,.22);color:#fff;}
  .ra-item.detenido{border-left:3px solid var(--defecto);}
  .ra-item.sel{border-color:var(--accent);background:#F7F8F9;}
  .ra-check{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:1.5px solid var(--line-strong);
    border-radius:2px;margin-right:9px;font-size:12px;vertical-align:middle;color:#fff;}
  .ra-check.on{background:var(--accent);border-color:var(--accent);}
  .ra-defrow{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);
    border-radius:var(--radius);margin-bottom:6px;cursor:pointer;font-size:14px;background:#fff;}
  .ra-defrow.on{border-color:var(--accent);background:#F7F8F9;}
  .ra-defrow .code{font-size:11px;color:var(--ink-soft);font-weight:700;background:#F1F2F4;padding:3px 7px;
    border-radius:2px;flex:none;min-width:52px;text-align:center;}
  .ra-defrow:active{background:#F1F2F4;}
  .ra-combo{position:relative;}
  .ra-combo-clear{position:absolute;right:8px;top:9px;background:#F1F2F4;border:1px solid var(--line);
    border-radius:2px;width:30px;height:30px;font-size:13px;color:var(--ink-soft);cursor:pointer;}
  .ra-combo-list{border:1px solid var(--line-strong);border-top:none;border-radius:0 0 var(--radius) var(--radius);
    max-height:238px;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-bottom:12px;background:#fff;}
  .ra-combo-opt{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;
    justify-content:space-between;align-items:center;gap:12px;font-size:15px;}
  .ra-combo-opt:last-child{border-bottom:none;}
  .ra-combo-opt:active{background:#F4F5F7;}
  .ra-combo-opt b{font-weight:700;letter-spacing:.03em;}
  .ra-combo-opt span{font-size:11.5px;color:var(--ink-soft);text-align:right;flex:none;max-width:56%;}
  .ra-combo-empty{padding:16px 14px;font-size:13px;color:var(--ink-soft);}
  textarea.ra-input{resize:vertical;min-height:76px;}
  select.ra-input{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 14 14'><path d='M3 5l4 4 4-4' fill='none' stroke='%236B7481' stroke-width='2'/></svg>");background-repeat:no-repeat;background-position:right 14px center;}
  .ra-warn{background:#FDF6E9;border-left:3px solid var(--defecto);padding:13px 14px;font-size:12.5px;color:#6E4B10;line-height:1.55;margin-bottom:14px;}
  .ra-note{background:#F4F5F7;border-left:3px solid var(--line-strong);padding:13px 14px;font-size:12.5px;color:var(--ink-mid);line-height:1.55;margin-bottom:14px;}
  .ra-err{color:var(--scrap);font-size:12.5px;margin:-6px 0 12px;font-weight:600;}
  button:focus-visible,.ra-choice:focus-visible,.ra-input:focus-visible,.ra-idmid:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

  /* Bienvenida */
  .ra-welcome{position:fixed;inset:0;z-index:400;background-color:var(--brand);background-image:var(--patron,none);color:var(--on-brand);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;animation:raFadeOut .55s ease forwards;animation-delay:1.75s;}
  .ra-welcome .w-logo{opacity:0;animation:raRise .55s cubic-bezier(.2,.7,.3,1) forwards;}
  .ra-welcome .w-hi{opacity:0;font-size:12.5px;letter-spacing:.22em;color:var(--on-brand-sub);text-align:center;
    animation:raRise .55s cubic-bezier(.2,.7,.3,1) .2s forwards;}
  .ra-welcome .w-name{display:block;font-size:27px;letter-spacing:-.01em;color:var(--on-brand);font-weight:700;margin-top:10px;}
  .ra-welcome .w-bar{width:130px;height:2px;background:rgba(var(--on-brand-rgb),.18);overflow:hidden;}
  .ra-welcome .w-bar i{display:block;height:100%;width:0;background:var(--on-brand);animation:raBar 1.45s cubic-bezier(.3,.6,.3,1) .25s forwards;}
  .ra-welcome .w-temp{display:block;font-size:11px;letter-spacing:.24em;color:var(--on-brand-sub);margin-top:14px;font-weight:700;}
  @keyframes raRise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  @keyframes raFadeOut{to{opacity:0;visibility:hidden;}}
  @keyframes raBar{to{width:100%;}}
  @keyframes raEnter{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .ra-shake{animation:raShake .34s ease;}
  @keyframes raShake{0%,100%{transform:none;}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}

  .ra-gate{position:relative;min-height:100vh;background-color:var(--brand);background-image:var(--patron,none);display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px calc(32px + env(safe-area-inset-bottom,0px));}
  .ra-gate-inner{position:relative;z-index:2;width:100%;max-width:400px;}
  .ra-gate{padding-top:calc(32px + var(--deco-top,0px) + env(safe-area-inset-top,0px));}
  /* Decoración de temporada (pantalla de inicio) */
  #ra-deco{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;display:none;}
  body.ra-en-gate #ra-deco{display:block;}
  .ra-adorno-top{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;background-repeat:repeat-x;background-position:center top;}
  .ra-luna{position:absolute;top:calc(28px + env(safe-area-inset-top,0px));right:22px;width:62px;height:62px;border-radius:50%;

  .ra-p{position:absolute;top:0;display:block;will-change:transform;animation-timing-function:linear;animation-iteration-count:infinite;}
  .ra-p svg{display:block;width:100%;height:100%;}
  .ra-p-nieve{border-radius:50%;animation-name:raCae;}
  .ra-p-confeti{border-radius:1px;animation-name:raCaeGira;}
  .ra-p-sube{animation-name:raSube;}
  @keyframes raCae{0%{transform:translate3d(0,-8vh,0);}50%{transform:translate3d(var(--x),50vh,0);}100%{transform:translate3d(0,108vh,0);}}
  @keyframes raCaeGira{0%{transform:translate3d(0,-8vh,0) rotate(0deg);}100%{transform:translate3d(var(--x),108vh,0) rotate(var(--r));}}
  @keyframes raSube{0%{transform:translate3d(0,108vh,0);}50%{transform:translate3d(var(--x),50vh,0);}100%{transform:translate3d(0,-10vh,0);}}
  /* Partículas extra: destellos fijos que titilan y fuegos artificiales */
  .ra-p-brilla{border-radius:50%;animation-name:raBrilla;animation-timing-function:ease-in-out;box-shadow:0 0 6px 1px currentColor;}
  .ra-p-fuego{border-radius:50%;animation-name:raFuego;animation-timing-function:cubic-bezier(.2,.7,.3,1);
    -webkit-mask:radial-gradient(circle,transparent 30%,#000 32%,#000 58%,transparent 62%);mask:radial-gradient(circle,transparent 30%,#000 32%,#000 58%,transparent 62%);}
  @keyframes raBrilla{0%,100%{opacity:.15;transform:scale(.6);}50%{opacity:1;transform:scale(1.15);}}
  @keyframes raFuego{0%{opacity:0;transform:scale(.1) rotate(0deg);}12%{opacity:1;}70%{opacity:.85;}100%{opacity:0;transform:scale(1.25) rotate(25deg);}}
  /* Adornos fijos */
  .ra-estrella-grande{position:absolute;top:calc(26px + env(safe-area-inset-top,0px));right:26px;width:58px;height:58px;
    background:radial-gradient(circle,#FFF8DC 0 18%,#F4D27A 40%,transparent 70%);animation:raLatido 3.2s ease-in-out infinite;}
  .ra-estrella-grande::before{content:"";position:absolute;inset:-14px;background:#FFF1BF;
    clip-path:polygon(50% 0,56% 44%,100% 50%,56% 56%,50% 100%,44% 56%,0 50%,44% 44%);opacity:.9;}
  .ra-aurora{position:absolute;left:0;right:0;top:0;height:45vh;background:radial-gradient(ellipse 80% 60% at 30% 0%,rgba(120,170,255,.22),transparent 70%),
    radial-gradient(ellipse 70% 50% at 80% 10%,rgba(244,210,122,.16),transparent 70%);animation:raAurora 9s ease-in-out infinite alternate;}
  .ra-reloj{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:50%;width:74px;height:74px;margin-left:-37px;opacity:.95;}
  .ra-reloj .seg{transform-origin:50px 50px;animation:raGira 6s linear infinite;}
  .ra-telarana{position:absolute;top:env(safe-area-inset-top,0px);left:0;width:120px;height:120px;opacity:.55;}
  .ra-sol{position:absolute;top:calc(-40px + env(safe-area-inset-top,0px));right:-30px;width:170px;height:170px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,236,170,.55),rgba(255,200,120,.18) 45%,transparent 70%);animation:raLatido 6s ease-in-out infinite;}
  .ra-velas{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));height:40px;background-repeat:repeat-x;background-position:center bottom;opacity:.9;}
  @keyframes raLatido{0%,100%{transform:scale(1);opacity:.85;}50%{transform:scale(1.08);opacity:1;}}
  @keyframes raAurora{from{opacity:.6;transform:translateX(-4%);}to{opacity:1;transform:translateX(4%);}}
  @keyframes raGira{to{transform:rotate(360deg);}}
  /* Decoración ligera dentro de la app (franja del encabezado); no bloquea toques */
  #ra-deco-cab{position:fixed;left:0;right:0;top:0;height:calc(70px + env(safe-area-inset-top,0px));z-index:21;pointer-events:none;overflow:hidden;display:none;}
  body.ra-con-deco:not(.ra-en-gate) #ra-deco-cab{display:block;}
  #ra-deco-cab .ra-p{animation-name:raCaeCab;}
  #ra-deco-cab .ra-p-sube{animation-name:raSubeCab;}
  #ra-deco-cab .ra-p-brilla{animation-name:raBrilla;}
  #ra-deco-cab .ra-p-fuego{animation-name:raFuego;}
  @keyframes raCaeCab{0%{transform:translate3d(0,-14px,0) rotate(0deg);}100%{transform:translate3d(var(--x),84px,0) rotate(var(--r));}}
  @keyframes raSubeCab{0%{transform:translate3d(0,84px,0);}100%{transform:translate3d(var(--x),-24px,0);}}
  /* Fondo del lienzo: al deslizar más allá del final (rebote de iOS) se ve el color del tema, no un hueco claro */
  html.ra-gate-html, html.ra-gate-html body{background-color:var(--gate-bg,var(--brand));}
  .ra-gate{min-height:100vh;min-height:100dvh;}
  /* Halloween: telaraña de esquina y araña colgando */
  .ra-telarana{width:150px;height:150px;opacity:.6;}
  .ra-arana{position:absolute;top:env(safe-area-inset-top,0px);left:112px;width:36px;height:150px;overflow:hidden;}
  .ra-arana svg{display:block;width:36px;height:150px;}
  .ra-arana .ara{animation:raArana 4.6s ease-in-out infinite alternate;}
  @keyframes raArana{from{transform:translateY(-34px);}to{transform:translateY(0);}}
  .ra-arana .pata{animation:raPatas 1.6s ease-in-out infinite alternate;transform-origin:18px 118px;}
  @keyframes raPatas{from{transform:rotate(-4deg);}to{transform:rotate(4deg);}}
  /* Fin de año: cuenta regresiva */
  .ra-cuenta{margin:18px auto 0;text-align:center;color:#FFF7DD;}
  .ra-cuenta .c-t{font-size:11px;font-weight:700;letter-spacing:.22em;color:var(--on-brand-sub);}

  .ra-cuenta .c-n span{min-width:58px;padding:8px 6px 6px;border:1px solid rgba(233,196,106,.45);border-radius:6px;background:rgba(255,255,255,.06);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 18px rgba(233,196,106,.12);}
  .ra-cuenta .c-n b{display:block;font-size:26px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;color:#FFF1BF;}
  .ra-cuenta .c-n i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.16em;margin-top:5px;color:rgba(255,241,191,.7);}
  .ra-cuenta.fin .c-t{font-size:15px;color:#FFF1BF;animation:raLatido 1.4s ease-in-out infinite;}
  .ra-cuenta-bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;background:linear-gradient(90deg,#2A2140,#15101F 50%,#2A2140);
    color:#FFF1BF;font-size:12px;letter-spacing:.06em;border-bottom:1px solid rgba(233,196,106,.35);}
  .ra-cuenta-bar b{font-variant-numeric:tabular-nums;font-size:13px;letter-spacing:.04em;}
  .ra-cuenta-bar svg{width:14px;height:14px;flex:none;}
  /* Logotipo a color (solo estilo Ternium) */
  .ra-logo .lg-c{display:none;}

  html[data-estilo="ternium"]{--gate-bg:#0F141C;}

    background-image:radial-gradient(ellipse 130% 38% at 50% 100%,rgba(240,124,40,.55),rgba(229,64,30,.18) 55%,transparent 75%),
      linear-gradient(180deg,#111722 0%,#1A2130 38%,#2B2730 64%,#6A3A26 86%,#B8582A 100%);}
  html[data-estilo="ternium"] .ra-gate-brand,html[data-estilo="ternium"] .ra-welcome,html[data-estilo="ternium"] .ra-welcome .w-name{color:#FFFFFF;}
  html[data-estilo="ternium"] .ra-gate-brand .app-name{font-family:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;font-size:15px;letter-spacing:.26em;color:#F5A04A;}
  html[data-estilo="ternium"] .ra-welcome .w-bar{background:rgba(255,255,255,.18);}
  html[data-estilo="ternium"] .ra-welcome .w-bar i{background:linear-gradient(90deg,#E5401E,#F39A33);}
  html[data-estilo="ternium"] #ra-deco .ra-p-sube{border-radius:50%;}
  .ra-planta{position:absolute;left:0;right:0;bottom:0;height:190px;}
  .ra-planta svg{display:block;width:100%;height:100%;}
  .ra-planta .luz{animation:raBrilla 3.4s ease-in-out infinite;}
  .ra-planta .humo{animation:raHumo 9s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%;}
  @keyframes raHumo{0%{opacity:0;transform:translateY(8px) scale(.7);}30%{opacity:.35;}100%{opacity:0;transform:translateY(-34px) scale(1.5);}}
  .ra-swatch i.tn,.ra-fold-prev i.tn{background:linear-gradient(135deg,#F39A33 0 48%,#FFFFFF 48% 54%,#E5401E 54%) !important;}
  /* ===== Arte de fondo (todas las apariencias): luz que se mueve, retícula de puntos y rollos de acero en espiral ===== */
  .ra-gate{background-image:var(--patron,none),linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.26));}
  .ra-header{background-image:var(--patron,none),linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.14));}
  html[data-estilo="ternium"] .ra-header{background-image:none;}
  .ra-fx{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .ra-fx-glow{position:absolute;inset:-25%;
    background:radial-gradient(38% 32% at 18% 14%,rgba(var(--on-brand-rgb),.13),transparent 70%),
      radial-gradient(42% 36% at 86% 82%,rgba(var(--on-brand-rgb),.10),transparent 72%),
      radial-gradient(30% 26% at 70% 20%,var(--fx-tinte,transparent),transparent 70%);
    animation:raDeriva 16s ease-in-out infinite alternate;}
  @keyframes raDeriva{from{transform:translate3d(-4%,-3%,0) scale(1);}to{transform:translate3d(4%,3%,0) scale(1.08);}}
  .ra-fx-puntos{position:absolute;inset:0;background-image:radial-gradient(rgba(var(--on-brand-rgb),.13) 1px,transparent 1.5px);background-size:22px 22px;

  .ra-fx-rollo{position:absolute;color:rgb(var(--on-brand-rgb));}

  .ra-fx-rollo.r1{right:-190px;bottom:-170px;width:540px;height:540px;opacity:.11;}
  .ra-fx-rollo.r2{left:-130px;top:-120px;width:320px;height:320px;opacity:.08;}
  .ra-fx-rollo.r2 svg{animation-direction:reverse;animation-duration:100s;}
  .ra-fx-haz{position:absolute;top:-10%;left:0;width:45%;height:120%;transform:translateX(-120%) skewX(-14deg);
    background:linear-gradient(90deg,transparent,rgba(var(--on-brand-rgb),.07) 45%,rgba(var(--on-brand-rgb),.11) 50%,rgba(var(--on-brand-rgb),.07) 55%,transparent);

  .ra-fx-lamina{position:absolute;left:0;right:0;bottom:0;height:34%;

  /* ===== Pantalla de inicio ===== */
  .ra-gate-brand{margin-bottom:22px;}

  .ra-estilo{border:2px solid var(--line);border-radius:var(--radius);background:#fff;padding:0 0 8px;cursor:pointer;overflow:hidden;
    font-family:inherit;font-size:11.5px;font-weight:600;color:var(--ink);display:flex;flex-direction:column;gap:7px;text-align:center;}
  .ra-estilo .pv{display:block;height:46px;position:relative;}
  .ra-estilo .pv b{position:absolute;left:0;right:0;bottom:0;height:4px;}
  .ra-estilo .pv em{position:absolute;left:8px;top:9px;width:30px;height:5px;border-radius:1px;opacity:.9;}
  .ra-estilo.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .ra-estilo .hoy{display:block;font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--conforme);margin-top:2px;}
  .ra-cal{margin-top:10px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .ra-cal-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid var(--line);font-size:12.5px;}
  .ra-cal-row:first-child{border-top:none;}
  .ra-cal-row i{flex:none;width:26px;height:18px;border-radius:3px;background-size:auto 100%;border:1px solid rgba(0,0,0,.1);}
  .ra-cal-row .n{font-weight:600;color:var(--ink);flex:1;}
  .ra-cal-row .f{color:var(--ink-soft);text-align:right;}
  .ra-cal-row.hoy{background:#EAF5EF;}
  .ra-auto-estado{margin-top:10px;padding:11px 12px;border-left:3px solid var(--conforme);background:#F3F8F5;font-size:12.5px;line-height:1.5;color:var(--ink-mid);}
  .ra-auto-estado.off{border-left-color:var(--line-strong);background:#F4F5F7;}
  .ra-swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .ra-swatch{border:2px solid var(--line);border-radius:var(--radius);background:#fff;padding:8px 4px 7px;cursor:pointer;
    font-family:inherit;font-size:11px;font-weight:600;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;}
  .ra-swatch i{display:block;width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.12);}
  .ra-swatch.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .ra-gate-card{background:#fff;border-radius:var(--radius-lg);padding:24px 20px;animation:raEnter .26s ease;}

  @media (min-width:700px){
    .ra-body{max-width:700px;}
    .ra-grid{grid-template-columns:repeat(3,1fr);}
    .ra-header,.ra-steps{padding-left:28px;padding-right:28px;}
    .ra-nav{max-width:700px;left:50%;transform:translateX(-50%);right:auto;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  .ra-offline{background:#6E4B10;color:#fff;font-size:12px;font-weight:600;text-align:center;padding:7px 14px;line-height:1.4;}
  .ra-offline.sync{background:var(--info);}

  /* ============ MODO OSCURO ============
     Es independiente del color de marca (que sigue viéndose igual en el
     encabezado y la pantalla de inicio, ya calculado para verse bien). Solo
     cambia las superficies y el texto del resto de la app. Como los demás
     cambios de apariencia, no se registra en el reporte de movimientos. */
  html[data-oscuro="1"]{
    color-scheme:dark;
    --bg:#16181B; --surface:#202327; --ink:#F1F2F4; --ink-mid:#C6CBD2; --ink-soft:#8B9199;
    --line:#33373C; --line-strong:#484E56;
  }
  html[data-oscuro="1"] body{background:var(--bg);}
  html[data-oscuro="1"] .ra-input,
  html[data-oscuro="1"] .ra-idbox,
  html[data-oscuro="1"] .ra-btn-outline,
  html[data-oscuro="1"] .ra-choice,
  html[data-oscuro="1"] .ra-nav,
  html[data-oscuro="1"] .ra-item,
  html[data-oscuro="1"] .ra-stat,
  html[data-oscuro="1"] .ra-tl-dot,
  html[data-oscuro="1"] .ra-zchip,
  html[data-oscuro="1"] .ra-defrow,
  html[data-oscuro="1"] .ra-combo-list,
  html[data-oscuro="1"] .ra-color-row input[type=color],
  html[data-oscuro="1"] .ra-estilo,
  html[data-oscuro="1"] .ra-swatch,
  html[data-oscuro="1"] .ra-gate-card{background:var(--surface);}
  html[data-oscuro="1"] .ra-idfix,
  html[data-oscuro="1"] .ra-btn-outline:active,
  html[data-oscuro="1"] .ra-choice:active,
  html[data-oscuro="1"] .ra-choice .code,
  html[data-oscuro="1"] .ra-tag,
  html[data-oscuro="1"] .ra-zchip b,
  html[data-oscuro="1"] .ra-defrow .code,
  html[data-oscuro="1"] .ra-defrow:active,
  html[data-oscuro="1"] .ra-combo-clear,
  html[data-oscuro="1"] .ra-combo-opt:active,
  html[data-oscuro="1"] .ra-note,
  html[data-oscuro="1"] .ra-subtle-bg{background:var(--line) !important;}
  html[data-oscuro="1"] .ra-video-modal .torch-btn.on{background:#fff;}
  html[data-oscuro="1"] img,html[data-oscuro="1"] .ra-logo{filter:brightness(.94);}

  /* ===== Cámara interna, galería compartida ===== */
  body.ra-cam-abierta{overflow:hidden;}
  .ra-idrow{display:flex;align-items:stretch;gap:8px;}
  .ra-idrow > .ra-idbox, .ra-idrow > .ra-input{flex:1;min-width:0;margin-bottom:0;}
  .ra-idcam{flex:0 0 auto;width:58px;border:1px solid var(--line-strong);background:#fff;color:var(--accent);
    border-radius:var(--radius);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;}
  .ra-idcam:active{transform:scale(.96);}
  .ra-idcam .n{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;
    background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff;}
  .ra-label-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .ra-label-row .ra-label{margin-bottom:8px;}
  .ra-galbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:#fff;color:var(--ink);
    font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer;margin-bottom:8px;font-family:inherit;}
  .ra-galbtn b{background:var(--accent);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;}
  .ra-gal-aviso{display:flex;gap:9px;align-items:flex-start;background:#EEF4FB;border-left:3px solid var(--info);
    padding:10px 12px;font-size:12.5px;line-height:1.45;color:var(--ink-mid);margin:-4px 0 14px;}
  .ra-gal-aviso svg{flex:0 0 auto;color:var(--info);margin-top:1px;}
  .ra-photo-thumb.gal{border:2px solid var(--info);}
  .ra-foto-gal{position:absolute;left:3px;bottom:3px;background:var(--info);color:#fff;font-size:8.5px;font-weight:700;letter-spacing:.05em;padding:2px 4px;border-radius:3px;}
  button.ra-add-photo{font-family:inherit;color:var(--accent);}
  .ra-gal-sug{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:#EEF4FB;border:1px dashed var(--info);
    color:var(--ink);padding:11px 12px;border-radius:var(--radius);font-size:13px;cursor:pointer;margin:-4px 0 14px;font-family:inherit;}
  .ra-gal-sug svg{color:var(--info);flex:0 0 auto;}

  .ra-cam{position:fixed;inset:0;background:#000;z-index:200;display:flex;flex-direction:column;color:#fff;}
  .ra-cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .ra-cam .cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
  .ra-cam .cam-flash.on{animation:raCamFlash .35s ease-out;}
  @keyframes raCamFlash{0%{opacity:.85;}100%{opacity:0;}}
  .ra-cam .cam-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;
    padding:calc(14px + env(safe-area-inset-top,0px)) 14px 26px;background:linear-gradient(rgba(0,0,0,.62),transparent);z-index:2;}
  .ra-cam .cam-top-r{display:flex;gap:8px;margin-left:auto;}
  .cam-btn{background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:17px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
  .cam-btn[hidden]{display:none;}
  .cam-btn.on{background:#fff;color:#000;}
  .cam-btn.dark{background:rgba(0,0,0,.06);color:var(--ink);}
  .ra-cam .cam-chip{min-width:0;flex:0 1 auto;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.28);
    border-radius:999px;padding:9px 14px;font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ra-cam .cam-chip:disabled{cursor:default;opacity:1;}
  .ra-cam .cam-chip b{font-weight:700;letter-spacing:.02em;}
  .ra-cam .cam-cambiar{margin-left:6px;color:#FFC79E;font-size:12px;text-decoration:underline;}
  .ra-cam .cam-bottom{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    padding:24px 22px calc(26px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.7));z-index:2;}
  .ra-cam .cam-last{width:58px;height:58px;border-radius:10px;overflow:visible;position:relative;cursor:pointer;justify-self:start;
    border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.08);}
  .ra-cam .cam-last img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block;}
  .ra-cam .cam-last img[hidden], .ra-cam .cam-count[hidden]{display:none;}
  .ra-cam .cam-count{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;border-radius:11px;background:var(--accent);
    color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px;}
  .ra-cam .cam-shutter{width:78px;height:78px;border-radius:50%;border:4px solid #fff;background:transparent;padding:5px;cursor:pointer;}
  .ra-cam .cam-shutter i{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .12s;}
  .ra-cam .cam-shutter:active i{transform:scale(.86);}
  .ra-cam .cam-shutter:disabled{opacity:.35;}
  .ra-cam .cam-done{justify-self:end;background:#fff;color:#111;border:none;border-radius:999px;padding:12px 20px;font-weight:700;
    font-size:14px;cursor:pointer;font-family:inherit;}
  .ra-cam .cam-msg{position:absolute;left:18px;right:18px;top:50%;transform:translateY(-50%);background:#fff;color:var(--ink);
    padding:20px;border-radius:14px;z-index:3;font-size:13.5px;line-height:1.5;max-height:70vh;overflow:auto;}
  .ra-cam .cam-msg[hidden]{display:none;}
  .ra-cam .cam-msg p{margin:8px 0;}
  .ra-cam .cam-msg ul{margin:8px 0 14px;padding-left:18px;}
  .ra-cam .cam-msg li{margin-bottom:6px;}

  .ra-pid{position:fixed;inset:0;z-index:260;background:rgba(10,12,16,.55);display:flex;align-items:flex-end;justify-content:center;}
  .ra-pid-card{background:#fff;color:var(--ink);width:100%;max-width:520px;border-radius:18px 18px 0 0;
    padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:raHojaSube .22s ease-out;}
  /* Nombre propio: raSube ya es la animación de las partículas que suben (murciélagos, corazones, chispas) */
  @keyframes raHojaSube{from{transform:translateY(30px);opacity:0;}to{transform:none;opacity:1;}}

  .ra-sheet{position:fixed;inset:0;z-index:220;background:rgba(10,12,16,0);display:flex;align-items:flex-end;justify-content:center;transition:background .18s;}
  .ra-sheet.on{background:rgba(10,12,16,.5);}
  .ra-sheet-card{background:#fff;color:var(--ink);width:100%;max-width:520px;border-radius:18px 18px 0 0;
    padding:16px 14px calc(14px + env(safe-area-inset-bottom,0px));animation:raHojaSube .2s ease-out;}
  .ra-sheet-t{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding:2px 6px 10px;}
  .ra-sheet-op{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:#F6F7F9;border:1px solid var(--line);
    border-radius:12px;padding:14px;margin-bottom:9px;cursor:pointer;color:var(--ink);font-family:inherit;}
  .ra-sheet-op:disabled{opacity:.45;cursor:default;}
  .ra-sheet-op .i{width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:18px;}
  .ra-sheet-op b{display:block;font-size:15px;}
  .ra-sheet-op small{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .ra-sheet-cancel{width:100%;background:none;border:none;color:var(--ink-mid);font-weight:600;font-size:14px;padding:12px;cursor:pointer;font-family:inherit;}

  .ra-gal{position:fixed;inset:0;z-index:210;background:#F3F4F6;color:var(--ink);display:flex;flex-direction:column;}
  .ra-gal-head{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;background:#fff;border-bottom:1px solid var(--line);}
  .ra-gal-head .tt{flex:1;min-width:0;}
  .ra-gal-head .a{font-size:17px;font-weight:700;}
  .ra-gal-head .b{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ra-gal-head .ra-btn{margin:0;width:auto;}
  .ra-gal-cam{margin:12px 14px 0;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--accent);color:#fff;
    border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
  .ra-gal-body{flex:1;overflow:auto;padding:12px 14px 110px;-webkit-overflow-scrolling:touch;}
  .ra-gal-grupo{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;}
  .ra-gal-grupo.actual{border:2px solid var(--conforme);}
  .ra-gal-grupo.sinid{border-style:dashed;}
  .ra-gal-gh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;width:100%;
    background:none;border:none;padding:0;text-align:left;color:inherit;font-family:inherit;}
  .ra-gal-toggle{cursor:pointer;margin-bottom:0;}
  .ra-gal-grupo.usadas .ra-gal-grid{margin-top:10px;}
  .ra-gal-gh .n{font-size:14.5px;font-weight:700;}
  .ra-gal-gh .m{font-size:12px;color:var(--ink-soft);margin-top:2px;line-height:1.4;}
  .ra-gal-gh .m .w{color:var(--defecto);}
  .ra-gal-gh .ra-link{white-space:nowrap;padding:4px 0;}
  .ra-gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;}
  .ra-gal-tile{position:relative;aspect-ratio:1;border:none;padding:0;border-radius:8px;overflow:hidden;background:#E3E6EA;cursor:pointer;}
  .ra-gal-tile img{width:100%;height:100%;object-fit:cover;display:block;}
  .ra-gal-tile .t{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));padding:12px 5px 4px;text-align:left;}
  .ra-gal-tile .p{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;border-radius:4px;padding:1px 5px;}
  .ra-gal-tile .ck{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.3);
    color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .ra-gal-tile.sel{outline:3px solid var(--accent);outline-offset:-3px;}
  .ra-gal-tile.sel .ck{background:var(--accent);border-color:var(--accent);}
  .ra-gal-tile.usada img{filter:saturate(.35);opacity:.8;}
  .ra-gal-bar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(0,0,0,.08);flex-wrap:wrap;}
  .ra-gal-bar span{flex:1;min-width:120px;font-size:13px;font-weight:600;}
  .ra-gal-bar .ra-btn{margin:0;width:auto;}
  .ra-gal-bar.acciones .ra-btn{flex:1 1 auto;}
  html[data-oscuro="1"] .ra-gal, html[data-oscuro="1"] .ra-gal-head, html[data-oscuro="1"] .ra-gal-grupo,
  html[data-oscuro="1"] .ra-gal-bar, html[data-oscuro="1"] .ra-sheet-card, html[data-oscuro="1"] .ra-pid-card{background:#1B1F26;color:#E8EAED;border-color:#2C323C;}
  html[data-oscuro="1"] .ra-gal{background:#12151A;}
  html[data-oscuro="1"] .ra-sheet-op{background:#232933;border-color:#2C323C;color:#E8EAED;}
  html[data-oscuro="1"] .cam-btn.dark{color:#E8EAED;background:rgba(255,255,255,.08);}
  html[data-oscuro="1"] .ra-idcam, html[data-oscuro="1"] .ra-galbtn{background:#1B1F26;color:#E8EAED;}
  html[data-oscuro="1"] .ra-gal-aviso, html[data-oscuro="1"] .ra-gal-sug{background:#1C2836;color:#DCE3EC;}

  /* Botones de fotos debajo del ID (el ID queda a todo lo ancho) */
  .ra-fotos-id{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 14px;}
  .ra-fotobtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 12px;
    border:1px solid var(--line-strong);background:#fff;color:var(--ink);border-radius:var(--radius);font-family:inherit;
    font-size:14px;font-weight:600;cursor:pointer;position:relative;}
  .ra-fotobtn svg{color:var(--accent);flex:0 0 auto;}
  .ra-fotobtn:active{transform:scale(.98);}
  .ra-fotobtn b{background:var(--accent);color:#fff;border-radius:999px;padding:1px 8px;font-size:11.5px;}
  html[data-oscuro="1"] .ra-fotobtn{background:#1B1F26;color:#E8EAED;}
  /* Escáner de códigos */
  .ra-scan .scan-ventana{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(86vw,470px);height:min(60vw,310px);
    border:2px solid rgba(255,255,255,.92);border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.5);z-index:1;pointer-events:none;
    overflow:hidden;transition:border-color .15s;}
  .ra-scan .scan-ventana.casi{border-color:#FFC75F;}
  .ra-scan .scan-ventana.ok{border-color:#3DDC84;border-width:3px;}
  .ra-scan .scan-linea{position:absolute;left:5%;right:5%;top:8%;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent);
    animation:raScanLinea 1.9s ease-in-out infinite alternate;}
  .ra-scan .scan-ventana.ok .scan-linea{display:none;}
  @keyframes raScanLinea{to{top:92%;}}
  .ra-scan .scan-pie{position:absolute;left:0;right:0;bottom:0;z-index:2;text-align:center;
    padding:18px 16px calc(26px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.78));}
  .ra-scan .scan-zoom{display:flex;justify-content:center;gap:8px;margin-bottom:14px;}
  .ra-scan .scan-zoom[hidden]{display:none;}
  .ra-scan .scan-zoom button{background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;
    min-width:50px;padding:9px 12px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;}
  .ra-scan .scan-zoom button.on{background:#fff;color:#111;}
  .ra-scan .scan-estado{font-size:15px;font-weight:600;}
  .ra-scan .scan-motor{font-size:11.5px;opacity:.65;margin-top:4px;}
  .ra-scan .scan-val{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;background:#F4F5F7;color:var(--ink);
    padding:10px 12px;border-radius:8px;font-size:15px;margin:10px 0 4px;max-height:30vh;overflow:auto;}

  /* ===== Escenas con personajes (pantalla de inicio, temporadas) ===== */
  .ra-escena{position:absolute;left:0;right:0;bottom:0;height:clamp(130px,26vh,300px);pointer-events:none;}
  .ra-escena svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible;}
  .ra-escena .flota{animation:raFlota 3s ease-in-out infinite alternate;}
  @keyframes raFlota{from{transform:translateY(2px);}to{transform:translateY(-9px);}}
  .ra-escena .mece{animation:raMece 2.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%;}
  @keyframes raMece{from{transform:rotate(-5deg);}to{transform:rotate(5deg);}}
  .ra-escena .parpadea{animation:raParpadeo 4.6s infinite;transform-box:fill-box;transform-origin:center;}
  @keyframes raParpadeo{0%,89%,100%{transform:scaleY(1);}93%{transform:scaleY(.08);}}
  .ra-escena .titila{animation:raTitila 1.8s ease-in-out infinite;}
  @keyframes raTitila{0%,100%{opacity:.3;}50%{opacity:1;}}
  .ra-escena .latido{animation:raLatidoE 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
  @keyframes raLatidoE{0%,100%{transform:scale(1);}15%{transform:scale(1.14);}30%{transform:scale(1);}45%{transform:scale(1.08);}}
  .ra-escena .gira{animation:raGira 2.2s linear infinite;transform-box:fill-box;transform-origin:center;}

  /* Escribe muchas operaciones en lotes (máx. 450 operaciones o ~8 MB por lote) */
  function commitEnLotes(ops, progreso){
    var lotes=[], actual=[], bytes=0;
    ops.forEach(function(op){
      var tam = op.data ? JSON.stringify(op.data).length : 100;
      if(actual.length && (actual.length>=450 || bytes+tam>8000000)){ lotes.push(actual); actual=[]; bytes=0; }
      actual.push(op); bytes+=tam;
    });
    if(actual.length) lotes.push(actual);
    var i=0;
    function siguiente(){
      if(i>=lotes.length) return Promise.resolve(ops.length);
      var b=writeBatch(db);
      lotes[i].forEach(function(op){
        if(op.tipo==='delete') b.delete(op.ref);
        else b.set(op.ref, op.data, op.merge?{merge:true}:{});
      });
      return b.commit().then(function(){ i++; if(progreso) progreso(i, lotes.length); return siguiente(); });
    }
    return siguiente();
  }

  }
  function upsertPerfil(p){
    var l = perfilesLocales(), prev = l.filter(function(x){ return x.usuario===p.usuario; })[0];
    if(prev && prev.uid===p.uid && !p.pinHash){ p.pinHash = prev.pinHash; p.salt = prev.salt; }
    l = l.filter(function(x){ return x.usuario!==p.usuario; });
    l.push({usuario:p.usuario, nombre:p.nombre, email:p.email||'', uid:p.uid, rol:p.rol||'inspector',
            pinHash:p.pinHash||'', salt:p.salt||''});
    guardarPerfiles(l);
  }
  function quitarPerfil(usuario){ guardarPerfiles(perfilesLocales().filter(function(x){ return x.usuario!==usuario; })); }
  function perfilLocal(usuario){ return perfilesLocales().filter(function(x){ return x.usuario===usuario; })[0] || null; }

  /* Huella del PIN (PBKDF2) para poder desbloquear sin señal. El PIN nunca se guarda. */
  function hashPin(pin, salt){
    if(!(window.crypto && crypto.subtle && window.TextEncoder)) return Promise.resolve('');
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveBits']).then(function(k){
      return crypto.subtle.deriveBits({name:'PBKDF2', salt:enc.encode(salt), iterations:120000, hash:'SHA-256'}, k, 256);
    }).then(function(bits){
      return Array.prototype.map.call(new Uint8Array(bits), function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
    }).catch(function(){ return ''; });
  }
  function guardarPerfilConPin(p, pin){
    var salt = p.uid + '.' + Math.random().toString(36).slice(2);
    return hashPin(pin, salt).then(function(h){
      upsertPerfil({usuario:p.usuario, nombre:p.nombre, email:(auth.currentUser&&auth.currentUser.email)||p.email||'',
                    uid:p.uid, rol:p.rol, pinHash:h, salt:h?salt:''});
    });
  }
  function cargarPerfil(uid){
    return getDoc(ref(COL.usuarios, uid)).then(function(s){
      return s.exists() ? Object.assign({}, s.data(), {uid:uid}) : null;
    });

  /* Revisa (sin iniciar sesión) que los perfiles de este equipo sigan activos.
     Solo consulta cada usuario por su nombre exacto; nunca lista a todos. */
  var verificando = false;
  function verificarPerfiles(){
    if(verificando || !navigator.onLine) return;
    var l = perfilesLocales();
    if(!l.length) return;
    verificando = true;
    Promise.all(l.map(function(p){
      return getDoc(ref(COL.alias, p.usuario)).then(function(s){
        if(!s.exists() || !s.data().activo) return {usuario:p.usuario, quitar:true};
        var a = s.data();
        if(a.uid !== p.uid) return {usuario:p.usuario, uid:a.uid, email:a.email};
        return null;
      }).catch(function(){ return null; });
    })).then(function(res){
      var cambio = false, lista = perfilesLocales();
      res.forEach(function(r){
        if(!r) return;
        cambio = true;
        if(r.quitar) lista = lista.filter(function(x){ return x.usuario!==r.usuario; });
        else lista.forEach(function(x){ if(x.usuario===r.usuario){ x.uid=r.uid; x.email=r.email; x.pinHash=''; x.salt=''; } });
      });
      verificando = false;
      if(cambio){ guardarPerfiles(lista); if(!S.inspector) render(); }
    });
  }

    function errEscucha(e){
      console.error(e);

        /* Inspector recién entrado: su sesión puede tardar un momento en llegar a la nube */
        if(S.perfil && S.perfil.anonimo && !S.reintentoPermiso){

            .catch(function(){}).then(function(){ return esperar(1500); })

    unsubs.push(onSnapshot(ref(COL.config,'catalogos'), function(s){

  function migrarGrados(cat){
    if(!cat.grados || !cat.grados.length) cat.grados = JSON.parse(JSON.stringify(DEFAULT_GRADOS));
    cat.grados = cat.grados.map(function(g){
      if(typeof g === 'string') return {grado:g, sgf:'', familia:''};
      if(g.sgf === undefined) return {grado:g.grado, sgf:g.familia||'', familia:''};
      return g;
    });
    if(!cat.zonas || !cat.zonas.length) cat.zonas = DEFAULT_ZONAS.slice();
    if(!cat.medios) cat.medios = DEFAULT_MEDIOS.slice();
    if(!cat.defectosActivos) cat.defectosActivos = DEFAULT_DEFECTOS_ACTIVOS.slice();
    /* Una sola vez: se habilita el defecto Atorón (260). Si luego se desactiva, se respeta. */
    if(!cat.atoron260){
      cat.atoron260 = true;
      if(cat.defectosActivos.indexOf('260')===-1) cat.defectosActivos.push('260');
      cat._migrado = true;
    }
    if(!cat.defectosExtra) cat.defectosExtra = [];
    if(!cat.enrolladores) cat.enrolladores = ['Enrollador 1','Enrollador 2','Enrollador 3'];
    return cat;

     solo los administradores las modifican (reglas de Firestore). */
  function inspectoresActivos(){
    var m = S.inspectoresPub || {};
    return Object.keys(m).map(function(id){ return Object.assign({id:id}, m[id]); })
      .filter(function(i){ return i.activo; })
      .sort(function(a,b){ return String(a.nombre).localeCompare(String(b.nombre)); });
  }
  function adminsVisibles(){
    var l = ((S.adminsPub && S.adminsPub.lista) || []).filter(function(a){ return a.activo; });
    if(!l.length) l = perfilesLocales().filter(function(p){ return p.rol==='admin'; })
      .map(function(p){ return {usuario:p.usuario, nombre:p.nombre, principal:false}; });
    return l.slice().sort(function(a,b){ return (b.principal?1:0)-(a.principal?1:0) || String(a.nombre).localeCompare(String(b.nombre)); });
  }
  function soyPrincipal(){ return !!(S.isAdmin && S.perfil && S.adminsPub && S.adminsPub.principal===S.perfil.uid); }
  function sinAcentos(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

  function escucharPublico(){
    S.inspectoresPub = get('pubInspectores', {}) || {};
    S.adminsPub = get('pubAdmins', null);
    aplicarConfigTema(get('tema', 'negro'));
    aplicarOscuro(get('oscuro', false));
    onSnapshot(ref(COL.publico,'tema'), function(s){
      if(!s.exists() && s.metadata.fromCache) return;
      var v = normCfg(s.exists() ? s.data() : 'negro');
      lset('tema', v);
      if(!mismaCfg(v, temaCfg) || !mismoTema(temaEfectivo(v))){ aplicarConfigTema(v); marcarCambios(); }
    }, function(e){ console.error(e); });
    onSnapshot(ref(COL.publico,'inspectores'), {includeMetadataChanges:true}, function(s){
      S.inspectoresPub = s.exists() ? (s.data().mapa || {}) : {};
      lset('pubInspectores', S.inspectoresPub);
      var p = S.perfil;
      if(p && p.anonimo && !s.metadata.fromCache){
        var yo = S.inspectoresPub[p.inspectorId];
        if(!yo || !yo.activo){ toast('Tu nombre fue desactivado por el administrador'); cerrarSesion(false); return; }
      }
      marcarCambios();
    }, function(e){ console.error(e); });
    onSnapshot(ref(COL.publico,'admins'), {includeMetadataChanges:true}, function(s){
      S.adminsPubVacio = !s.exists() && !s.metadata.fromCache;
      if(s.exists()){ S.adminsPub = s.data(); lset('pubAdmins', S.adminsPub); }
      else if(!s.metadata.fromCache){ S.adminsPub = null; lset('pubAdmins', null); }
      if(S.adminsPubVacio) reclamarPrincipal();
      sincronizarPublicoAdmins(); migrarInspectoresAntiguos();
      marcarCambios();
    }, function(e){ console.error(e); });
  }

  /* El primer administrador que entra tras la actualización queda como principal */
  var reclamando = false;
  function reclamarPrincipal(){
    if(reclamando || !S.isAdmin || !S.perfil || S.perfil.anonimo || !navigator.onLine) return;
    reclamando = true;
    setDoc(ref(COL.publico,'admins'), {principal:S.perfil.uid,
      lista:[{uid:S.perfil.uid, usuario:S.perfil.usuario||'', nombre:S.perfil.nombre||'', activo:true, principal:true}]})
      .then(function(){ auditar('edicion','','Administrador principal: '+S.perfil.nombre,''); toast('Quedaste como administrador principal'); })
      .catch(function(e){ console.error(e); })
      .then(function(){ reclamando = false; });
  }
  /* El principal mantiene al día la lista pública de administradores */
  function normAdmin(a){ return {uid:a.uid, usuario:a.usuario||'', nombre:a.nombre||'', activo:!!a.activo, principal:!!a.principal}; }
  function porUid(a,b){ return a.uid<b.uid?-1:a.uid>b.uid?1:0; }
  function sincronizarPublicoAdmins(){
    if(!soyPrincipal() || !S.usuariosCargados) return;
    var pr = S.adminsPub.principal;
    var lista = S.usuarios.filter(function(u){ return u.rol==='admin' && !u.reemplazadoPor && !u.eliminado; })
      .map(function(u){ return normAdmin({uid:u.uid, usuario:u.usuario, nombre:u.nombre, activo:u.activo, principal:u.uid===pr}); }).sort(porUid);
    var actual = (S.adminsPub.lista||[]).map(normAdmin).sort(porUid);
    if(JSON.stringify(lista)!==JSON.stringify(actual))
      escribir(setDoc(ref(COL.publico,'admins'), {principal:pr, lista:lista}));
  }
  /* Cuentas antiguas: los inspectores que tenían usuario y PIN pasan a la lista sin
     contraseña y su cuenta vieja se BORRA (perfil y usuario), igual que las versiones
     anteriores de un administrador tras restablecer su contraseña. Así el nombre de
     usuario queda libre y no aparece nada "desactivado". Las inspecciones se conservan. */
  var migrando = false;
  function migrarInspectoresAntiguos(){
    if(migrando || !soyPrincipal() || !S.usuariosCargados || !navigator.onLine) return;
    var pr = S.perfil.uid;
    var borrar = S.usuarios.filter(function(u){
      return u.uid!==pr && (u.rol!=='admin' || u.reemplazadoPor || u.eliminado);
    });
    migrando = true;
    getDocs(collection(db, COL.alias)).catch(function(){ return null; }).then(function(qa){
      var quedan = {}, usuariosQuedan = {};
      S.usuarios.forEach(function(u){
        if(borrar.indexOf(u)<0){ quedan[u.uid] = true; if(u.usuario) usuariosQuedan[u.usuario] = true; }
      });
      var idsBorrar = {}; borrar.forEach(function(u){ idsBorrar[u.uid] = true; });
      var aliasBorrar = {};
      borrar.forEach(function(u){ if(u.usuario && !usuariosQuedan[u.usuario]) aliasBorrar[u.usuario] = true; });
      if(qa) qa.docs.forEach(function(d){
        var x = d.data() || {};
        /* alias que apunta a una cuenta que ya no existe o que se va a borrar */
        if(!quedan[x.uid] && (x.activo!==true || idsBorrar[x.uid] || !x.uid)) aliasBorrar[d.id] = true;
      });
      var aliases = Object.keys(aliasBorrar);
      if(!borrar.length && !aliases.length) return recuperarUsuarios(qa);
      var nuevos = borrar.filter(function(u){ return u.rol!=='admin' && !u.reemplazadoPor && !u.migradoA; });
      var existentes = S.inspectoresPub || {}, mapa = {};
      nuevos.forEach(function(u){
        var ya = Object.keys(existentes).concat(Object.keys(mapa)).some(function(k){
          var n = (existentes[k] || mapa[k]).nombre; return sinAcentos(n)===sinAcentos(u.nombre);
        });
        if(!ya) mapa['u_'+(u.usuario||u.uid)] = {nombre:u.nombre, activo:!!u.activo, creado:u.creado||Date.now(), creadoPor:'Migración'};
      });
      var ops = borrar.map(function(u){ return {tipo:'delete', ref:ref(COL.usuarios, u.uid)}; })
        .concat(aliases.map(function(a){ return {tipo:'delete', ref:ref(COL.alias, a)}; }));
      if(Object.keys(mapa).length) ops.unshift({tipo:'set', ref:ref(COL.publico,'inspectores'), data:{mapa:mapa}, merge:true});
      return commitEnLotes(ops).then(function(){
        if(Object.keys(mapa).length){
          var nombres = Object.keys(mapa).map(function(k){ return mapa[k].nombre; });
          auditar('edicion','','Inspectores pasados al acceso sin contraseña: '+nombres.join(', '),'');
          toast(nombres.length+' inspector(es) pasados a la lista sin contraseña');
        }
        return recuperarUsuarios(null);
      });
    }).catch(errFirebase).then(function(){ migrando = false; });
  }
  /* Si un administrador recibió un usuario con número (dayanamorales2) porque el
     nombre estaba ocupado por una cuenta vieja, al liberarse recupera el usuario limpio. */
  function recuperarUsuarios(qa){
    var cands = S.usuarios.filter(function(u){
      if(u.rol!=='admin' || u.reemplazadoPor || u.eliminado || !u.usuario) return false;
      var base = usuarioDesdeNombre(u.nombre || '');
      return u.usuario!==base && new RegExp('^'+base+'\\d+$').test(u.usuario);
    });
    if(!cands.length) return Promise.resolve();
    return Promise.all(cands.map(function(u){
      var base = usuarioDesdeNombre(u.nombre);
      return getDoc(ref(COL.alias, base)).then(function(s){
        if(s.exists()) return;
        var b = writeBatch(db);
        b.set(ref(COL.alias, base), {uid:u.uid, email:u.email||correoDe(u.usuario, u.version), activo:!!u.activo});
        b.delete(ref(COL.alias, u.usuario));
        b.update(ref(COL.usuarios, u.uid), {usuario:base});
        return b.commit().then(function(){ toast('Usuario de '+u.nombre+': '+base); });
      });
    }));
  }

  /* Alta y baja de inspectores (ambos administradores) */
  function agregarInspector(nombre){
    var id = 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), m = {};
    m[id] = {nombre:nombre, activo:true, creado:Date.now(), creadoPor:S.inspector||''};
    S.inspectoresPub[id] = m[id];
    escribir(setDoc(ref(COL.publico,'inspectores'), {mapa:m}, {merge:true}));

    delete S.inspectoresPub[id];
    escribir(setDoc(ref(COL.publico,'inspectores'), {mapa:m}, {merge:true}));

  function cambiarInspectorActivo(id, activo){

    var m = {}; m[id] = {activo:activo};
    i.activo = activo;
    escribir(setDoc(ref(COL.publico,'inspectores'), {mapa:m}, {merge:true}));

    toast(activo?'Inspector reactivado':'Inspector desactivado');
