  /* Entrada de inspector: sin contraseña, con una sesión anónima de Firebase
     ligada a su nombre (sesiones/{uid}). */
  function esperar(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function entrarInspector(id){
    var i = S.inspectoresPub[id];
    if(S.loginBusy) return;
    if(!i || !i.activo){ toast('Ese nombre ya no está activo'); return; }
    S.loginBusy = true; S.loginError = ''; render();
    var u = auth.currentUser, paso;
    if(u && u.isAnonymous) paso = Promise.resolve(u);
    else if(!navigator.onLine) paso = Promise.reject({code: u ? 'app/sin-senal-admin' : 'app/sin-senal-nuevo'});
    else paso = (u ? signOut(auth) : Promise.resolve()).then(function(){ return signInAnonymously(auth); })
                  .then(function(c){ return c.user; });
    paso.then(function(user){
      var perfil = {uid:user.uid, inspectorId:id, usuario:id, nombre:i.nombre, rol:'inspector', activo:true, anonimo:true};
      var w = setDoc(ref(COL.sesiones, user.uid), {inspectorId:id, nombre:i.nombre, ts:Date.now()});
      var listo = navigator.onLine ? Promise.race([w, esperar(8000)]) : (w.catch(function(e){ console.error(e); }), Promise.resolve());
      return listo.then(function(){
        lset('inspectorSesion', perfil);
        S.loginBusy = false;
        activarSesion(perfil, true);
      });
    }).catch(function(e){
      console.error(e);
      var c = (e && e.code) || '';
      S.loginBusy = false;
      S.loginError = c==='app/sin-senal-admin' ? 'Sin conexión. En este equipo estaba un administrador; para entrar como inspector se necesita señal.'
        : c==='app/sin-senal-nuevo' ? 'Sin conexión. La primera vez en este equipo se necesita señal.'
        : (c==='auth/operation-not-allowed' || c==='auth/admin-restricted-operation') ? 'El acceso sin contraseña no está habilitado en Firebase. Avisa al administrador.'
        : c==='permission-denied' ? 'Ese nombre ya no está activo.'
        : 'No se pudo entrar. Revisa la señal e inténtalo de nuevo.';
      render();
    });
  }

  /* ============ SESIÓN ============ */
  var inactTimer=null;
  function limpiarPantallas(){
    S.tab='captura';
    resetCaptureFlow();
    S.editReg=null; S.trackVista='lista'; S.trackRollo=null;
    S.trackModoSel=false; S.trackSeleccion=[];
    S.loginStep='pick'; S.loginPickedUser=null; S.loginError=''; S.loginBusy=false;
    S.showChangePin=false; S.resetUid=null; S.repSel=null;
  }
  /* Bloqueo (inactividad): la cuenta sigue abierta en Firebase para poder volver a
     entrar con el PIN aunque no haya señal. */
  function bloquear(porInactividad){
    detenerEscuchas();
    S.inspector=null; S.isAdmin=false; S.perfil=null; S.usuarios=[]; S.auditoria=[]; S.usuariosCargados=false;
    lset('sesionAbierta', null);
    limpiarPantallas();
    S.perfiles = perfilesLocales();
    render();
    if(porInactividad) toast('Sesión cerrada por inactividad');
    verificarPerfiles();
  }
  /* Cierre de sesión completo (botón "Cerrar sesión" o cuenta desactivada) */
  function cerrarSesion(porInactividad){
    var anonimo = !!(auth.currentUser && auth.currentUser.isAnonymous);
    bloquear(porInactividad);
    lset('inspectorSesion', null);
    /* La sesión anónima se conserva para que otro inspector pueda entrar sin señal */
    if(!anonimo) signOut(auth).catch(function(){});
  }
  /* El temporizador (setTimeout) no corre mientras el teléfono está bloqueado o el
     navegador en segundo plano, así que por sí solo NO basta para cerrar la sesión:
     si el equipo estuvo dormido 20 minutos con un límite de 3, el timer nunca llegó
     a dispararse y al volver seguía "esperando". Por eso, además del temporizador
     (que sirve mientras la pantalla sigue encendida), guardamos la hora real de la
     última actividad y, cada vez que la app vuelve a primer plano, comparamos el
     reloj: si ya pasó el límite, se bloquea de inmediato en vez de reiniciar el conteo. */
  var ULTIMA_ACTIVIDAD_KEY = 'ultimaActividad';
  function marcarActividad(){ lset(ULTIMA_ACTIVIDAD_KEY, Date.now()); }
  function programarInactividad(){
    if(inactTimer) clearTimeout(inactTimer);
    if(!S.inspector) return;
    var mins = minutosBloqueo();
    if(!mins) return;
    inactTimer = setTimeout(function(){ revisarInactividad(); }, mins*60*1000);
  }
  function revisarInactividad(){
    if(!S.inspector) return;
    var mins = minutosBloqueo();
    if(!mins){ if(inactTimer) clearTimeout(inactTimer); return; }
    var ultima = get(ULTIMA_ACTIVIDAD_KEY, null);
    if(ultima!=null && (Date.now()-ultima) >= mins*60*1000){ bloquear(true); return; }
    programarInactividad();
  }
  function reiniciarInactividad(){ marcarActividad(); revisarInactividad(); }
  ['click','keydown','touchstart','focusin'].forEach(function(ev){
    document.addEventListener(ev, reiniciarInactividad, {passive:true});
  });
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) revisarInactividad();
  });
  window.addEventListener('focus', revisarInactividad);
  window.addEventListener('pageshow', revisarInactividad);

  function activarSesion(perfil, bienvenida){
    S.perfil = perfil; S.inspector = perfil.nombre; S.isAdmin = perfil.rol==='admin';
    S.reintentoPermiso = false;
    lset('sesionAbierta', perfil.uid);
    limpiarPantallas();
    iniciarEscuchas();
    if(S.isAdmin && S.adminsPubVacio) reclamarPrincipal();
    if(bienvenida) mostrarBienvenida(perfil.nombre);
    render();
  }
  function falloLogin(msg){
    S.loginBusy=false; S.loginError=msg; render(); sacudir('.ra-gate-card');
    setTimeout(function(){ var i=root.querySelector('#login-pin-input'); if(i){ i.value=''; i.focus(); } },60);
  }
  function mensajeAuth(e){
    var c = (e && e.code) || '';
    if(c==='app/inactivo') return 'Esta cuenta está desactivada. Consulta al administrador.';
    if(c==='auth/too-many-requests') return 'Demasiados intentos. Espera unos minutos e inténtalo de nuevo.';
    if(c==='auth/network-request-failed' || c==='unavailable') return 'Sin conexión. Revisa la señal e inténtalo de nuevo.';
    if(c==='app/no-admin') return 'Los inspectores ya no usan contraseña: regresa y toca tu nombre en la lista.';
    if(c.indexOf('auth/')===0 || c==='app/no-usuario') return 'Usuario o contraseña incorrectos';
    return 'No se pudo iniciar sesión';
  }
  function iniciarSesion(usuario, pin){
    usuario = normUsuario(usuario);
    if(!usuarioValido(usuario)){ falloLogin('Escribe tu usuario (3 a 20 letras o números, sin espacios)'); return; }
    if(!passValida(pin)){ falloLogin('La contraseña lleva al menos '+PASS_MIN+' caracteres'); return; }
    S.loginBusy=true; S.loginError=''; render();
    var local = perfilLocal(usuario);
    if(!navigator.onLine){ intentarSinSenal(usuario, pin, local); return; }
    getDoc(ref(COL.alias, usuario)).then(function(s){
      if(!s.exists()) throw {code:'app/no-usuario'};
      if(!s.data().activo) throw {code:'app/inactivo'};
      return s.data().email;
    }, function(){
      return local && local.email ? local.email : correoDe(usuario);
    }).then(function(email){
      return signInWithEmailAndPassword(auth, email, pin);
    }).then(function(cred){
      return cargarPerfil(cred.user.uid).then(function(p){
        if(!p || !p.activo) return signOut(auth).then(function(){ throw {code:'app/inactivo'}; });
        if(p.rol!=='admin') return signOut(auth).then(function(){ throw {code:'app/no-admin'}; });
        return guardarPerfilConPin(p, pin).then(function(){ activarSesion(p, true); });
      });
    }).catch(function(e){
      if(e && e.code==='auth/network-request-failed'){ intentarSinSenal(usuario, pin, local); return; }
      if(e && e.code==='app/inactivo') quitarPerfil(usuario);
      falloLogin(mensajeAuth(e));
    });
  }
  /* Sin señal solo puede volver a entrar quien dejó su cuenta abierta en este equipo */
  function intentarSinSenal(usuario, pin, local){
    var u = auth.currentUser;
    if(!local || !u || u.uid!==local.uid || !local.pinHash || local.rol!=='admin'){
      falloLogin('Sin conexión. Sin señal solo puede entrar quien fue el último en usar este equipo.'); return;
    }
    hashPin(pin, local.salt).then(function(h){
      if(h!==local.pinHash){ falloLogin('Contraseña incorrecta'); return; }
      cargarPerfil(u.uid).then(function(p){
        if(p && !p.activo){ quitarPerfil(usuario); falloLogin(mensajeAuth({code:'app/inactivo'})); return; }
        activarSesion(p || {uid:u.uid, usuario:local.usuario, nombre:local.nombre, rol:local.rol, activo:true}, true);
      }).catch(function(){
        activarSesion({uid:u.uid, usuario:local.usuario, nombre:local.nombre, rol:local.rol, activo:true}, true);
      });
    });
  }

  function init(){
    S.catalogs      = migrarGrados({});
    S.variacionesCat= copia(DEFAULT_VARIACIONES);
    S.perfiles      = perfilesLocales();
    escucharPublico();
    render();
    var arrancado = false;
    onAuthStateChanged(auth, function(user){
      if(!arrancado){
        arrancado = true; S.cargando = false;
        var abierta = get('sesionAbierta', null);
        if(user && abierta===user.uid && user.isAnonymous){
          var ip = get('inspectorSesion', null), pub = ip ? S.inspectoresPub[ip.inspectorId] : null;
          if(ip && ip.uid===user.uid && (!pub || pub.activo)) activarSesion(ip, false); else render();
        } else if(user && abierta===user.uid){
          var l = perfilesLocales().filter(function(x){ return x.uid===user.uid; })[0];
          cargarPerfil(user.uid).then(function(p){
            if(p && p.activo) activarSesion(p, false); else cerrarSesion(false);
          }).catch(function(){
            if(l) activarSesion({uid:user.uid, usuario:l.usuario, nombre:l.nombre, rol:l.rol, activo:true}, false);
            else render();
          });
        } else render();
        verificarPerfiles();
        return;
      }
      if(!user && S.inspector) bloquear(false);
    });
  }

  /* ============ HELPERS ============ */
  function el(html){ var d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }
  function escHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  var escAttr = escHtml;
  function pad(n){ return (n<10?'0':'')+n; }
  function fechaHoy(d){ d=d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function horaAhora(d){ d=d||new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
  function usuarioActual(){ return S.inspector || 'Administrador'; }
  /* Turno 1: 19:00 a 06:59 · Turno 2: 07:00 a 18:59 */
  function turnoDe(d){ d=d||new Date(); var h=d.getHours(); return (h>=7 && h<19) ? '2' : '1'; }
  function soloNumero(txt){
    var v = String(txt||'').replace(/[^0-9.]/g,'');
    var partes = v.split('.');
    if(partes.length > 2) v = partes[0] + '.' + partes.slice(1).join('');
    return v;
  }
  function buscarGrado(grado){
    return (S.catalogs.grados||[]).filter(function(x){ return x.grado===grado; })[0] || null;
  }
  function familiaDeGrado(grado){
    var g=buscarGrado(grado);
    return g ? (g.sgf||'') : '';
  }
  function descripcionDeGrado(grado){
    var g=buscarGrado(grado);
    return g ? (g.familia||'') : '';
  }
  function gradoValido(g){ return !g || !!buscarGrado(g); }
  function zonas(){ return S.catalogs.zonas || DEFAULT_ZONAS; }

  function auditar(tipo, rolloId, detalle, motivo){
    var now=new Date();
    var a = {
      id:'a'+now.getTime()+Math.random().toString(36).slice(2,6), ts:now.getTime(),
      fecha:fechaHoy(now), hora:horaAhora(now), turno:turnoDe(now), usuario:usuarioActual(),
      uid:S.perfil?S.perfil.uid:'',
      tipo:tipo, rolloId:rolloId||'', detalle:detalle||'', motivo:motivo||''
    };
    if(S.isAdmin) S.auditoria.unshift(a);
    escribir(setDoc(ref(COL.auditoria, a.id), a));
  }
  /* Trazabilidad de accesos: quién consultó o descargó qué reporte y cuándo.
     Se guarda aparte del reporte de movimientos (no son cambios operativos) y
     no se muestra mezclado ahí; tiene su propia tarjeta, plegable, en Ajustes. */
  function registrarAcceso(detalle){ auditar('acceso', '', detalle, ''); }

  function stepOrder(){
    var steps=['id','resultado'];
    if(S.resultado==='Conforme') steps.push('confirmar');
    if(S.resultado==='Defecto' || S.resultado==='Scrap'){
      steps.push('defecto');
      steps.push('evidencia');
    }
    return steps;
  }
  function currentDefectVariaciones(){
    if(!S.defecto) return null;
    return S.variacionesCat[S.defecto.code] || null;
  }
  function isInsecureContext(){
    return (location.protocol==='file:') || (!window.isSecureContext && location.hostname!=='localhost');
  }

  /* ============ RENDER ============ */
  function render(){
    S.dirty = false;
    document.body.classList.toggle('ra-en-gate', !S.inspector);
    document.documentElement.classList.toggle('ra-gate-html', !S.inspector);
    if(!S.inspector){ root.innerHTML = renderGate(); bindEvents(); return; }
    var body;
    if(S.tab==='captura') body = renderCaptura();
    else if(S.tab==='rollos') body = renderTracking();
    else if(S.tab==='historial') body = renderHistorial();
    else body = renderAjustes();
    root.innerHTML = renderHeader() + '<div class="ra-body">' + body + '</div>' + renderNav();
    bindEvents();
    cargarFotosPendientes();
    revisarInactividad();
  }

  function renderHeader(){
    var order=stepOrder(), idx=order.indexOf(S.step);
    var dots = order.map(function(s,i){ return '<div class="ra-step-dot'+(i<idx?' done':(i===idx?' active':''))+'"></div>'; }).join('');
    var sub = S.tab==='captura'?'INSPECCIÓN DE ROLLOS':S.tab==='rollos'?'UBICACIÓN DE ROLLOS':S.tab==='historial'?'HISTORIAL':'AJUSTES';
    return '<div class="ra-header">' +
        '<button class="ra-home" id="btn-home" aria-label="Ir al inicio">' + logoSVG() + '<div class="sub">' + sub + '</div></button>' +
        '<button class="ra-user" id="btn-user">' + escHtml(usuarioActual()) + '</button>' +
      '</div>' +
      (S.tab==='captura' && !S.editReg ? '<div class="ra-steps">'+dots+'</div>' : '') +
      (temaActual==='findeanio' ? '<div class="ra-cuenta-bar" data-cuenta="barra">'+cuentaHTML('barra')+'</div>' : '') + bannerConexion();
  }

  function renderNav(){
    return '<div class="ra-nav">' +
      '<button data-tab="captura" class="'+(S.tab==='captura'?'active':'')+'"><span class="ico">▣</span>CAPTURAR</button>' +
      '<button data-tab="rollos" class="'+(S.tab==='rollos'?'active':'')+'"><span class="ico">◎</span>UBICACIÓN</button>' +
      '<button data-tab="historial" class="'+(S.tab==='historial'?'active':'')+'"><span class="ico">▤</span>HISTORIAL</button>' +
      '<button data-tab="ajustes" class="'+(S.tab==='ajustes'?'active':'')+'"><span class="ico">▨</span>AJUSTES</button>' +
    '</div>';
  }

  /* ============ ACCESO ============ */
  function bannerConexion(){
    if(!S.online) return '<div class="ra-offline">Sin conexión · lo que captures se guarda aquí y se sube al volver la señal</div>';
    if(S.pendRegs || S.pendTrack) return '<div class="ra-offline sync">Sincronizando con la nube…</div>';
    return '';
  }
  /* Pantalla de inicio: secciones desplegables (una abierta a la vez) */
  var ICONO_CASCO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17h18"/><path d="M4.5 17a7.5 7.5 0 0 1 15 0"/><path d="M10 9.7V6.5h4v3.2"/><path d="M8 17v-3M16 17v-3"/></svg>';
  var ICONO_ESCUDO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.6-3 8.3-7 10-4-1.7-7-5.4-7-10V6z"/><rect x="9" y="11" width="6" height="5" rx="1"/><path d="M10.2 11V9.6a1.8 1.8 0 0 1 3.6 0V11"/></svg>';
  function avatar(nombre){
    var p = String(nombre||'?').trim().split(/\s+/), ini = (p[0]||'?').charAt(0) + (p.length>1 ? p[1].charAt(0) : '');
    var h = 0; for(var i=0; i<nombre.length; i++) h = (h*31 + nombre.charCodeAt(i)) % 360;
    return '<span class="av" style="background:linear-gradient(135deg,hsl('+h+',62%,52%),hsl('+((h+40)%360)+',58%,38%));">'+escHtml(ini.toUpperCase())+'</span>';
  }
  function seccionGate(clave, abierta, icono, titulo, sub, n, cuerpo){
    return '<div class="ra-acc'+(abierta?' open':'')+'" data-acc="'+clave+'">' +
        '<button class="ra-acc-head" data-acc-btn="'+clave+'" aria-expanded="'+abierta+'">' +
          '<span class="ra-acc-ico">'+icono+'</span>' +
          '<span class="ra-acc-txt"><b>'+titulo+'</b><i>'+sub+'</i></span>' +
          (n ? '<span class="ra-acc-cnt">'+n+'</span>' : '') +
          '<span class="ra-acc-chev">▾</span>' +
        '</button>' +
        '<div class="ra-acc-wrap"><div><div class="ra-acc-body">'+cuerpo+'</div></div></div>' +
      '</div>';
  }
  function renderGate(){
    var warn = storageOK ? '' :
      '<div class="ra-warn">El navegador está bloqueando el guardado local, algo típico del modo privado. Este equipo no podrá recordar la sesión.</div>';
    var sinSenal = S.online ? '' :
      '<div class="ra-note">Sin conexión. Los inspectores que ya entraron antes en este equipo pueden seguir entrando; lo capturado se sube al volver la señal.</div>';
    var err = S.loginError ? '<div class="ra-err">'+escHtml(S.loginError)+'</div>' : '';
    var btnEntrar = '<button class="ra-btn ra-btn-primary ra-btn-block" id="btn-login-submit" style="margin-bottom:0;"'+(S.loginBusy?' disabled':'')+'>'+(S.loginBusy?'Entrando…':'Entrar')+'</button>';
    var pinInput = '<input class="ra-input" type="password" id="login-pin-input" placeholder="Contraseña" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false"'+(S.loginBusy?' disabled':'')+'>';
    var inner;
    if(S.cargando){
      inner = '<div class="ra-gate-card"><div class="ra-h1">Conectando…</div><div class="ra-h2" style="margin-bottom:0;">Preparando la app.</div></div>';
    } else if(S.loginStep==='pin' && S.loginPickedUser){
      var p = perfilLocal(S.loginPickedUser);
      var nombre = (p && p.nombre) || S.loginPickedNombre || S.loginPickedUser;
      inner = '<div class="ra-gate-card">' +
          '<div class="ra-topbar"><button class="ra-back" id="btn-login-back">‹ Atrás</button></div>' +
          '<div class="ra-h1">'+escHtml(nombre)+'<span class="ra-pill">ADMIN</span></div>' +
          '<div class="ra-h2">Ingresa tu contraseña de administrador.</div>' + sinSenal + pinInput + err + btnEntrar +
        '</div>';
    } else if(S.loginStep==='nuevo'){
      inner = '<div class="ra-gate-card">' +
          '<div class="ra-topbar"><button class="ra-back" id="btn-login-back">‹ Atrás</button></div>' +
          '<div class="ra-h1">Entrar como administrador</div>' +
          '<div class="ra-h2">Escribe tu usuario y tu contraseña. Los inspectores no necesitan esto: solo tocan su nombre.</div>' + warn + sinSenal +
          '<label class="ra-label" for="login-usuario">USUARIO</label>' +
          '<input class="ra-input" id="login-usuario" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Ej. jperez" value="'+escAttr(S.loginUsuario)+'"'+(S.loginBusy?' disabled':'')+'>' +
          '<label class="ra-label" for="login-pin-input">CONTRASEÑA</label>' + pinInput + err + btnEntrar +
        '</div>';
    } else {
      var ins = inspectoresActivos();
      var q = sinAcentos(S.gateBusqueda).trim();
      var acc = S.gateAcc || '';
      var lista = ins.map(function(i){
        var oculto = q && sinAcentos(i.nombre).indexOf(q)<0;
        return '<button class="ra-persona" data-pick-insp="'+escAttr(i.id)+'" data-nombre="'+escAttr(sinAcentos(i.nombre))+'"'+
          (oculto?' style="display:none;"':'')+(S.loginBusy?' disabled':'')+'>'+avatar(i.nombre)+'<span class="nm">'+escHtml(i.nombre)+'</span><span class="go">›</span></button>';
      }).join('');
      var buscador = ins.length > 8
        ? '<input class="ra-input" id="gate-buscar" placeholder="Buscar mi nombre" autocomplete="off" value="'+escAttr(S.gateBusqueda)+'">' : '';
      var adm = adminsVisibles();
      var admins = adm.map(function(a){
        return '<button class="ra-persona" data-pick-user="'+escAttr(a.usuario)+'" data-pick-nombre="'+escAttr(a.nombre)+'">'+avatar(a.nombre)+
          '<span class="nm">'+escHtml(a.nombre)+'<small>'+(a.principal?'Administrador principal':'Administrador')+' · con contraseña</small></span><span class="go">›</span></button>';
      }).join('');
      var hoy = new Date(), hr = hoy.getHours();
      var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
      var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
      var hola = '<div class="ra-gate-hola"><div class="g-s">'+(hr<12?'Buenos días':hr<19?'Buenas tardes':'Buenas noches')+'</div>' +
        '<div class="g-f">'+DIAS[hoy.getDay()].charAt(0).toUpperCase()+DIAS[hoy.getDay()].slice(1)+' '+hoy.getDate()+' de '+MESES[hoy.getMonth()]+' · ¿Quién eres?</div></div>';
      inner = hola + warn + sinSenal + err +
        seccionGate('insp', acc==='insp', ICONO_CASCO, 'Inspectores', S.loginBusy ? 'Entrando…' : 'Toca para ver los nombres', ins.length,
          buscador + (lista || '<div class="ra-acc-vacio">Todavía no hay inspectores registrados. El administrador los da de alta en Ajustes.</div>') +
          (lista ? '<div class="ra-acc-vacio" id="gate-sin-coincidencias" style="display:none;">Ningún nombre coincide.</div>' : '')) +
        seccionGate('admin', acc==='admin', ICONO_ESCUDO, 'Administradores', 'Entran con su contraseña', adm.length,
          admins || '<button class="ra-persona" id="btn-login-nuevo"><span class="av" style="background:var(--accent);">+</span><span class="nm">Entrar como administrador<small>Con usuario y contraseña</small></span><span class="go">›</span></button>');
    }
    return '<div class="ra-gate"><div class="ra-gate-inner">' +
        '<div class="ra-gate-brand">' +
          '<div style="display:flex;justify-content:center;">' + logoSVG('ra-logo-lg') + '</div>' +
          '<div class="app-name">INSPECCIÓN DE ROLLOS</div>' +
          (temaActual==='findeanio' ? '<div class="ra-cuenta" data-cuenta="grande">'+cuentaHTML('grande')+'</div>' : '') +
        '</div>' + inner +
      '</div></div>';
  }

  /* ============ CAPTURA ============ */
  function renderCaptura(){
    if(S.editReg) return screenEditar();
    switch(S.step){
      case 'resultado': return screenResultado();
      case 'familia':   return screenFamilia();
      case 'defecto':   return screenDefecto();
      case 'ubicacion': return screenUbicacion();
      case 'severidad': return screenSeveridad();
      case 'evidencia': return screenEvidencia();
      case 'confirmar': return screenConfirmar();
      default:          return screenId();
    }
  }

  function screenId(){
    var id = rolloId(), ok = idValido();
    var master = ok ? S.rollosMaster[id] : null;
    var previos = ok ? S.registros.filter(function(r){ return (r.rolloId||'').toUpperCase()===id; }).length : 0;
    var camWarn = isInsecureContext()
      ? '<div class="ra-warn">La cámara solo funciona en páginas https o en localhost. Al abrir el archivo desde el disco el escaneo queda deshabilitado.</div>' : '';

    var campo, aviso;
    var nGalId = ok ? galeriaLibresDe(id).length : 0, nGalTot = galeriaLibres().length;
    var botonesFotos = '<div class="ra-fotos-id">' +
        '<button type="button" class="ra-fotobtn" id="btn-cam-id" aria-label="Tomar fotos para este rollo">'+ICO_CAM+'Tomar fotos'+(nGalId?' <b>'+nGalId+'</b>':'')+'</button>' +
        '<button type="button" class="ra-fotobtn" id="btn-gal-id">'+ICO_GAL+'Galería'+(nGalTot?' <b>'+nGalTot+'</b>':'')+'</button>' +
      '</div>';
    if(S.idModo === 'guiado'){
      var faltan = ID_MID_LEN - S.idMid.length;
      aviso = ok ? '<div class="ra-idpreview">ID completo: <b>'+escHtml(id)+'</b></div>'
                 : '<div class="ra-idpreview'+(S.idMid.length?' warn':'')+'">' +
                   (S.idMid.length ? 'Faltan '+faltan+' dígito'+(faltan===1?'':'s')+' — el ID debe llevar exactamente '+ID_MID_LEN+'.'
                                   : 'Captura los '+ID_MID_LEN+' dígitos del centro.') + '</div>';
      campo = '<div class="ra-idbox'+(ok?' ok':'')+'">' +
          '<div class="ra-idfix">'+ID_PREFIX+'</div>' +
          '<input class="ra-idmid" id="input-id-mid" type="tel" inputmode="numeric" pattern="[0-9]*" ' +
            'maxlength="'+ID_MID_LEN+'" placeholder="000000" value="'+escAttr(S.idMid)+'" autocomplete="off">' +
          '<div class="ra-idfix suffix">'+ID_SUFFIX+'</div>' +
        '</div>' + aviso +
        '<button class="ra-link" id="btn-modo-libre">Este rollo no sigue el formato</button>';
    } else {
      campo = '<input class="ra-input" id="input-id-full" placeholder="ID completo del rollo" value="'+escAttr(S.idFull)+'" autocapitalize="characters" autocomplete="off" spellcheck="false" style="margin-bottom:6px;">' +
        '<button class="ra-link" id="btn-modo-guiado">Volver al formato '+ID_PREFIX+'…'+ID_SUFFIX+'</button>';
    }

    return '<div class="ra-card">' +
        '<div class="ra-h1">Identificar rollo</div>' +
        (escanerActivo()
          ? '<div class="ra-h2">Escanea el código del rollo o captura los dígitos manualmente.</div>' + camWarn +
            '<button class="ra-btn ra-btn-primary ra-btn-block" id="btn-scan"'+(isInsecureContext()?' disabled':'')+' style="margin-bottom:20px;">Escanear código</button>'
          : '<div class="ra-h2">Captura los dígitos del ID del rollo.</div>' + camWarn) +
        '<label class="ra-label">ID DE ROLLO</label>' + campo + botonesFotos +
        (nGalId ? '<div class="ra-gal-aviso" style="margin:0;">'+ICO_GAL+'<span><b>'+nGalId+' foto'+(nGalId===1?'':'s')+' en la galería</b> para este rollo. Se agregarán solas al registro.</span></div>' : '') +
        (ok && S.tracking[id] ? rolloExistenteCard(S.tracking[id], previos) :
          (previos ? '<div class="ra-note" style="margin-top:14px;">Este rollo ya tiene '+previos+' inspección(es) registrada(s).</div>' : '')) +
        (ok ? datosIdSeccion(master) : '') +
        '<button class="ra-btn '+(ok && S.tracking[id]?'ra-btn-outline':'ra-btn-conforme')+' ra-btn-block" id="btn-continue-id" style="margin-top:18px;margin-bottom:0;"'+(ok?'':' disabled')+'>' +
          (ok && S.tracking[id] ? 'Registrar nueva inspección' : 'Continuar') + '</button>' +
      '</div>';
  }

  /* Interruptor "es su destino final", al registrar un movimiento.
     La zona de contingencia nunca puede ser destino final: de ahí deben salir. */
  function chipsDestinoFinal(){
    var utiles = zonas().filter(function(z){ return z!==ZONA_ORIGEN; });
    if(!utiles.length) return '';
    return '<div class="ra-meta" style="margin:12px 0 8px;">¿Ese es su destino final?</div>' +
      '<div class="ra-zchips">' +
        '<button class="ra-zchip'+(S.trackFinal?'':' on')+'" data-final-sw="0">No, sigue en tránsito</button>' +
        '<button class="ra-zchip'+(S.trackFinal?' on':'')+'" data-final-sw="1">Sí, es su destino final</button>' +
      '</div>' +
      (S.trackFinal ? '<div class="ra-meta" style="margin-top:6px;color:var(--conforme);">Quedará marcado como destino final y dejará de aparecer en las alertas.</div>' : '');
  }

  function rolloExistenteCard(t, previos){
    var ultimo = S.registros.filter(function(r){ return r.rolloId===t.rolloId; })[0];
    var cls = ultimo ? (ultimo.resultado==='Conforme'?'conforme':ultimo.resultado==='Defecto'?'defecto':'scrap') : '';
    var det = estaDetenido(t);
    var ultMov = t.movimientos[t.movimientos.length-1] || {};
    var chipsMedio = medios().map(function(m){
      return '<button class="ra-zchip'+(S.trackMedio===m?' on':'')+'" data-medio="'+escAttr(m)+'">'+escHtml(m)+'</button>';
    }).join('');
    var destinos = zonas().filter(function(z){ return z!==t.zona; }).map(function(z){
      return '<button class="ra-btn ra-btn-outline ra-btn-sm" data-mover-zona-id="'+escAttr(z)+'">'+escHtml(z)+'</button>';
    }).join('');
    return '<div class="ra-existe">' +
        '<div class="ra-existe-top">' +
          '<div class="ra-label" style="margin:0;color:var(--info);">ROLLO YA REGISTRADO</div>' +
          (ultimo ? '<span class="ra-badge '+cls+'">'+escHtml(etqRes(ultimo.resultado).toUpperCase())+'</span>' : '') +
        '</div>' +
        '<div class="ra-meta" style="margin-top:10px;">Ubicación actual</div>' +
        '<div class="ra-existe-zona">'+escHtml(t.zona)+'</div>' +
        '<div class="ra-meta">Desde '+escHtml(t.ultimaFecha||'')+' '+escHtml(t.ultimaHora||'')+' · '+escHtml(t.ultimoUsuario||'')+
          (ultMov.medio?' · en '+escHtml(ultMov.medio):'')+'</div>' +
        (det?'<div class="ra-meta" style="color:var(--defecto);font-weight:600;margin-top:4px;">En '+escHtml(ZONA_ORIGEN)+' '+textoAntiguedad(t)+'</div>':'') +
        (t.finalizado?'<div class="ra-meta" style="color:var(--conforme);font-weight:600;margin-top:4px;">✓ '+escHtml(textoFinal(t))+'</div>':'') +
        (ultimo && ultimo.defecto ? '<div class="ra-meta" style="margin-top:4px;">Último defecto: '+escHtml(ultimo.defectoCode+' '+ultimo.defecto)+(ultimo.variacion?' · '+escHtml(ultimo.variacion):'')+'</div>' : '') +
        '<div class="ra-meta" style="margin-top:4px;">'+previos+' inspección(es) · '+t.movimientos.length+' movimiento(s) · ' +
          '<button class="ra-link" data-track-open="'+escAttr(t.rolloId)+'" style="font-size:12.5px;padding:0;">Ver recorrido</button></div>' +
        (ultimo ? '<button class="ra-btn ra-btn-outline ra-btn-block ra-btn-sm" data-edit-registro="'+escAttr(ultimo.id)+'" style="margin:12px 0 0;">Agregar fotos o modificar la última inspección</button>' : '') +
        (S.isAdmin && !previos ? '<div class="ra-warn" style="margin:12px 0 0;">Este rollo tiene ubicación pero ninguna inspección guardada (posible registro de prueba).' +
          '<div style="margin-top:8px;"><button class="ra-link danger" data-track-delete="'+escAttr(t.rolloId)+'" style="padding:0;">Eliminar de Ubicación</button></div></div>' : '') +

        '<div class="ra-existe-mov">' +
          '<div class="ra-label">REGISTRAR MOVIMIENTO</div>' +
          (medios().length ? '<div class="ra-meta" style="margin-bottom:8px;">Medio de transporte</div><div class="ra-zchips" style="margin-bottom:12px;">'+chipsMedio+'</div>' : '') +
          '<input class="ra-input" id="mover-nota-id" placeholder="Nota (opcional)" autocomplete="off">' +
          chipsDestinoFinal() +
          '<div class="ra-meta" style="margin:12px 0 8px;">Enviar a</div>' +
          '<div class="ra-grid">'+destinos+'</div>' +
        '</div>' +
      '</div>';
  }

  function masterPreview(m){
    function row(l,v){ return v ? '<div class="ra-summary-line"><span>'+l+'</span><b>'+escHtml(String(v))+'</b></div>' : ''; }
    return '<div style="border-left:3px solid var(--conforme);background:#F3F8F5;padding:14px 15px;margin-top:16px;">' +
        '<div class="ra-label" style="color:var(--conforme);">DATOS GUARDADOS DE ESTE ROLLO</div>' +
        row('Grado de acero',m.grado)+row('Familia SGF',m.familiaSGF)+row('Familia',m.familiaDesc)+
        row('Espesor',m.espesor?m.espesor+' mm':'')+row('Ancho',m.ancho?m.ancho+' mm':'')+
        row('Peso',m.peso?m.peso+' kg':'')+row('Fecha producción',m.fecha)+row('Enrollador',m.enrollador) +
      '</div>';
  }

  function comboGrados(){
    var lista = (S.catalogs.grados||[]);
    if(!lista.length) return '<div class="ra-note">El catálogo de grados está vacío. El administrador puede cargarlo desde Ajustes.</div>';
    var q = (S.gradoQuery||'').trim().toUpperCase();
    var filtrados = q ? lista.filter(function(x){ return x.grado.toUpperCase().indexOf(q)===0; }) : lista;
    if(q && !filtrados.length) filtrados = lista.filter(function(x){ return x.grado.toUpperCase().indexOf(q)!==-1; });
    var abierto = S.gradoAbierto && !S.rolloData.grado;
    var opciones = abierto ? filtrados.slice(0,60).map(function(x){
      return '<div class="ra-combo-opt" data-pick-grado="'+escAttr(x.grado)+'">' +
          '<b>'+escHtml(x.grado)+'</b>' +
          '<span>SGF '+escHtml(x.sgf||'—')+(x.familia?' · '+escHtml(x.familia):'')+'</span>' +
        '</div>';
    }).join('') : '';
    var vacio = abierto && !filtrados.length ? '<div class="ra-combo-empty">Ningún grado coincide con «'+escHtml(q)+'»</div>' : '';
    return '<div class="ra-combo">' +
        '<input class="ra-input" id="field-grado" autocomplete="off" autocapitalize="characters" spellcheck="false" ' +
          'placeholder="Escribe para buscar, ej. C14" value="'+escAttr(S.rolloData.grado||S.gradoQuery||'')+'" ' +
          'style="margin-bottom:'+(abierto?'0':'12px')+';">' +
        (S.rolloData.grado ? '<button class="ra-combo-clear" id="btn-clear-grado" aria-label="Cambiar grado">✕</button>' : '') +
        (abierto ? '<div class="ra-combo-list">'+(opciones||vacio)+'</div>' : '') +
      '</div>' +

  function datosIdSeccion(master){

    var pideEsp = !(master && master.espesor), pideAn = !(master && master.ancho);
    if(pideEsp || pideAn){
      var campo = function(id, key, etq){
        return '<div><label class="ra-label" for="'+id+'">'+etq+' (MM) <span style="color:var(--scrap);">*</span></label>' +

      };

          (pideAn ? campo('field-ancho','ancho','ANCHO') : '') +
        '</div>' +
        '<div class="ra-meta" style="margin:-4px 0 0;">* Obligatorios</div>';

  function medidasCompletas(){
    var m = S.rollosMaster[rolloId()] || {};
    var esp = m.espesor || S.rolloData.espesor, an = m.ancho || S.rolloData.ancho;
    return parseFloat(esp) > 0 && parseFloat(an) > 0;
  }
  /* Rango razonable de espesor/ancho (opcional, lo define el admin en Ajustes).
     Es solo una advertencia -- nunca bloquea el guardado -- para atrapar errores
     de dedo (por ejemplo 5.0 en vez de 0.50) antes de que lleguen al reporte. */
  function limiteRango(clave){
    var mn = S.catalogs[clave+'Min'], mx = S.catalogs[clave+'Max'];
    return { min: (typeof mn==='number' && mn>0) ? mn : null, max: (typeof mx==='number' && mx>0) ? mx : null };
  }
  function fueraDeRango(espesor, ancho){
    var re = limiteRango('rangoEspesor'), ra = limiteRango('rangoAncho');
    var esp = parseFloat(espesor), an = parseFloat(ancho);
    var out = [];
    if(re.min!=null && esp<re.min) out.push('Espesor menor a '+re.min+' mm');
    if(re.max!=null && esp>re.max) out.push('Espesor mayor a '+re.max+' mm');
    if(ra.min!=null && an<ra.min) out.push('Ancho menor a '+ra.min+' mm');
    if(ra.max!=null && an>ra.max) out.push('Ancho mayor a '+ra.max+' mm');
    return out;
  }
  function medidasEnRango(){
    var m = S.rollosMaster[rolloId()] || {};
    var esp = m.espesor || S.rolloData.espesor, an = m.ancho || S.rolloData.ancho;
    return fueraDeRango(esp, an).length===0;
  }

               ubicacion:'#edit-ubicacion', severidad:'#edit-severidad', comentario:'#edit-comentario', motivo:'#edit-motivo'};

  /* ============ TRACKING ============ */
  function horasSinMover(t){
    return (Date.now() - (t.ultimoTs||Date.now())) / 3600000;
  }
  /* La alerta es solo para los rollos que siguen en la zona de contingencia:
     ahí nacen todos y la idea es que salgan de ahí. Un rollo marcado como
     "destino final" ya no alerta. */
  function estaDetenido(t){
    return t.zona===ZONA_ORIGEN && !t.finalizado && horasSinMover(t) >= HORAS_DETENIDO;
  }
  function textoFinal(t){
    if(!t.finalizado) return '';
    return 'En su destino final' + (t.finalizadoFecha?' desde '+t.finalizadoFecha:'') + (t.finalizadoPor?' · '+t.finalizadoPor:'');
  }
  function textoAntiguedad(t){
    var h = horasSinMover(t);
    if(h < 1) return 'hace menos de 1 h';
    if(h < 24) return 'hace '+Math.floor(h)+' h';
    var d = Math.floor(h/24);
    return 'hace '+d+' día'+(d===1?'':'s');
  }

  function trackingList(){
    return Object.keys(S.tracking).map(function(k){ return S.tracking[k]; })
      .sort(function(a,b){ return (b.ultimoTs||0)-(a.ultimoTs||0); });
  }

  function renderTracking(){
    if(S.trackVista==='detalle' && S.trackRollo) return screenTrackDetalle();
    var q = S.trackFiltro.trim().toLowerCase();
    var todos = trackingList();
    var detenidos = todos.filter(estaDetenido);
    var finalizados = todos.filter(function(t){ return t.finalizado; });
    var lista = todos.filter(function(t){
      if(S.trackZona==='Detenidos'){ if(!estaDetenido(t)) return false; }
      else if(S.trackZona==='Finalizados'){ if(!t.finalizado) return false; }
      else if(S.trackZona!=='Todas' && t.zona!==S.trackZona) return false;
      if(!q) return true;
      return t.rolloId.toLowerCase().indexOf(q)!==-1;
    });
    var porZona = {};
    todos.forEach(function(t){ porZona[t.zona]=(porZona[t.zona]||0)+1; });
    var listaZonas = zonas().slice();
    Object.keys(porZona).forEach(function(z){ if(listaZonas.indexOf(z)===-1) listaZonas.push(z); });
    var chips = ['Todas'].concat(listaZonas).map(function(z){
      var n = z==='Todas' ? todos.length : (porZona[z]||0);
      return '<button class="ra-zchip'+(S.trackZona===z?' on':'')+'" data-zona-filtro="'+escAttr(z)+'">' +
        escHtml(z)+'<b>'+n+'</b></button>';
    }).join('');
    if(detenidos.length){
      chips += '<button class="ra-zchip alerta'+(S.trackZona==='Detenidos'?' on':'')+'" data-zona-filtro="Detenidos">' +
        'Detenidos en contingencia<b>'+detenidos.length+'</b></button>';
    }
    if(finalizados.length){
      chips += '<button class="ra-zchip'+(S.trackZona==='Finalizados'?' on':'')+'" data-zona-filtro="Finalizados">' +
        'En destino final<b>'+finalizados.length+'</b></button>';
    }

    var aviso = (detenidos.length && S.trackZona!=='Detenidos')

  function camposTracking(t){
    return {rolloId:t.rolloId, zona:t.zona, ultimoUsuario:t.ultimoUsuario, ultimaFecha:t.ultimaFecha,
            ultimaHora:t.ultimaHora, ultimoTurno:t.ultimoTurno, ultimoTs:t.ultimoTs,
            finalizado:!!t.finalizado, finalizadoTs:t.finalizadoTs||0,
            finalizadoPor:t.finalizadoPor||'', finalizadoFecha:t.finalizadoFecha||''};
  }
  function nuevoMovimiento(zona, nota, medio, now){
    return {zona:zona, medio:medio||'', usuario:usuarioActual(), fecha:fechaHoy(now), hora:horaAhora(now),
            turno:turnoDe(now), ts:now.getTime(), nota:nota||''};
  }
  function aplicarMovimiento(t, mov){
    t.movimientos.push(mov);
    t.zona=mov.zona; t.ultimoUsuario=mov.usuario; t.ultimaFecha=mov.fecha; t.ultimaHora=mov.hora;
    t.ultimoTurno=mov.turno; t.ultimoTs=mov.ts;
    /* Si vuelve a moverse, deja de estar en su destino final */
    t.finalizado=false; t.finalizadoTs=0; t.finalizadoPor=''; t.finalizadoFecha='';
    /* arrayUnion: si dos equipos mueven el mismo rollo sin señal, se conservan ambos movimientos */
    return Object.assign(camposTracking(t), {movimientos:arrayUnion(mov)});
  }

  /* Marca los campos de destino final sobre un movimiento ya aplicado */
  function marcarFinalEnMovimiento(t, datos, now){
    t.finalizado=true; t.finalizadoTs=now.getTime();
    t.finalizadoPor=usuarioActual(); t.finalizadoFecha=fechaHoy(now);
    datos.finalizado=true; datos.finalizadoTs=t.finalizadoTs;
    datos.finalizadoPor=t.finalizadoPor; datos.finalizadoFecha=t.finalizadoFecha;
    return datos;
  }
  function moverRollo(rolloIdVal, zona, nota, medio, esFinal){
    var t = S.tracking[rolloIdVal];
    if(!t) return;
    var now = new Date();
    var mov = nuevoMovimiento(zona, nota, medio, now);
    var datos = aplicarMovimiento(t, mov);
    var final = !!esFinal && zona!==ZONA_ORIGEN;
    if(final) datos = marcarFinalEnMovimiento(t, datos, now);
    escribir(setDoc(ref(COL.tracking, rolloIdVal), datos, {merge:true}));
    auditar('movimiento', rolloIdVal, 'Movido a '+zona+(medio?' en '+medio:'')+(final?' · destino final':''), nota||'');
    S.trackMedio=''; S.trackFinal=false;
    toast('Rollo movido a '+zona+(final?' · destino final':(medio?' en '+medio:'')));
    if(esFinal && zona===ZONA_ORIGEN) toast(ZONA_ORIGEN+' no puede ser destino final');
    render();
  }

  function moverLote(ids, zona, nota, medio, esFinal){
    var now=new Date(), ops=[];
    var final = !!esFinal && zona!==ZONA_ORIGEN;
    ids.forEach(function(id){
      var t=S.tracking[id];
      if(!t || t.zona===zona) return;
      var mov = nuevoMovimiento(zona, nota||'Movimiento en lote', medio, now);
      var datos = aplicarMovimiento(t, mov);
      if(final) datos = marcarFinalEnMovimiento(t, datos, now);
      ops.push({ref:ref(COL.tracking,id), data:datos, merge:true});
    });
    if(!ops.length){ toast('Esos rollos ya están en '+zona); return; }
    escribir(commitEnLotes(ops));
    auditar('movimiento','('+ops.length+' rollos)','Movimiento en lote a '+zona+(medio?' en '+medio:'')+(final?' · destino final':'')+': '+ids.join(', '), nota||'');
    S.trackModoSel=false; S.trackSeleccion=[]; S.trackMedio=''; S.trackFinal=false;
    toast(ops.length+' rollo(s) movidos a '+zona+(final?' · destino final':''));
    if(esFinal && zona===ZONA_ORIGEN) toast(ZONA_ORIGEN+' no puede ser destino final');
    render();
  }

  /* Marca (o desmarca) rollos que ya llegaron a su destino final */
  function marcarFinal(ids, valor){
    var now=new Date(), ops=[], n=0;
    var enOrigen=0;
    ids.forEach(function(id){
      var t=S.tracking[id];
      if(!t || !!t.finalizado===valor) return;
      if(valor && t.zona===ZONA_ORIGEN){ enOrigen++; return; }
      t.finalizado=valor;
      t.finalizadoTs=valor?now.getTime():0;
      t.finalizadoPor=valor?usuarioActual():'';
      t.finalizadoFecha=valor?fechaHoy(now):'';
      ops.push({ref:ref(COL.tracking,id), merge:true, data:{finalizado:valor, finalizadoTs:t.finalizadoTs,
        finalizadoPor:t.finalizadoPor, finalizadoFecha:t.finalizadoFecha}});
      n++;
    });
    if(!n){
      toast(enOrigen ? ZONA_ORIGEN+' no puede ser destino final' : (valor?'Esos rollos ya estaban marcados':'No había marcas que quitar'));
      return;
    }
    if(enOrigen) toast(enOrigen+' rollo(s) siguen en '+ZONA_ORIGEN+' y no se marcaron');
    escribir(commitEnLotes(ops));
    auditar('movimiento', n===1?ids[0]:'('+n+' rollos)',
      valor?'Marcado como destino final':'Se quitó la marca de destino final', '');
    toast(valor ? (n===1?'Marcado como destino final':n+' rollo(s) marcados') : 'Marca de destino final quitada');
    S.trackModoSel=false; S.trackSeleccion=[];
    render();
  }

  /* Cuando un rollo se queda sin inspecciones, su ubicación deja de contar:
     así al volver a capturarlo no aparece como "ya registrado".
     El administrador borra el seguimiento y los datos del rollo; un inspector
     (que no puede borrar ubicaciones) lo deja anulado. */
  function liberarRolloSinRegistros(rid, batch){
    if(!rid) return false;
    var quedan = S.registros.some(function(x){ return x.rolloId===rid; });
    if(quedan || !S.tracking[rid]) return false;
    if(S.isAdmin){
      batch.delete(ref(COL.tracking, rid));
      if(S.rollosMaster[rid]){ batch.delete(ref(COL.master, rid)); delete S.rollosMaster[rid]; }
    } else {
      var now = new Date();
      batch.set(ref(COL.tracking, rid), {anulado:true, anuladoTs:now.getTime(), anuladoPor:usuarioActual()}, {merge:true});
      S.trackingAnulado[rid] = true;
    }
    delete S.tracking[rid];
    return true;
  }

  /* Solo administrador: quita un rollo de Ubicación (por ejemplo, uno de prueba).
     Las inspecciones del rollo, si las hay, se conservan en el historial. */
  function eliminarSeguimiento(rid){
    if(!S.isAdmin || !S.tracking[rid]) return;
    var n = S.registros.filter(function(x){ return x.rolloId===rid; }).length;
    var aviso = n ? '\n\nEste rollo tiene '+n+' inspección(es): se conservan en el historial, solo se borra su ubicación y recorrido.'
                  : '\n\nNo tiene inspecciones guardadas; también se borrarán sus datos (grado, medidas).';
    var motivo = prompt('¿Eliminar '+rid+' de Ubicación?'+aviso+'\n\nMotivo (obligatorio):', '');
    if(motivo===null) return;
    if(motivo.trim().length<5){ toast('Escribe un motivo de al menos 5 caracteres'); return; }
    var batch = writeBatch(db);
    batch.delete(ref(COL.tracking, rid));
    if(!n && S.rollosMaster[rid]){ batch.delete(ref(COL.master, rid)); delete S.rollosMaster[rid]; }
    delete S.tracking[rid];
    escribir(batch.commit());
    auditar('eliminacion', rid, 'Ubicación del rollo eliminada por el administrador'+(n?' ('+n+' inspección(es) conservadas)':''), motivo.trim());
    if(S.trackRollo===rid){ S.trackVista='lista'; S.trackRollo=null; }
    toast('Rollo quitado de Ubicación');
    render();
  }

  function iniciarTracking(rolloIdVal, batch){
    if(S.tracking[rolloIdVal]) return;
    var now = new Date();
    var mov = {zona:ZONA_ORIGEN, medio:'', usuario:usuarioActual(), fecha:fechaHoy(now), hora:horaAhora(now), turno:turnoDe(now), ts:now.getTime(), nota:'Alta por inspección'};
    var t = {rolloId:rolloIdVal, zona:ZONA_ORIGEN, ultimoUsuario:usuarioActual(), ultimaFecha:fechaHoy(now),
             ultimaHora:horaAhora(now), ultimoTurno:turnoDe(now), ultimoTs:now.getTime(), movimientos:[mov]};
    S.tracking[rolloIdVal] = t;
    var reinicio = !!S.trackingAnulado[rolloIdVal];
    /* Si el seguimiento anterior se anuló, se reemplaza completo (sin recorrido viejo) */
    var data = reinicio ? Object.assign(camposTracking(t), {movimientos:[mov], anulado:false})
                        : Object.assign(camposTracking(t), {movimientos:arrayUnion(mov)});
    var opts = reinicio ? {} : {merge:true};
    delete S.trackingAnulado[rolloIdVal];
    if(batch) batch.set(ref(COL.tracking, rolloIdVal), data, opts);
    else escribir(setDoc(ref(COL.tracking, rolloIdVal), data, opts));
  }

  /* ============ HISTORIAL ============ */
  function restarDias(n){
    var d=new Date(); d.setDate(d.getDate()-n); return fechaHoy(d);
  }
  function pasaFiltroFecha(r){
    var f=r.fecha||'';
    if(S.filtroFecha==='Hoy') return f===fechaHoy();
    if(S.filtroFecha==='Ayer') return f===restarDias(1);
    if(S.filtroFecha==='7 días') return f>=restarDias(6);
    if(S.filtroFecha==='Rango'){
      if(S.filtroDesde && f<S.filtroDesde) return false;
      if(S.filtroHasta && f>S.filtroHasta) return false;
      return true;
    }
    return true;
  }
  function inspectoresConHistorial(){
    var vistos={}, out=[];
    S.registros.forEach(function(r){ if(r.inspector && !vistos[r.inspector]){ vistos[r.inspector]=true; out.push(r.inspector); } });
    return out.sort(function(a,b){ return a.localeCompare(b); });
  }
  function filteredRegistros(){
    var q=S.filtro.trim().toLowerCase();
    var eMin=parseFloat(S.filtroEspMin), eMax=parseFloat(S.filtroEspMax);
    var aMin=parseFloat(S.filtroAnMin), aMax=parseFloat(S.filtroAnMax);
    return S.registros.filter(function(r){
      if(S.filtroResultado!=='Todos' && r.resultado!==S.filtroResultado) return false;
      if(S.filtroTurno!=='Todos' && (r.turno||'')!==S.filtroTurno) return false;
      if(S.filtroInspector && S.filtroInspector!=='Todos' && r.inspector!==S.filtroInspector) return false;
      if(!isNaN(eMin) && !(parseFloat(r.espesor)>=eMin)) return false;
      if(!isNaN(eMax) && !(parseFloat(r.espesor)<=eMax)) return false;
      if(!isNaN(aMin) && !(parseFloat(r.ancho)>=aMin)) return false;
      if(!isNaN(aMax) && !(parseFloat(r.ancho)<=aMax)) return false;
      if(!pasaFiltroFecha(r)) return false;
      if(!q) return true;
      return [r.rolloId,r.defecto,r.defectoCode,r.familia,r.inspector,r.ubicacion,r.comentario,r.grado,r.familiaSGF]
        .filter(Boolean).join(' ').toLowerCase().indexOf(q)!==-1;
    });
  }

  /* Convierte una tarjeta normal de Ajustes en sección desplegable (cerrada de inicio).
     El título sale del primer .ra-h1 de la tarjeta; el estado abierto/cerrado se recuerda mientras dure la sesión. */
  function plegar(clave, sub, html){
    if(!html) return '';
    var m = /^<div class="ra-card"([^>]*)>\s*<div class="ra-h1">([\s\S]*?)<\/div>/.exec(html);
    if(!m || html.slice(-6) !== '</div>') return html;
    S.plegables = S.plegables || {};
    var abierto = !!S.plegables[clave];
    var head = '<button class="ra-fold-head" data-plegar="'+clave+'" aria-expanded="'+abierto+'">' +
        '<span><span class="t">'+m[2]+'</span>'+(sub ? '<span class="m">'+escHtml(sub)+'</span>' : '')+'</span>' +
        '<span class="ra-fold-prev"><span class="chev">▾</span></span>' +
      '</button>';
    return '<div class="ra-card ra-fold'+(abierto?' open':'')+'"'+m[1]+'>' + head + '<div class="ra-fold-body">' +
      html.slice(m[0].length, -6) + '</div></div>';
  }

  function estadisticasCard(){
    var head = '<button class="ra-fold-head" id="btn-estadisticas" aria-expanded="'+(S.estadisticas?'true':'false')+'">' +
        '<span><span class="t">Estadísticas</span><span class="m">Tendencias e inspectores</span></span>' +
        '<span class="ra-fold-prev"><span class="chev">▾</span></span>' +
      '</button>';
    if(!S.estadisticas) return '<div class="ra-card ra-fold">'+head+'</div>';
    var periodo = S.statsPeriodo || '7';
    var dias = periodo==='30' ? 30 : periodo==='todo' ? null : 7;
    var corte = dias!=null ? (Date.now() - dias*86400000) : null;
    var regs = S.registros.filter(function(r){ return corte==null || r.ts>=corte; });
    var total = regs.length;
    var conf = regs.filter(function(r){ return r.resultado==='Conforme'; }).length;
    var def = regs.filter(function(r){ return r.resultado==='Defecto'; }).length;
    var scr = regs.filter(function(r){ return r.resultado==='Scrap'; }).length;
    var fr = regs.filter(function(r){ return r.fueraRango; }).length;
    function pct(n){ return total ? Math.round(n/total*100) : 0; }
    var porInspector = {};
    regs.forEach(function(r){
      var k = r.inspector || '—';
      porInspector[k] = porInspector[k] || {total:0, hallazgo:0};
      porInspector[k].total++;
      if(r.resultado==='Defecto' || r.resultado==='Scrap') porInspector[k].hallazgo++;
    });
    var ranking = Object.keys(porInspector).map(function(n){
      var d=porInspector[n]; return {nombre:n, total:d.total, tasa: d.total ? Math.round(d.hallazgo/d.total*100) : 0};
    }).sort(function(a,b){ return b.total-a.total; }).slice(0,8);
    var rankHtml = ranking.length ? ranking.map(function(x){
      return '<div class="ra-summary-line"><span>'+escHtml(x.nombre)+'</span><b>'+x.total+
        ' <span style="color:var(--ink-soft);font-weight:400;">('+x.tasa+'% con hallazgo)</span></b></div>';
    }).join('') : '<div class="ra-meta">Sin datos en este periodo.</div>';
    var defectos={};
    regs.forEach(function(r){ if(r.defecto){ var k=r.defectoCode+' '+r.defecto; defectos[k]=(defectos[k]||0)+1; } });
    var topDef = Object.keys(defectos).sort(function(a,b){ return defectos[b]-defectos[a]; }).slice(0,5);
    var topHtml = topDef.length ? topDef.map(function(k){
      return '<div class="ra-summary-line"><span>'+escHtml(k)+'</span><b>'+defectos[k]+'</b></div>';
    }).join('') : '<div class="ra-meta">Sin defectos en este periodo.</div>';
    var chipsPeriodo = [['7','7 días'],['30','30 días'],['todo','Todo']].map(function(p){
      return '<button class="ra-btn ra-btn-sm '+(periodo===p[0]?'ra-btn-primary':'ra-btn-outline')+'" data-stats-periodo="'+p[0]+'" style="font-size:12px;margin-bottom:0;">'+p[1]+'</button>';
    }).join('');
    var hayRango = S.catalogs.rangoEspesorMin || S.catalogs.rangoEspesorMax || S.catalogs.rangoAnchoMin || S.catalogs.rangoAnchoMax;
    function stat(n,l){ return '<div class="ra-stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }
    return '<div class="ra-card ra-fold open">' + head +
        '<div class="ra-fold-body">' +
          '<div class="ra-grid" style="grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;">'+chipsPeriodo+'</div>' +
          '<div class="ra-stats" style="margin-top:14px;">'+stat(total,'TOTAL')+stat(pct(conf)+'%','ACEPTADO')+stat(pct(def+scr)+'%','CON HALLAZGO')+'</div>' +
          (hayRango ? '<div class="ra-meta" style="margin-top:8px;">'+fr+' de '+total+' rollos ('+pct(fr)+'%) tuvieron una medida fuera del rango esperado.</div>' : '') +
          '<div class="ra-label" style="margin-top:14px;">POR INSPECTOR</div>' + rankHtml +
          '<div class="ra-label" style="margin-top:14px;">DEFECTOS MÁS FRECUENTES</div>' + topHtml +
        '</div>' +
      '</div>';
  }

  /* Borrado del reporte de movimientos (solo el administrador principal) */
  function borrarAuditoria(ids, todo){
    if(!soyPrincipal() || !ids.length) return;
    var ops = ids.map(function(id){ return {tipo:'delete', ref:ref(COL.auditoria, id)}; });
    S.auditoria = S.auditoria.filter(function(a){ return ids.indexOf(a._id)<0; });
    S.repSel = null; render();
    commitEnLotes(ops).then(function(){
      if(todo) auditar('eliminacion','','Reporte de movimientos borrado ('+ids.length+' registros)','');
      toast(todo ? 'Reporte de movimientos borrado' : ids.length+' movimiento(s) eliminado(s)');
    }).catch(errFirebase);
  }

  /* ============ FOTOS ============ */
  function compressImage(file){
    function reducir(img, maxW, q){
      var scale=Math.min(1,maxW/img.width);
      var c=document.createElement('canvas');
      c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      return c.toDataURL('image/jpeg',q);
    }
    return new Promise(function(resolve,reject){
      var reader=new FileReader();
      reader.onload=function(e){
        var img=new Image();
        img.onload=function(){
          /* Cada foto va en su propio documento de Firestore (límite 1 MB) */
          var d=reducir(img,900,0.55);
          if(d.length>700000) d=reducir(img,700,0.45);
          if(d.length>700000) d=reducir(img,520,0.4);
          resolve(d);
        };
        img.onerror=reject; img.src=e.target.result;
      };
      reader.onerror=reject; reader.readAsDataURL(file);
    });
  }

  var PIXEL = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

  function fotosDe(r){

      .concat((r.fotos||[]).map(function(d){ return {data:d}; }));

  var fotosEnCamino = {};
  function cargarFoto(id){
    if(S.fotoCache[id]) return Promise.resolve(S.fotoCache[id]);
    if(fotosEnCamino[id]) return fotosEnCamino[id];
    fotosEnCamino[id] = getDoc(ref(COL.fotos, id)).then(function(s){
      delete fotosEnCamino[id];
      if(s.exists()) S.fotoCache[id] = s.data().data;
      return S.fotoCache[id] || null;
    }).catch(function(){ delete fotosEnCamino[id]; return null; });
    return fotosEnCamino[id];
  }
  /* Las fotos se descargan solo cuando se muestran y se guardan en memoria */
  function cargarFotosPendientes(){
    root.querySelectorAll('img[data-foto-id]').forEach(function(img){

     para no romper el modo kiosco). La galería es compartida entre todos los equipos:
     cada foto tiene un documento completo en "fotos" y un índice ligero (miniatura,

  var ICO_CAM = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.6-2.2h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/></svg>';

  function normId(x){ return String(x||'').toUpperCase().replace(/[\s\-_.\/]/g,''); }
  function fidsUsados(){
    var s = {};
    S.registros.forEach(function(r){ (r.fotoIds||[]).forEach(function(f){ s[f] = true; }); });
    return s;

  function galPorTs(a,b){ return (a.ts||0) - (b.ts||0); }
  /* Fotos de la galería sin usar que pertenecen a un rollo */
  function galeriaLibresDe(id){
    var n = normId(id); if(!n) return [];
    var u = fidsUsados();
    return S.galeria.filter(function(g){ return g.rolloId && normId(g.rolloId)===n && !u[g.fid]; }).sort(galPorTs);
  }
  function galeriaLibres(){
    var u = fidsUsados();
    return S.galeria.filter(function(g){ return !u[g.fid]; });
  }
  function fechaCorta(ts){
    var d = new Date(ts||0), hoy = new Date();
    var mismo = d.toDateString()===hoy.toDateString();
    var ayer = new Date(hoy.getTime()-86400000).toDateString()===d.toDateString();
    return (mismo ? 'Hoy' : ayer ? 'Ayer' : pad(d.getDate())+'/'+pad(d.getMonth()+1)) + ' ' + horaAhora(d);
  }
  function hace(ts){
    var h = (Date.now()-(ts||0))/3600000;
    if(h < 1) return 'hace un momento';
    if(h < 24) return 'hace '+Math.floor(h)+' h';
    var d = Math.floor(h/24); return 'hace '+d+' día'+(d===1?'':'s');
  }

  /* Escucha de la galería: solo índices (miniaturas) */
  function escucharGaleria(){
    unsubs.push(onSnapshot(query(collection(db, COL.fotos), where('tipo','==','galeria')), function(qs){
      S.galeria = qs.docs.map(function(d){ var x = d.data(); x.id = d.id; x._pend = d.metadata.hasPendingWrites; return x; });
      limpiarGaleriaVieja(qs.metadata.fromCache);
      refrescarGaleriaAbierta();
      marcarCambios();
    }, function(e){ console.error(e); }));
  }
  /* Los índices de fotos ya usadas en un registro se retiran solos a los 30 días
     (la foto sigue en su registro; solo se quita de la galería) */
  function limpiarGaleriaVieja(desdeCache){
    if(S.galLimpia || desdeCache || !S.registros.length) return;
    S.galLimpia = true;
    var u = fidsUsados(), lim = Date.now() - 30*86400000;
    var viejas = S.galeria.filter(function(g){ return u[g.fid] && (g.ts||0) < lim; });
    if(!viejas.length) return;
    var b = writeBatch(db);
    viejas.slice(0,400).forEach(function(g){ b.delete(ref(COL.fotos, g.id)); });
    b.commit().catch(function(){});
  }

  /* Comprime un cuadro del video al mismo tamaño que las fotos de siempre */
  function cuadroAJpeg(fuente, w, h){
    function reducir(maxW, q){
      var scale = Math.min(1, maxW/w);
      var c = document.createElement('canvas');
      c.width = Math.max(1,Math.round(w*scale)); c.height = Math.max(1,Math.round(h*scale));
      c.getContext('2d').drawImage(fuente, 0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', q);
    }
    var full = reducir(900, 0.6);
    if(full.length > 700000) full = reducir(700, 0.45);
    if(full.length > 700000) full = reducir(520, 0.4);
    return {full:full, thumb:reducir(240, 0.6)};
  }
  function miniaturaDe(dataURL){
    return new Promise(function(resolve){
      var img = new Image();
      img.onload = function(){ resolve(cuadroAJpeg(img, img.width, img.height).thumb); };
      img.onerror = function(){ resolve(dataURL); };
      img.src = dataURL;
    });
  }

  function guardarEnGaleria(full, thumb, rolloId){
    var now = Date.now(), base = 'g'+now+Math.random().toString(36).slice(2,7);
    var fid = base+'_f', gid = base+'_i';
    S.fotoCache[fid] = full;
    var b = writeBatch(db);
    b.set(ref(COL.fotos, fid), {galeria:true, rolloId:rolloId||'', data:full, ts:now, uid:S.perfil.uid});
    b.set(ref(COL.fotos, gid), {tipo:'galeria', fid:fid, data:thumb, rolloId:rolloId||'', ts:now,
      uid:S.perfil.uid, autor:usuarioActual()});
    escribir(b.commit());
  }
  /* Cambiar el ID de fotos: se crea un índice nuevo y se borra el anterior
     (los inspectores pueden crear y borrar fotos, no modificarlas) */
  function reetiquetarGaleria(gids, nuevoId){
    var b = writeBatch(db), n = 0;
    gids.forEach(function(gid){
      var g = S.galeria.filter(function(x){ return x.id===gid; })[0];
      if(!g || (g.rolloId||'')===(nuevoId||'')) return;
      var nid = 'g'+Date.now()+Math.random().toString(36).slice(2,7)+'_i';
      b.set(ref(COL.fotos, nid), {tipo:'galeria', fid:g.fid, data:g.data, rolloId:nuevoId||'', ts:g.ts||Date.now(),
        uid:g.uid||S.perfil.uid, autor:g.autor||'', etiquetadoPor:usuarioActual()});
      b.delete(ref(COL.fotos, gid));
      n++;
    });
    if(n) escribir(b.commit());
    return n;
  }
  function borrarDeGaleria(gids){
    var u = fidsUsados(), b = writeBatch(db), n = 0;
    gids.forEach(function(gid){
      var g = S.galeria.filter(function(x){ return x.id===gid; })[0];
      if(!g) return;
      b.delete(ref(COL.fotos, gid));
      if(g.fid && !u[g.fid]){ b.delete(ref(COL.fotos, g.fid)); delete S.fotoCache[g.fid]; }
      n++;
    });
    if(n) escribir(b.commit());
    return n;
  }
  /* Al borrar fotos de un registro, su índice en la galería también se va */
  function borrarIndicesDe(fids, batch){
    if(!fids || !fids.length) return;
    S.galeria.forEach(function(g){ if(fids.indexOf(g.fid)!==-1) batch.delete(ref(COL.fotos, g.id)); });
  }

  /* ---------- Ventana para elegir el ID de las fotos ---------- */
  function pedirIdFotos(actual, alElegir){

    if(m) mid = m[1]; else if(actual){ modo = 'libre'; libre = actual; }

    function agregarReciente(id){ if(id && recientes.indexOf(id)===-1 && recientes.length<6) recientes.push(id); }
    galeriaLibres().slice().sort(function(a,b){ return (b.ts||0)-(a.ts||0); }).forEach(function(g){ agregarReciente(g.rolloId); });
    S.registros.slice(0,10).forEach(function(r){ agregarReciente(r.rolloId); });

    function valido(){ return modo==='guiado' ? mid.length===ID_MID_LEN : libre.trim().length>=4; }

        '<div class="ra-h1" style="font-size:18px;">¿De qué rollo son estas fotos?</div>' +
        '<div class="ra-meta" style="margin-bottom:12px;">Las fotos quedan ligadas a este ID y se agregan solas cuando registres el rollo.</div>' +

            '<input class="ra-idmid" id="pid-mid" type="tel" inputmode="numeric" maxlength="'+ID_MID_LEN+'" placeholder="000000" value="'+escAttr(mid)+'" autocomplete="off">' +
            '<div class="ra-idfix suffix">'+ID_SUFFIX+'</div></div>' +
            '<button class="ra-link" data-pid-modo="libre" style="margin-top:6px;">Este rollo no sigue el formato</button>'
          : '<input class="ra-input" id="pid-full" placeholder="ID completo del rollo" value="'+escAttr(libre)+'" autocapitalize="characters" autocomplete="off" spellcheck="false">' +
            '<button class="ra-link" data-pid-modo="guiado">Volver al formato '+ID_PREFIX+'…'+ID_SUFFIX+'</button>') +
        (recientes.length ? '<div class="ra-meta" style="margin:12px 0 6px;">Recientes</div><div class="ra-zchips">' +
          recientes.map(function(r){ return '<button class="ra-zchip" data-pid-rec="'+escAttr(r)+'">'+escHtml(r)+'</button>'; }).join('') + '</div>' : '') +
        '<button class="ra-btn ra-btn-primary ra-btn-block" data-pid-ok style="margin-top:16px;"'+(valido()?'':' disabled')+'>Usar este ID</button>' +
        '<button class="ra-btn ra-btn-outline ra-btn-block" data-pid-sin>Sin ID por ahora</button>' +
        '<button class="ra-link" data-pid-cancel style="display:block;margin:2px auto 0;">Cancelar</button>';
      var inp = card.querySelector('#pid-mid'), inf = card.querySelector('#pid-full');
      if(inp){
        inp.addEventListener('input', function(){
          mid = inp.value.replace(/\D/g,'').slice(0,ID_MID_LEN); inp.value = mid;
          card.querySelector('.ra-idbox').classList.toggle('ok', valido());
          card.querySelector('[data-pid-ok]').disabled = !valido();
        });
        inp.addEventListener('keydown', function(e){ if(e.key==='Enter' && valido()) listo(valor()); });
      }
      if(inf){
        inf.addEventListener('input', function(){ libre = inf.value; card.querySelector('[data-pid-ok]').disabled = !valido(); });
        inf.addEventListener('keydown', function(e){ if(e.key==='Enter' && valido()) listo(valor()); });
      }
      if(foco!==false){ var f = inp || inf; if(f) setTimeout(function(){ try{ f.focus(); }catch(e){} }, 60); }
      card.querySelectorAll('[data-pid-modo]').forEach(function(b){
        b.addEventListener('click', function(){ modo = b.getAttribute('data-pid-modo'); pintar(); });
      });
      card.querySelectorAll('[data-pid-rec]').forEach(function(b){
        b.addEventListener('click', function(){ listo(b.getAttribute('data-pid-rec')); });
      });
      card.querySelector('[data-pid-ok]').addEventListener('click', function(){ if(valido()) listo(valor()); });
      card.querySelector('[data-pid-sin]').addEventListener('click', function(){ listo(''); });
      card.querySelector('[data-pid-cancel]').addEventListener('click', cerrar);
    }
    function cerrar(){ if(ov.parentNode) ov.remove(); }
    function listo(v){ cerrar(); alElegir(v); }
    ov.addEventListener('click', function(e){ if(e.target===ov) cerrar(); });
    pintar();
