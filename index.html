    var chip = modal.querySelector('[data-cam-id]');
    function pintarChip(){
      if(opts.modo==='registro'){
        chip.innerHTML = 'Foto para <b>'+escHtml(etiqueta||'este registro')+'</b>';
        chip.disabled = true;
      } else {
        chip.innerHTML = etiqueta ? 'ID <b>'+escHtml(etiqueta)+'</b> <span class="cam-cambiar">cambiar</span>'
                                  : '<b>Sin ID</b> <span class="cam-cambiar">asignar</span>';
      }
    }
    pintarChip();
    function detener(){ if(stream) stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; track = null; }
    function iniciar(){
      detener();
      var msg = modal.querySelector('.cam-msg'); msg.hidden = true;
      navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:facing}, width:{ideal:1920}, height:{ideal:1080}}})
      .then(function(s){
        if(!modal.parentNode){ s.getTracks().forEach(function(t){ t.stop(); }); return; }
        stream = s; video.srcObject = s; video.play().catch(function(){});
        track = s.getVideoTracks()[0];
        var caps = (track && track.getCapabilities) ? (track.getCapabilities()||{}) : {};
        var tb = modal.querySelector('[data-cam-torch]');
        tb.hidden = !caps.torch; torchOn = false; tb.classList.remove('on');
        modal.querySelector('[data-cam-disparar]').disabled = false;
        if(navigator.mediaDevices.enumerateDevices){
          navigator.mediaDevices.enumerateDevices().then(function(ds){
            var n = ds.filter(function(d){ return d.kind==='videoinput'; }).length;
            modal.querySelector('[data-cam-girar]').hidden = n < 2;
          }).catch(function(){});
        }
      }).catch(function(err){
        modal.querySelector('[data-cam-disparar]').disabled = true;
        var negado = err && (err.name==='NotAllowedError' || err.name==='SecurityError');
        msg.hidden = false;
        msg.innerHTML = '<b>'+(negado ? 'La app no tiene permiso para usar la cámara' : 'No se pudo abrir la cámara')+'</b>' +
          '<p>'+(negado
            ? 'Permite el acceso a la cámara para esta página y vuelve a intentarlo.'
            : 'Puede que otra app esté usando la cámara. Ciérrala y vuelve a intentarlo.')+'</p>' +
          '<ul><li><b>Fully Kiosk:</b> Ajustes → Web Content Settings → activa <i>Enable Webcam Access</i>.</li>' +
          '<li><b>Chrome:</b> toca el candado junto a la dirección → Permisos → Cámara → Permitir.</li>' +
          '<li>Otras apps de kiosco: busca la opción de permitir cámara o webcam para páginas web.</li></ul>' +
          '<button class="ra-btn ra-btn-primary" data-cam-reintentar>Reintentar</button>';
        msg.querySelector('[data-cam-reintentar]').addEventListener('click', iniciar);
      });
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      var msg0 = modal.querySelector('.cam-msg'); msg0.hidden = false;
      msg0.innerHTML = '<b>Este navegador no permite usar la cámara dentro de la página.</b><p>Actualiza el navegador o la app de kiosco.</p>';
    } else iniciar();

    function disparar(){
      if(!stream || !video.videoWidth) return;
      var r = cuadroAJpeg(video, video.videoWidth, video.videoHeight);
      var fl = modal.querySelector('.cam-flash');
      fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on');
      if(navigator.vibrate) navigator.vibrate(30);
      tomadas++; ultimo = r;
      var im = modal.querySelector('.cam-last img'), ct = modal.querySelector('.cam-count');
      im.src = r.thumb; im.hidden = false; ct.textContent = tomadas; ct.hidden = false;
      if(opts.modo==='galeria') guardarEnGaleria(r.full, r.thumb, etiqueta);
      else if(opts.alTomar) opts.alTomar(r.full, r.thumb);
    }
    function cerrar(){
      detener();
      if(modal.parentNode) modal.remove();
      document.body.classList.remove('ra-cam-abierta');
      if(opts.modo==='galeria' && tomadas) toast(tomadas+' foto'+(tomadas===1?'':'s')+' en la galería'+(etiqueta?' · '+etiqueta:' · sin ID'));
      if(opts.alCerrar) opts.alCerrar(tomadas);
    }
    modal.querySelector('[data-cam-disparar]').addEventListener('click', disparar);
    modal.querySelector('[data-cam-listo]').addEventListener('click', cerrar);
    modal.querySelector('[data-cam-cerrar]').addEventListener('click', cerrar);
    modal.querySelector('[data-cam-torch]').addEventListener('click', function(){
      if(!track) return;
      torchOn = !torchOn;
      track.applyConstraints({advanced:[{torch:torchOn}]}).catch(function(){});
      this.classList.toggle('on', torchOn);
    });
    modal.querySelector('[data-cam-girar]').addEventListener('click', function(){
      facing = facing==='environment' ? 'user' : 'environment'; iniciar();
    });
    modal.querySelector('.cam-last').addEventListener('click', function(){ if(ultimo) abrirFoto(ultimo.full, 'Última foto tomada'); });
    if(opts.modo!=='registro') chip.addEventListener('click', function(){
      pedirIdFotos(etiqueta, function(v){ etiqueta = v; pintarChip(); if(v) toast('Las siguientes fotos van al ID '+v); });
    });
  }

  /* ---------- Opciones al tocar ＋ en un registro ---------- */
  function opcionesFoto(o){
    var libres = galeriaLibres().filter(function(g){ return (o.excluir||[]).indexOf(g.fid)===-1; });
    var deEste = o.rolloId ? galeriaLibresDe(o.rolloId).filter(function(g){ return (o.excluir||[]).indexOf(g.fid)===-1; }).length : 0;
    var sh = el('<div class="ra-sheet"><div class="ra-sheet-card">' +
        '<div class="ra-sheet-t">Agregar foto</div>' +
        '<button class="ra-sheet-op" data-op="cam"><span class="i">'+ICO_CAM+'</span><span><b>Tomar foto ahora</b><small>Con la cámara de la app</small></span></button>' +
        '<button class="ra-sheet-op" data-op="gal"'+(libres.length?'':' disabled')+'><span class="i">'+ICO_GAL+'</span><span><b>Elegir de la galería</b><small>' +
          (libres.length ? libres.length+' foto'+(libres.length===1?'':'s')+' disponible'+(libres.length===1?'':'s')+(deEste?' · '+deEste+' de este rollo':'') : 'No hay fotos sin usar') + '</small></span></button>' +
        (S.isAdmin ? '<button class="ra-sheet-op" data-op="arch"><span class="i">⇪</span><span><b>Subir archivo</b><small>Solo administradores · desde el equipo</small></span></button>' : '') +
        '<button class="ra-sheet-cancel" data-op="x">Cancelar</button>' +
      '</div></div>');
    document.body.appendChild(sh);
    requestAnimationFrame(function(){ sh.classList.add('on'); });
    function cerrar(){ if(sh.parentNode) sh.remove(); }
    sh.addEventListener('click', function(e){
      if(e.target===sh){ cerrar(); return; }
      var b = e.target.closest('[data-op]'); if(!b || b.disabled) return;
      var op = b.getAttribute('data-op');
      cerrar();
      if(op==='cam') abrirCamara({modo:'registro', rolloId:o.rolloId, alTomar:function(full){ o.alAgregar([full]); }, alCerrar:o.alTerminar});
      else if(op==='gal') abrirGaleria({modo:'elegir', rolloId:o.rolloId, excluir:o.excluir||[],
        alElegir:function(sel){ o.alAgregar(sel.map(function(g){ return {gal:g.id, fid:g.fid, thumb:g.data}; })); if(o.alTerminar) o.alTerminar(); }});
      else if(op==='arch'){
        var inp = document.createElement('input');
        inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
        inp.addEventListener('change', function(){
          var files = Array.prototype.slice.call(inp.files||[]); if(!files.length) return;
          toast(files.length>1 ? 'Procesando '+files.length+' fotos…' : 'Procesando foto…');
          var out = [];
          files.reduce(function(p,f){ return p.then(function(){ return compressImage(f).then(function(d){ out.push(d); }); }); }, Promise.resolve())
            .catch(function(){ toast('No se pudo procesar alguna foto'); })
            .then(function(){ if(out.length) o.alAgregar(out); if(o.alTerminar) o.alTerminar(); });
        });
        inp.click();
      }
    });
  }

  /* ---------- Galería a pantalla completa ----------
     opts.modo: 'ver' (administrar) o 'elegir' (agregar a un registro) */
  var galAbierta = null;
  function refrescarGaleriaAbierta(){ if(galAbierta) galAbierta.pintar(); }
  function abrirGaleria(opts){
    opts = opts || {};
    if(galAbierta) galAbierta.cerrar();
    var elegir = opts.modo==='elegir';
    var sel = {}, modoSel = elegir, verUsadas = false;
    var ov = el('<div class="ra-gal" role="dialog" aria-label="Galería de fotos"></div>');
    document.body.appendChild(ov);
    document.body.classList.add('ra-cam-abierta');
    var api = {pintar:pintar, cerrar:cerrar};
    galAbierta = api;
    function cerrar(){
      if(ov.parentNode) ov.remove();
      if(galAbierta===api) galAbierta = null;
      if(!document.querySelector('.ra-cam')) document.body.classList.remove('ra-cam-abierta');
    }
    function grupos(){
      var u = fidsUsados(), excl = opts.excluir||[];
      var libres = S.galeria.filter(function(g){ return !u[g.fid] && excl.indexOf(g.fid)===-1; });
      var usadas = elegir ? [] : S.galeria.filter(function(g){ return u[g.fid]; });
      var mapa = {}, lista = [];
      libres.forEach(function(g){
        var k = g.rolloId ? normId(g.rolloId) : '';
        if(!mapa[k]){ mapa[k] = {clave:k, rolloId:g.rolloId||'', fotos:[]}; lista.push(mapa[k]); }
        mapa[k].fotos.push(g);
      });
      lista.forEach(function(gr){ gr.fotos.sort(galPorTs); gr.ultimo = gr.fotos[gr.fotos.length-1].ts||0; gr.primero = gr.fotos[0].ts||0; });
      var actual = normId(opts.rolloId||'');
      lista.sort(function(a,b){
        if(actual && a.clave===actual) return -1; if(actual && b.clave===actual) return 1;
        if(!a.clave) return 1; if(!b.clave) return -1;
        return b.ultimo - a.ultimo;
      });
      usadas.sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
      return {lista:lista, usadas:usadas, actual:actual};
    }
    function tile(g, usada){
      var on = !!sel[g.id];
      return '<button class="ra-gal-tile'+(on?' sel':'')+(usada?' usada':'')+'" data-gal-tile="'+escAttr(g.id)+'">' +
        '<img src="'+g.data+'" alt="">' +
        '<span class="t">'+escHtml(fechaCorta(g.ts))+'</span>' +
        (g._pend ? '<span class="p" title="Subiendo">⇡</span>' : '') +
        (modoSel ? '<span class="ck">'+(on?'✓':'')+'</span>' : '') +
      '</button>';
    }
    function pintar(){
      var G = grupos(), nSel = Object.keys(sel).filter(function(k){ return sel[k]; }).length;
      Object.keys(sel).forEach(function(k){ if(!S.galeria.some(function(g){ return g.id===k; })) delete sel[k]; });
      var total = G.lista.reduce(function(a,g){ return a+g.fotos.length; }, 0);
      var cuerpo = '';
      if(!total && !G.usadas.length){
        cuerpo = '<div class="ra-empty"><div class="big">'+ICO_GAL+'</div>' +
          (elegir ? 'No hay fotos sin usar en la galería.' : 'Aún no hay fotos.<br>Toma fotos con el botón de cámara y quedarán aquí para todos los equipos.') + '</div>';
      }
      else if(!total) cuerpo = '<div class="ra-meta" style="text-align:center;padding:16px 0 20px;">No hay fotos pendientes por usar.</div>';
      G.lista.forEach(function(gr){
        var vieja = gr.primero && (Date.now()-gr.primero) > 48*3600000;
        var esActual = G.actual && gr.clave===G.actual;
        var todas = gr.fotos.every(function(g){ return sel[g.id]; });
        cuerpo += '<div class="ra-gal-grupo'+(esActual?' actual':'')+(!gr.clave?' sinid':'')+'">' +
          '<div class="ra-gal-gh">' +
            '<div><div class="n">'+(gr.clave ? 'ID '+escHtml(gr.rolloId) : 'Sin ID asignado')+'</div>' +
              '<div class="m">'+gr.fotos.length+' foto'+(gr.fotos.length===1?'':'s')+' · '+hace(gr.ultimo) +
              (esActual ? ' · <b>este rollo</b>' : '') +
              (vieja && gr.clave ? ' · <b class="w">pendiente de usar</b>' : '') +
              (!gr.clave ? ' · asígnales un ID para que se agreguen solas' : '') + '</div></div>' +
            (modoSel ? '<button class="ra-link" data-gal-todo="'+escAttr(gr.clave)+'">'+(todas?'Quitar':'Elegir todas')+'</button>' : '') +
          '</div>' +
          '<div class="ra-gal-grid">'+gr.fotos.map(function(g){ return tile(g,false); }).join('')+'</div>' +
        '</div>';
      });
      if(G.usadas.length){
        cuerpo += '<div class="ra-gal-grupo usadas"><button class="ra-gal-gh ra-gal-toggle" data-gal-usadas>' +
            '<div><div class="n">Usadas en registros</div><div class="m">'+G.usadas.length+' foto'+(G.usadas.length===1?'':'s')+' · se retiran solas de la galería a los 30 días</div></div>' +
            '<span class="ra-acc-chev">'+(verUsadas?'▴':'▾')+'</span></button>' +
          (verUsadas ? '<div class="ra-gal-grid">'+G.usadas.map(function(g){ return tile(g,true); }).join('')+'</div>' : '') +
        '</div>';
      }
      var barra = '';
      if(elegir){
        barra = '<div class="ra-gal-bar"><span>'+(nSel ? nSel+' seleccionada'+(nSel===1?'':'s') : 'Toca las fotos que quieres agregar')+'</span>' +
          '<button class="ra-btn ra-btn-conforme" data-gal-agregar'+(nSel?'':' disabled')+'>Agregar'+(nSel?' '+nSel:'')+'</button></div>';
      } else if(modoSel){
        barra = '<div class="ra-gal-bar acciones"><span>'+nSel+' seleccionada'+(nSel===1?'':'s')+'</span>' +
          '<button class="ra-btn ra-btn-primary ra-btn-sm" data-gal-asignar'+(nSel?'':' disabled')+'>Asignar ID</button>' +
          '<button class="ra-btn ra-btn-outline ra-btn-sm" data-gal-quitarid'+(nSel?'':' disabled')+'>Quitar ID</button>' +
          '<button class="ra-btn ra-btn-scrap ra-btn-sm" data-gal-borrar'+(nSel?'':' disabled')+'>Eliminar</button></div>';
      }
      ov.innerHTML =
        '<div class="ra-gal-head">' +
          '<button class="cam-btn dark" data-gal-cerrar aria-label="Cerrar">✕</button>' +
          '<div class="tt"><div class="a">'+(elegir ? 'Elegir de la galería' : 'Galería de fotos')+'</div>' +
            '<div class="b">'+(elegir && opts.rolloId ? 'Para '+escHtml(opts.rolloId) : total+' sin usar · compartida entre equipos')+'</div></div>' +
          (!elegir ? '<button class="ra-btn ra-btn-outline ra-btn-sm" data-gal-sel>'+(modoSel?'Listo':'Seleccionar')+'</button>' : '') +
        '</div>' +
        (!elegir ? '<button class="ra-gal-cam" data-gal-cam><span class="i">'+ICO_CAM+'</span>Tomar fotos</button>' : '') +
        '<div class="ra-gal-body">'+cuerpo+'</div>' + barra;
      ov.querySelector('[data-gal-cerrar]').addEventListener('click', cerrar);
      var bs = ov.querySelector('[data-gal-sel]');
      if(bs) bs.addEventListener('click', function(){ modoSel = !modoSel; sel = {}; pintar(); });
      var bc = ov.querySelector('[data-gal-cam]');
      if(bc) bc.addEventListener('click', function(){
        pedirIdFotos('', function(v){ abrirCamara({modo:'galeria', rolloId:v}); });
      });
      var bu = ov.querySelector('[data-gal-usadas]');
      if(bu) bu.addEventListener('click', function(){ verUsadas = !verUsadas; pintar(); });
      ov.querySelectorAll('[data-gal-todo]').forEach(function(b){
        b.addEventListener('click', function(){
          var k = b.getAttribute('data-gal-todo');
          var gr = grupos().lista.filter(function(g){ return g.clave===k; })[0]; if(!gr) return;
          var todas = gr.fotos.every(function(g){ return sel[g.id]; });
          gr.fotos.forEach(function(g){ sel[g.id] = !todas; });
          pintar();
        });
      });
      ov.querySelectorAll('[data-gal-tile]').forEach(function(b){
        b.addEventListener('click', function(){
          var id = b.getAttribute('data-gal-tile');
          var g = S.galeria.filter(function(x){ return x.id===id; })[0]; if(!g) return;
          if(modoSel){ sel[id] = !sel[id]; pintar(); return; }
          var meta = (g.rolloId ? 'ID '+g.rolloId : 'Sin ID') + ' · ' + fechaCorta(g.ts) + (g.autor ? ' · '+g.autor : '');
          abrirFoto(S.fotoCache[g.fid] || g.data, meta);
          if(!S.fotoCache[g.fid]) cargarFoto(g.fid).then(function(src){
            var im = document.querySelector('.ra-lightbox img'); if(src && im) im.src = src;
          });
        });
      });
      function elegidas(){ return S.galeria.filter(function(g){ return sel[g.id]; }).sort(galPorTs); }
      var ba = ov.querySelector('[data-gal-agregar]');
      if(ba) ba.addEventListener('click', function(){
        var lista = elegidas(); if(!lista.length) return;
        cerrar(); if(opts.alElegir) opts.alElegir(lista);
      });
      var bas = ov.querySelector('[data-gal-asignar]');
      if(bas) bas.addEventListener('click', function(){
        var lista = elegidas(); if(!lista.length) return;
        var comun = lista.every(function(g){ return g.rolloId===lista[0].rolloId; }) ? lista[0].rolloId : '';
        pedirIdFotos(comun, function(v){
          if(!v){ toast('Elige un ID para asignar'); return; }
          var n = reetiquetarGaleria(lista.map(function(g){ return g.id; }), v);
          sel = {}; toast(n ? n+' foto'+(n===1?'':'s')+' asignada'+(n===1?'':'s')+' a '+v : 'Ya tenían ese ID');
        });
      });
      var bq = ov.querySelector('[data-gal-quitarid]');
      if(bq) bq.addEventListener('click', function(){
        var lista = elegidas(); if(!lista.length) return;
        var n = reetiquetarGaleria(lista.map(function(g){ return g.id; }), '');
        sel = {}; toast(n ? 'Se quitó el ID a '+n+' foto'+(n===1?'':'s') : 'No tenían ID');
      });
      var bb = ov.querySelector('[data-gal-borrar]');
      if(bb) bb.addEventListener('click', function(){
        var lista = elegidas(); if(!lista.length) return;
        var u = fidsUsados(), usadas = lista.filter(function(g){ return u[g.fid]; }).length;
        if(!confirm('¿Eliminar '+lista.length+' foto'+(lista.length===1?'':'s')+' de la galería?' +
          (usadas ? '\n'+usadas+' ya está'+(usadas===1?'':'n')+' en un registro y ahí se conserva'+(usadas===1?'':'n')+'.' : '\nSe borran para todos los equipos.'))) return;
        var n = borrarDeGaleria(lista.map(function(g){ return g.id; }));
        sel = {}; toast(n+' foto'+(n===1?'':'s')+' eliminada'+(n===1?'':'s'));
      });
    }
    pintar();
  }

  /* Agrega solas al registro en curso las fotos de la galería de ese rollo */
  function sincronizarFotosGaleria(){
    var id = rolloId(); if(!id) return 0;
    var ya = S.fotos.filter(function(f){ return f && f.fid; }).map(function(f){ return f.fid; });
    var n = 0;
    galeriaLibresDe(id).forEach(function(g){
      if(ya.indexOf(g.fid)!==-1 || S.galDescartadas.indexOf(g.id)!==-1) return;
      S.fotos.push({gal:g.id, fid:g.fid, thumb:g.data}); n++;
    });
    return n;
  }
  function srcFoto(f){ return typeof f==='string' ? f : (S.fotoCache[f.fid] || f.thumb || PIXEL); }

  /* Fila de fotos del registro en curso (evidencia y confirmación) */
  function filaFotosRegistro(){
    sincronizarFotosGaleria();
    var deGal = S.fotos.filter(function(f){ return f && f.fid; }).length;
    var fotos = S.fotos.map(function(f,i){
      return '<div class="ra-photo-thumb'+(f && f.fid?' gal':'')+'"><img src="'+srcFoto(f)+'" alt="Evidencia '+(i+1)+'">' +
        (f && f.fid ? '<span class="ra-foto-gal">GALERÍA</span>' : '') +
        '<button data-remove-foto="'+i+'" aria-label="Quitar foto">✕</button></div>';
    }).join('');
    return '<div class="ra-photo-row">'+fotos+'<button type="button" class="ra-add-photo" data-add-foto="reg" aria-label="Agregar foto">'+ICO_CAM+'</button></div>' +
      (deGal ? '<div class="ra-gal-aviso">'+ICO_GAL+'<span>'+deGal+' foto'+(deGal===1?'':'s')+' de la galería de este rollo se agregaron solas. Quita las que no quieras.</span></div>' : '');
  }

  /* ============ ESCÁNER DE CÓDIGOS ============
     Lee QR y casi cualquier código de barras. Usa el lector nativo del equipo (si existe) y,
     alternando cuadros, el motor ZXing-C++ (WebAssembly). Si nada de eso carga, usa jsQR (solo QR).
     El administrador decide si el botón aparece (catalogos.escanerActivo). */
  var ZXING_PONYFILL = 'https://cdn.jsdelivr.net/npm/barcode-detector@3.2.2/dist/iife/ponyfill.js';
  var NOMBRE_FORMATO = {qr_code:'QR', micro_qr_code:'Micro QR', rm_qr_code:'rMQR', data_matrix:'DataMatrix', aztec:'Aztec',
    pdf417:'PDF417', maxi_code:'MaxiCode', code_128:'Code 128', code_39:'Code 39', code_93:'Code 93', codabar:'Codabar',
    ean_13:'EAN-13', ean_8:'EAN-8', upc_a:'UPC-A', upc_e:'UPC-E', itf:'ITF', databar:'GS1 DataBar',
    databar_limited:'GS1 DataBar Limited', databar_expanded:'GS1 DataBar Expanded', dx_film_edge:'DX Film Edge'};
  function nombreFormato(f){ return NOMBRE_FORMATO[f] || String(f||'código').replace(/_/g,' ').toUpperCase(); }
  function formatoLineal(f){ return /^(code_|codabar|ean_|upc_|itf|databar|dx_)/.test(String(f||'')); }
  function escanerActivo(){ return !!(S.catalogs && S.catalogs.escanerActivo); }

  /* Limpia lo leído (caracteres de control GS1, espacios) y busca el ID dentro, aunque venga con más datos */
  function limpiarLectura(v){ return String(v||'').replace(/[\x00-\x1f\x7f]/g,' ').replace(/\s+/g,' ').trim(); }
  function extraerId(v){
    var compacto = limpiarLectura(v).toUpperCase().replace(/[\s\-_.\/]/g,'');
    var m = compacto.match(new RegExp(ID_PREFIX+'(\\d{'+ID_MID_LEN+'})'+ID_SUFFIX));
    return m ? m[1] : '';
  }
  function aplicarIdEscaneado(valor){
    var mid = extraerId(valor);
    if(mid){ S.idModo='guiado'; S.idMid=mid; return; }
    S.idModo='libre'; S.idFull=limpiarLectura(valor).toUpperCase().replace(/\s+/g,'');
  }

  function loadScript(src){
    return new Promise(function(resolve,reject){
      var s=document.createElement('script');
      s.src=src; s.onload=resolve; s.onerror=function(){ s.remove(); reject(new Error('carga')); };
      document.head.appendChild(s);
    });
  }
  function loadJsQR(){ return window.jsQR ? Promise.resolve() : loadScript("https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"); }
  function loadSheetJS(){ return window.XLSX ? Promise.resolve() : loadScript("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"); }

  /* Motores de lectura (se crean una vez y se reutilizan) */
  var motorNativo = null, motorZxing = null, motorJsqr = null;
  function crearNativo(){
    if(motorNativo) return motorNativo;
    motorNativo = Promise.resolve().then(function(){
      if(!('BarcodeDetector' in window) || !window.BarcodeDetector.getSupportedFormats) return null;
      return window.BarcodeDetector.getSupportedFormats().then(function(f){
        if(!f || !f.length) return null;
        return {nombre:'nativo', det:new window.BarcodeDetector({formats:f}), formatos:f};
      });
    }).catch(function(){ return null; });
    return motorNativo;
  }
  function crearZxing(){
    if(motorZxing) return motorZxing;
    motorZxing = (window.BarcodeDetectionAPI ? Promise.resolve() : loadScript(ZXING_PONYFILL)).then(function(){
      var api = window.BarcodeDetectionAPI;
      if(!api || !api.BarcodeDetector) return null;
      var ver = api.ZXING_WASM_VERSION;
      var over = {locateFile:function(path, prefix){
        return (ver && /\.wasm$/.test(path)) ? 'https://cdn.jsdelivr.net/npm/zxing-wasm@'+ver+'/dist/reader/'+path : prefix+path;
      }};
      try{ if(api.setZXingModuleOverrides) api.setZXingModuleOverrides(over); }catch(e){}
      return api.BarcodeDetector.getSupportedFormats().then(function(f){
        var det = new api.BarcodeDetector({formats:f});
        /* Primera lectura en vacío: obliga a bajar el motor ahora y avisa si no hay conexión */
        var c = document.createElement('canvas'); c.width = c.height = 8;
        return det.detect(c).then(function(){ return {nombre:'zxing', det:det, formatos:f}; });
      });
    }).catch(function(e){ console.warn('ZXing no disponible', e); motorZxing = null; return null; });
    return motorZxing;
  }
  function crearJsqr(){
    if(motorJsqr) return motorJsqr;
    motorJsqr = loadJsQR().then(function(){
      var cv = document.createElement('canvas'), cx = cv.getContext('2d', {willReadFrequently:true});
      return {nombre:'jsqr', formatos:['qr_code'], det:{detect:function(src){
        var w = src.width, h = src.height, k = Math.min(1, 800/Math.max(1,w));
        cv.width = Math.max(1, Math.round(w*k)); cv.height = Math.max(1, Math.round(h*k));
        cx.drawImage(src, 0, 0, cv.width, cv.height);
        var d = cx.getImageData(0, 0, cv.width, cv.height);
        var r = window.jsQR(d.data, d.width, d.height, {inversionAttempts:'attemptBoth'});
        return Promise.resolve(r && r.data ? [{rawValue:r.data, format:'qr_code'}] : []);
      }}};
    }).catch(function(){ motorJsqr = null; return null; });
    return motorJsqr;
  }

  /* opts.prueba: modo de prueba para el administrador (solo muestra lo leído) */
  function openScanner(opts){
    opts = opts || {};
    if(isInsecureContext()){ toast('La cámara requiere https — captura el ID manualmente'); return; }
    var modal = el('<div class="ra-cam ra-scan">' +
        '<video autoplay playsinline muted></video>' +
        '<div class="scan-ventana"><i class="scan-linea"></i></div>' +
        '<div class="cam-top">' +
          '<button class="cam-btn" data-sc-cerrar aria-label="Cerrar">✕</button>' +
          '<div class="cam-chip" style="pointer-events:none;">'+(opts.prueba ? '<b>Prueba</b> del escáner' : 'Escanear <b>código del rollo</b>')+'</div>' +
          '<div class="cam-top-r"><button class="cam-btn" data-sc-torch aria-label="Linterna" hidden>☀</button>' +
          '<button class="cam-btn" data-sc-girar aria-label="Cambiar cámara" hidden>'+ICO_GIRAR+'</button></div>' +
        '</div>' +
        '<div class="cam-msg" hidden></div>' +
        '<div class="scan-pie">' +
          '<div class="scan-zoom" hidden></div>' +
          '<div class="scan-estado">Preparando lector…</div>' +
          '<div class="scan-motor"></div>' +
        '</div>' +
      '</div>');
    document.body.appendChild(modal);
    document.body.classList.add('ra-cam-abierta');
    var video = modal.querySelector('video'), msg = modal.querySelector('.cam-msg');
    var estado = modal.querySelector('.scan-estado'), motorTxt = modal.querySelector('.scan-motor');
    var ventana = modal.querySelector('.scan-ventana');
    var canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', {willReadFrequently:true});
    var stream = null, track = null, torchOn = false, facing = 'environment';
    var motores = [], turno = 0, pausado = false, cerrado = false, previo = null, buscando = false, ignorar = null, ultimo = null;

    function abierto(){ return !cerrado && modal.isConnected; }
    function cerrar(){
      cerrado = true;
      if(stream) stream.getTracks().forEach(function(t){ t.stop(); });
      stream = null;
      if(modal.parentNode) modal.remove();
      if(!document.querySelector('.ra-cam')) document.body.classList.remove('ra-cam-abierta');
    }
    modal.querySelector('[data-sc-cerrar]').addEventListener('click', cerrar);

    function pintarMotores(){
      var n = {}; motores.forEach(function(m){ (m.formatos||[]).forEach(function(f){ n[f]=1; }); });
      var tipos = Object.keys(n).length;
      estado.textContent = 'Apunta al código del rollo';
      motorTxt.textContent = tipos > 1 ? 'QR, códigos de barras, DataMatrix, PDF417 y más · '+tipos+' tipos'
                                       : 'Solo QR (no se pudo cargar el lector completo)';
    }
    /* Arranca el nativo y ZXing en paralelo; el que llegue primero empieza a leer */
    var listos = 0;
    function agregar(m){
      listos++;
      if(m && abierto()){ motores.push(m); pintarMotores(); }
      if(listos === 2 && !motores.length){
        crearJsqr().then(function(j){
          if(!abierto()) return;
          if(j){ motores.push(j); pintarMotores(); }
          else { estado.textContent = 'No se pudo cargar el lector — revisa la conexión'; motorTxt.textContent = ''; }
        });
      }
    }
    crearNativo().then(agregar);
    crearZxing().then(agregar);

    function iniciar(){
      if(stream) stream.getTracks().forEach(function(t){ t.stop(); });
      stream = null; track = null; msg.hidden = true;
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        msg.hidden = false;
        msg.innerHTML = '<b>Este navegador no permite usar la cámara dentro de la página.</b><p>Actualiza el navegador o la app de kiosco.</p>';
        return;
      }
      var pedir = function(c){ return navigator.mediaDevices.getUserMedia({audio:false, video:c}); };
      pedir({facingMode:{ideal:facing}, width:{ideal:1920}, height:{ideal:1080}})
      .catch(function(e){ if(e && (e.name==='NotAllowedError' || e.name==='SecurityError')) throw e; return pedir({facingMode:{ideal:facing}}); })
      .then(function(s){
        if(!abierto()){ s.getTracks().forEach(function(t){ t.stop(); }); return; }
        stream = s; video.srcObject = s; video.play().catch(function(){});
        track = s.getVideoTracks()[0];
        var caps = (track && track.getCapabilities) ? (track.getCapabilities()||{}) : {};
        if(caps.focusMode && caps.focusMode.indexOf('continuous') >= 0){
          track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(function(){});
        }
        var tb = modal.querySelector('[data-sc-torch]');
        tb.hidden = !caps.torch; torchOn = false; tb.classList.remove('on');
        pintarZoom(caps);
        if(navigator.mediaDevices.enumerateDevices){
          navigator.mediaDevices.enumerateDevices().then(function(ds){
            modal.querySelector('[data-sc-girar]').hidden = ds.filter(function(d){ return d.kind==='videoinput'; }).length < 2;
          }).catch(function(){});
        }
        if(!buscando) bucle();
      }).catch(function(err){
        var negado = err && (err.name==='NotAllowedError' || err.name==='SecurityError');
        msg.hidden = false;
        msg.innerHTML = '<b>'+(negado ? 'La app no tiene permiso para usar la cámara' : 'No se pudo abrir la cámara')+'</b>' +
          '<p>'+(negado ? 'Permite el acceso a la cámara para esta página y vuelve a intentarlo.'
                        : 'Puede que otra app esté usando la cámara. Ciérrala y vuelve a intentarlo.')+'</p>' +
          '<ul><li><b>Fully Kiosk:</b> Ajustes → Web Content Settings → activa <i>Enable Webcam Access</i>.</li>' +
          '<li><b>Chrome:</b> toca el candado junto a la dirección → Permisos → Cámara → Permitir.</li>' +
          '<li>Otras apps de kiosco: busca la opción de permitir cámara o webcam para páginas web.</li></ul>' +
          '<button class="ra-btn ra-btn-primary" data-sc-reintentar>Reintentar</button>';
        msg.querySelector('[data-sc-reintentar]').addEventListener('click', iniciar);
      });
    }

    /* Acercamiento (útil para etiquetas pequeñas o lejanas) */
    function pintarZoom(caps){
      var zb = modal.querySelector('.scan-zoom');
      var z = caps && caps.zoom;
      if(!z || !(z.max > (z.min||1))){ zb.hidden = true; zb.innerHTML = ''; return; }
      var base = Math.max(1, z.min||1);
      var nivs = [1, 2, 3, 5].map(function(x){ return x*base; }).filter(function(x){ return x <= z.max + 1e-6; });
      if(nivs.length < 2){ zb.hidden = true; return; }
      zb.hidden = false;
      zb.innerHTML = nivs.map(function(x, i){
        return '<button data-sc-zoom="'+x+'"'+(i===0?' class="on"':'')+'>'+(x/base)+'×</button>';
      }).join('');
      zb.querySelectorAll('[data-sc-zoom]').forEach(function(b){
        b.addEventListener('click', function(){
          var v = parseFloat(b.getAttribute('data-sc-zoom'));
          if(track) track.applyConstraints({advanced:[{zoom:v}]}).catch(function(){});
          zb.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x===b); });
        });
      });
    }
    modal.querySelector('[data-sc-torch]').addEventListener('click', function(){
      if(!track) return;
      torchOn = !torchOn;
      track.applyConstraints({advanced:[{torch:torchOn}]}).catch(function(){});
      this.classList.toggle('on', torchOn);
    });
    modal.querySelector('[data-sc-girar]').addEventListener('click', function(){
      facing = facing==='environment' ? 'user' : 'environment'; iniciar();
    });

    function esperar(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
    /* Elige, entre todo lo que se vio en el cuadro, el que trae el ID o el más cercano al centro */
    function mejor(res, w, h){
      var conId = res.filter(function(r){ return extraerId(r.rawValue); });
      if(conId.length) return conId[0];
      return res.slice().sort(function(a, b){
        function d(r){ var bb = r.boundingBox; if(!bb) return 1e9; var cx = bb.x+bb.width/2-w/2, cy = bb.y+bb.height/2-h/2; return cx*cx+cy*cy; }
        return d(a) - d(b);
      })[0];
    }
    function bucle(){
      buscando = true;
      (function paso(){
        if(!abierto()){ buscando = false; return; }
        if(pausado || !motores.length || video.readyState < 2 || !video.videoWidth){ esperar(120).then(paso); return; }
        var m = motores[turno++ % motores.length];
        var w = video.videoWidth, h = video.videoHeight;
        var fuente = video;
        if(m.nombre !== 'nativo'){
          var k = Math.min(1, 1280/Math.max(w, h));
          canvas.width = Math.round(w*k); canvas.height = Math.round(h*k);
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          fuente = canvas; w = canvas.width; h = canvas.height;
        }
        Promise.resolve().then(function(){ return m.det.detect(fuente); }).then(function(res){
          res = (res||[]).filter(function(r){ return r && limpiarLectura(r.rawValue); });
          if(res.length && !pausado && abierto()) evaluar(mejor(res, w, h), m);
        }).catch(function(){}).then(function(){ esperar(40).then(paso); });
      })();
    }
    /* Los códigos de barras lineales se confirman con dos lecturas iguales (evita lecturas falsas) */
    function evaluar(r, m){
      var valor = r.rawValue, fmt = r.format, clave = fmt+'|'+valor;
      if(ignorar && ignorar.clave === clave && Date.now() < ignorar.hasta) return;
      if(formatoLineal(fmt) && !extraerId(valor) && previo !== clave){
        previo = clave;
        ventana.classList.add('casi'); setTimeout(function(){ ventana.classList.remove('casi'); }, 400);
        return;
      }
      previo = null;
      leido(valor, fmt, m);
    }
    function leido(valor, fmt, m){
      pausado = true; ultimo = fmt+'|'+valor;
      ventana.classList.add('ok');
      if(navigator.vibrate) navigator.vibrate(60);
      var mid = extraerId(valor), limpio = limpiarLectura(valor);
      if(!opts.prueba && mid){
        aplicarIdEscaneado(valor);
        cerrar(); render();
        toast(nombreFormato(fmt)+' leído · '+rolloId());
        return;
      }
      var usable = limpio.replace(/\s+/g,'').length >= 4 && limpio.length <= 40;
      msg.hidden = false;
      msg.innerHTML = '<b>'+(opts.prueba ? 'Código leído' : 'Se leyó un código sin el formato del ID')+'</b>' +
        '<div class="ra-meta" style="margin-top:2px;">'+escHtml(nombreFormato(fmt))+(opts.prueba ? ' · lector '+escHtml(m.nombre==='nativo'?'del equipo':m.nombre==='zxing'?'ZXing':'jsQR') : '')+'</div>' +
        '<div class="scan-val">'+escHtml(limpio.length > 300 ? limpio.slice(0,300)+'…' : limpio)+'</div>' +
        (mid ? '<p style="color:var(--conforme);font-weight:600;">Contiene el ID '+escHtml(ID_PREFIX+mid+ID_SUFFIX)+' — se tomaría solo.</p>'
             : '<p>No contiene un ID con el formato '+ID_PREFIX+'······'+ID_SUFFIX+'.</p>') +
        (!opts.prueba && usable ? '<button class="ra-btn ra-btn-primary ra-btn-block" data-sc-usar>Usar como ID del rollo</button>' : '') +
        '<button class="ra-btn '+(!opts.prueba && usable ? 'ra-btn-outline' : 'ra-btn-primary')+' ra-btn-block" data-sc-otra style="margin-bottom:0;">Escanear '+(opts.prueba?'otro':'de nuevo')+'</button>';
      var bu = msg.querySelector('[data-sc-usar]');
      if(bu) bu.addEventListener('click', function(){ aplicarIdEscaneado(valor); cerrar(); render(); toast(rolloId()); });
      msg.querySelector('[data-sc-otra]').addEventListener('click', function(){
        msg.hidden = true; ventana.classList.remove('ok'); previo = null; pausado = false;
        ignorar = {clave:ultimo, hasta:Date.now()+2500};  /* no vuelve a leer el mismo código al instante */
      });
    }
    iniciar();
  }

  /* ============ IMPORTAR GRADOS ============ */
  function importarGrados(file){
    var nombre = file.name.toLowerCase();
    if(nombre.slice(-4)==='.csv'){
      var reader=new FileReader();
      reader.onload=function(e){ procesarFilasGrados(parseCSV(e.target.result)); };
      reader.readAsText(file);
      return;
    }
    loadSheetJS().then(function(){
      var reader=new FileReader();
      reader.onload=function(e){
        try{
          var wb = window.XLSX.read(new Uint8Array(e.target.result), {type:'array'});
          var ws = wb.Sheets[wb.SheetNames[0]];
          var filas = window.XLSX.utils.sheet_to_json(ws, {header:1, blankrows:false});
          procesarFilasGrados(filas);
        }catch(err){ toast('No se pudo leer el archivo'); }
      };
      reader.readAsArrayBuffer(file);
    }).catch(function(){ toast('No se pudo cargar el lector de Excel'); });
  }

  function parseCSV(texto){
    return texto.split(/\r?\n/).filter(function(l){ return l.trim(); })
      .map(function(l){ return l.split(/[;,\t]/).map(function(c){ return c.trim().replace(/^"|"$/g,''); }); });
  }

  function procesarFilasGrados(filas){
    if(!filas || !filas.length){ toast('El archivo está vacío'); return; }
    var mapa = {};
    (S.catalogs.grados||[]).forEach(function(g){ mapa[g.grado] = {sgf:g.sgf||'', familia:g.familia||''}; });
    var añadidos = 0;
    filas.forEach(function(f, i){
      if(!f || f.length < 2) return;
      var grado = String(f[0]==null?'':f[0]).trim();
      var sgf = String(f[1]==null?'':f[1]).trim();
      var familia = f.length > 2 ? String(f[2]==null?'':f[2]).trim() : '';
      if(!grado) return;
      if(i===0 && /grado|planch/i.test(grado)) return; // encabezado
      if(mapa[grado] === undefined) añadidos++;
      mapa[grado] = {sgf:sgf, familia:familia};
    });
    S.catalogs.grados = Object.keys(mapa).sort().map(function(g){ return {grado:g, sgf:mapa[g].sgf, familia:mapa[g].familia}; });
    try{ set('catalogs', S.catalogs); }catch(e){ toast('No se pudo guardar el catálogo'); return; }
    auditar('edicion','', 'Importación de catálogo de grados: '+S.catalogs.grados.length+' registros', '');
    toast(añadidos+' grados nuevos · '+S.catalogs.grados.length+' en total');
    render();
  }

  /* ============ EXCEL ============ */
  function loadExcelJS(){ return window.ExcelJS ? Promise.resolve() : loadScript("https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"); }

  /* Miniatura de la foto para que el Excel no pese de más */
  function miniFoto(dataURL, maxW){
    return new Promise(function(resolve){
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, (maxW||360)/img.width);
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width*scale));
        c.height = Math.max(1, Math.round(img.height*scale));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve({data:c.toDataURL('image/jpeg', 0.6), w:c.width, h:c.height});
      };
      img.onerror = function(){ resolve(null); };
      img.src = dataURL;
    });
  }

  function hojaDeFilas(wb, nombre, filas){
    var ws = wb.addWorksheet(nombre);
    if(!filas.length) return ws;
    var cols = Object.keys(filas[0]);
    ws.columns = cols.map(function(k){ return {header:k, key:k, width:Math.max(12, Math.min(46, k.length+6))}; });
    filas.forEach(function(f){ ws.addRow(f); });
    ws.getRow(1).font = {bold:true};
    ws.views = [{state:'frozen', ySplit:1}];
    ws.autoFilter = {from:{row:1, column:1}, to:{row:1, column:cols.length}};
    return ws;
  }

  function exportExcel(){
    if(!S.registros.length){ toast('No hay registros que exportar'); return; }
    registrarAcceso('Exportó el historial de rollos a Excel');
    var conFoto = [];
    S.registros.forEach(function(r){
      fotosDe(r).forEach(function(f, i){ conFoto.push({reg:r, foto:f, idx:i}); });
    });
    var incluirFotos = true;
    if(conFoto.length > 250){
      incluirFotos = confirm('Hay ' + conFoto.length + ' fotos. Incluirlas hace el archivo más pesado y tarda más.\n\nAceptar = con fotos · Cancelar = solo los datos');
    }
    toast('Preparando archivo…');
    loadExcelJS().then(function(){
      var wb = new window.ExcelJS.Workbook();
      wb.creator = 'Inspección de rollos · Ternium';
      wb.created = new Date();

      var filas = S.registros.slice().reverse().map(function(r){
        var t = S.tracking[r.rolloId];
        return {
          'Fecha':r.fecha||'','Hora':r.hora||'','Turno':r.turno||'','ID Rollo':r.rolloId||'',
          'Resultado':etqResLarga(r.resultado),'Familia defecto':r.familia||'','Código defecto':r.defectoCode||'',
          'Defecto':r.defecto||'','Variación':r.variacion||'','Ubicación defecto':r.ubicacion||'',
          'Severidad':r.severidad||'','Inspector':r.inspector||'',
          'Grado de acero':r.grado||'','Familia SGF':r.familiaSGF||'','Familia':r.familiaDesc||'',
          'Espesor (mm)':r.espesor||'','Ancho (mm)':r.ancho||'','Peso (kg)':r.peso||'',
          'Fecha producción':r.fechaProduccion||'','Enrollador':r.enrollador||'',
          'Zona actual':t?t.zona:'', 'Movimientos':t?t.movimientos.length:0,
          'Destino final':t&&t.finalizado?'Sí':'No', 'Fecha destino final':t&&t.finalizado?(t.finalizadoFecha||''):'',
          'Modificaciones':(r.ediciones||[]).length,
          'Fotos (cantidad)':fotosDe(r).length, 'Comentario':r.comentario||''
        };
      });
      hojaDeFilas(wb, 'REGISTRO', filas);

      var movs=[];
      Object.keys(S.tracking).forEach(function(k){
        var t = S.tracking[k];
        (t.movimientos||[]).forEach(function(m,i){
          movs.push({'ID Rollo':k,'Paso':i+1,'Zona':m.zona,'Medio de transporte':m.medio||'','Fecha':m.fecha,'Hora':m.hora,'Turno':m.turno||'','Usuario':m.usuario,'Nota':m.nota||''});
        });
      });
      hojaDeFilas(wb, 'MOVIMIENTOS', movs);

      var ediciones=[];
      S.registros.forEach(function(r){
        (r.ediciones||[]).forEach(function(ed,i){
          ediciones.push({'ID Rollo':r.rolloId,'N.º':i+1,'Fecha':ed.fecha,'Hora':ed.hora,'Turno':ed.turno||'','Usuario':ed.usuario,
            'Cambios':ed.cambios,'Motivo':ed.motivo});
        });
      });
      hojaDeFilas(wb, 'MODIFICACIONES', ediciones);

      hojaDeFilas(wb, 'AUDITORIA', S.auditoria.map(function(a){
        return {'Fecha':a.fecha,'Hora':a.hora,'Turno':a.turno||'','Usuario':a.usuario,'Tipo':a.tipo,'ID Rollo':a.rolloId,'Detalle':a.detalle,'Motivo':a.motivo};
      }));

      var cat=[]; FAMILIAS.forEach(function(f){ f.defectos.forEach(function(d){ cat.push({'Código':d.code,'Familia':f.name,'Defecto':d.name}); }); });
      hojaDeFilas(wb, 'CATALOGO_DEFECTOS', cat);
      hojaDeFilas(wb, 'CATALOGO_GRADOS', (S.catalogs.grados||[]).map(function(g){
        return {'Grado Planchón':g.grado,'SGF':g.sgf||'','Familia':g.familia||''};
      }));

      /* Hoja de fotos: una fila por inspección; si tiene varias fotos se acomodan
         hacia la derecha (Foto 1, Foto 2, Foto 3…) */
      function hojaFotos(){
        if(!incluirFotos || !conFoto.length) return Promise.resolve();
        var grupos = [], porReg = {};
        conFoto.forEach(function(item){
          var k = item.reg.id;
          if(!porReg[k]){ porReg[k] = {reg:item.reg, fotos:[]}; grupos.push(porReg[k]); }
          porReg[k].fotos.push(item.foto);
        });
        var maxFotos = grupos.reduce(function(m,g){ return Math.max(m, g.fotos.length); }, 1);
        var ws = wb.addWorksheet('FOTOS');
        var cols = [
          {header:'ID Rollo', width:20},{header:'Fecha', width:12},{header:'Hora', width:8},
          {header:'Turno', width:7},{header:'Inspector', width:20},{header:'Resultado', width:26},
          {header:'Defecto', width:26},{header:'Comentario', width:30}
        ];
        var COL_FOTO = cols.length;
        for(var c=1; c<=maxFotos; c++) cols.push({header:'Foto '+c, width:34});
        ws.columns = cols;
        ws.getRow(1).font = {bold:true};
        ws.views = [{state:'frozen', ySplit:1, xSplit:1}];
        var hechas = 0;
        var gi = 0;
        function siguienteGrupo(){
          if(gi >= grupos.length) return Promise.resolve();
          var g = grupos[gi], r = g.reg;
          var fila = ws.addRow({});
          var n = fila.number;
          ws.getCell('A'+n).value = r.rolloId||'';
          ws.getCell('B'+n).value = r.fecha||'';
          ws.getCell('C'+n).value = r.hora||'';
          ws.getCell('D'+n).value = r.turno||'';
          ws.getCell('E'+n).value = r.inspector||'';
          ws.getCell('F'+n).value = etqResLarga(r.resultado);
          ws.getCell('G'+n).value = r.defecto ? (r.defectoCode+' '+r.defecto) : '';
          ws.getCell('H'+n).value = r.comentario||'';
          ['A','B','C','D','E','F','G','H'].forEach(function(l){ ws.getCell(l+n).alignment = {wrapText:true, vertical:'top'}; });
          var alto = 110;
          fila.height = alto * 0.78;
          var k = 0;
          function siguienteFoto(){
            if(k >= g.fotos.length) return Promise.resolve();
            var foto = g.fotos[k];
            hechas++;
            if(hechas % 10 === 1) toast('Agregando fotos… '+hechas+' de '+conFoto.length);
            var p = foto.data ? Promise.resolve(foto.data) : cargarFoto(foto.id);
            return p.then(function(src){ return src ? miniFoto(src, 360) : null; }).then(function(mini){
              var col = COL_FOTO + k;
              if(mini){
                var h = alto, w = Math.round(h * (mini.w/mini.h));
                if(w > 230){ w = 230; h = Math.round(w * (mini.h/mini.w)); }
                var imgId = wb.addImage({base64: mini.data.split(',')[1], extension:'jpeg'});
                ws.addImage(imgId, {tl:{col:col+0.05, row:n-1+0.08}, ext:{width:w, height:h}});
              } else {
                ws.getCell(n, col+1).value = 'Foto no disponible sin conexión';
              }
              k++;
              return siguienteFoto();
            });
          }
          return siguienteFoto().then(function(){ gi++; return siguienteGrupo(); });
        }
        return siguienteGrupo();
      }

      return hojaFotos().then(function(){
        return wb.xlsx.writeBuffer();
      }).then(function(buf){
        var blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'inspeccion_rollos_'+fechaHoy()+'.xlsx';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
        toast('Excel generado'+(incluirFotos&&conFoto.length?' con '+conFoto.length+' foto(s)':''));
      });
    }).catch(function(e){ console.error(e); toast('No se pudo generar el Excel'); });
  }

  /* Importa a Firebase un respaldo JSON (de la versión con localStorage o de esta).
     Usa los mismos IDs: importar dos veces el mismo archivo no duplica nada. */
  function restoreBackup(file){
    if(!S.isAdmin) return;
    var reader=new FileReader();
    reader.onload=function(e){ importarDatos(safeParse(e.target.result,null)); };
    reader.readAsText(file);
  }
  function importarDatos(d){
      if(!S.isAdmin) return;
      if(!d || !Array.isArray(d.registros)){ toast('El archivo no es un respaldo válido'); return; }
      if(!navigator.onLine){ toast('Necesitas conexión para importar'); return; }
      var tracking = d.tracking||{}, master = d.rollosMaster||{}, audit = d.auditoria||[];
      var nFotos = 0;
      d.registros.forEach(function(r){ nFotos += (r.fotos||[]).length; });
      if(!confirm('Se importarán a Firebase:\n· '+d.registros.length+' registros ('+nFotos+' fotos)\n· '+Object.keys(tracking).length+' rollos en seguimiento\n· '+audit.length+' movimientos de auditoría\n\nLo que ya exista con el mismo ID se actualiza, no se duplica. ¿Continuar?')) return;
      var conCatalogos = !!d.catalogs && confirm('¿Reemplazar también los catálogos (grados, zonas, medios, defectos, enrolladores) y las variaciones por los del respaldo?\n\nAceptar = reemplazar · Cancelar = conservar los actuales');
      var ops=[], uid=S.perfil.uid;
      d.registros.forEach(function(r0){
        var r = copia(r0);
        if(!r.id) r.id = 'r'+(r.ts||Date.now())+Math.random().toString(36).slice(2,7);
        var fotoIds = (r.fotoIds||[]).slice();
        (r.fotos||[]).forEach(function(f, i){
          if(typeof f!=='string' || f.length>1000000) return;
          var fid = docId(r.id)+'_'+i;
          fotoIds.push(fid);
          ops.push({ref:ref(COL.fotos,fid), data:{registroId:r.id, rolloId:r.rolloId||'', data:f, ts:r.ts||0, uid:uid, importado:true}});
        });
        delete r.fotos;
        r.fotoIds = fotoIds;
        r.ediciones = r.ediciones||[];
        r.inspectorUid = r.inspectorUid||'';
        ops.push({ref:ref(COL.registros,r.id), data:r});
      });
      Object.keys(tracking).forEach(function(k){
        var t = copia(tracking[k]); t.rolloId = t.rolloId||k; t.movimientos = t.movimientos||[];
        ops.push({ref:ref(COL.tracking,k), data:t});
      });
      Object.keys(master).forEach(function(k){
        var m = copia(master[k]); m.id = m.id||k;
        ops.push({ref:ref(COL.master,k), data:m});
      });
      audit.forEach(function(a0){
        var a = copia(a0);
        if(!a.id) a.id = 'a'+(a.ts||Date.now())+Math.random().toString(36).slice(2,6);
        a.uid = a.uid||'';
        ops.push({ref:ref(COL.auditoria,a.id), data:a});
      });
      if(conCatalogos){
        ops.push({ref:ref(COL.config,'catalogos'), data:sinMarca(migrarGrados(copia(d.catalogs)))});
        if(d.variaciones) ops.push({ref:ref(COL.config,'variaciones'), data:{mapa:copia(d.variaciones)}});
      }
      toast('Importando…');
      commitEnLotes(ops, function(i,n){ toast('Importando… lote '+i+' de '+n); }).then(function(){
        auditar('edicion','','Importación de respaldo: '+d.registros.length+' registros, '+Object.keys(tracking).length+' rollos'+(conCatalogos?' y catálogos':''),'');
        var nombres = (d.usuarios||[]).map(function(u){ return u.nombre; }).filter(Boolean);
        alert('Importación terminada: '+ops.length+' documentos escritos.' +
          (nombres.length ? '\n\nLas cuentas no se importan (las contraseñas no viajan en el respaldo). Registra en «Inspectores» a quien siga activo:\n· '+nombres.join('\n· ') : ''));
      }).catch(function(err){
        console.error(err);
        alert('La importación se detuvo: '+(err && err.message ? err.message : err)+'\nPuedes volver a importar el mismo archivo; lo ya subido no se duplica.');
      });
  }

  /* ============ CUENTAS (solo administrador) ============ */
  var appAltas = null, authAltas = null;
  /* Segunda instancia de Firebase: crear cuentas ahí no cierra la sesión del admin */
  function authSecundaria(){
    if(!authAltas){
      appAltas = initializeApp(firebaseConfig, 'altas');
      authAltas = initializeAuth(appAltas, {persistence: inMemoryPersistence});
    }
    return authAltas;
  }
  function crearCuentaAuth(usuario, pin, n){
    var sa = authSecundaria(), email = correoDe(usuario, n);
    return createUserWithEmailAndPassword(sa, email, pin).then(function(cred){
      var uid = cred.user.uid;
      return signOut(sa).then(function(){ return {uid:uid, email:email, version:n}; });
    }, function(e){
      if(e && e.code==='auth/email-already-in-use' && n<20) return crearCuentaAuth(usuario, pin, n ? n+1 : 2);
      throw e;
    });
  }
  function mensajeAlta(e){
    var c=(e&&e.code)||'';
    if(c==='app/existe') return 'Ese usuario ya existe';
    if(c==='auth/network-request-failed') return 'Sin conexión: dar de alta requiere señal';
    if(c==='auth/weak-password') return 'Firebase rechazó la contraseña: usa al menos '+PASS_MIN+' caracteres';
    if(c==='auth/too-many-requests') return 'Demasiadas altas seguidas. Espera unos minutos.';
    if(c==='permission-denied') return 'Sin permiso para dar de alta usuarios';
    return 'No se pudo crear la cuenta'+(c?' ('+c+')':'');
  }
  /* Usuario interno a partir del nombre (juanperez); si ya existe se agrega un número */
  function usuarioDesdeNombre(nombre){
    var base = normUsuario(nombre).replace(/[^a-z0-9_-]/g,'').slice(0,16);
    if(base.length<3) base = (base+'admin').slice(0,16);
    return base;
  }
  function usuarioLibre(base, n){
    var u = n ? base+n : base;
    return getDoc(ref(COL.alias, u)).then(function(s){
      if(!s.exists()) return u;
      if(n>=30) throw {code:'app/existe'};
      return usuarioLibre(base, n ? n+1 : 2);
    });
  }
  function darDeAlta(nombre, usuario, pin, rol){
    S.userBusy=true; render();
    usuarioLibre(usuario, 0).then(function(u){

  /* Restablecer PIN (plan Spark): cuenta nueva ligada al mismo usuario; la anterior queda desactivada */
  function restablecerPin(anterior, pin){
    S.userBusy=true; render();
    crearCuentaAuth(anterior.usuario, pin, (anterior.version||1)+1).then(function(c){
      var b = writeBatch(db);
      b.set(ref(COL.usuarios, c.uid), {usuario:anterior.usuario, nombre:anterior.nombre, rol:anterior.rol||'inspector', activo:true,
        email:c.email, version:c.version, creado:Date.now(), creadoPor:S.perfil.usuario, reemplazaA:anterior.uid});
      b.update(ref(COL.usuarios, anterior.uid), {activo:false, reemplazadoPor:c.uid});
      b.set(ref(COL.alias, anterior.usuario), {uid:c.uid, email:c.email, activo:true});
      return b.commit();
    }).then(function(){
      S.userBusy=false; S.resetUid=null;

  function cambiarActivo(u, activo){
    var b = writeBatch(db);
    b.update(ref(COL.usuarios, u.uid), {activo:activo});
    b.set(ref(COL.alias, u.usuario), {uid:u.uid, email:u.email||correoDe(u.usuario, u.version), activo:activo});
    escribir(b.commit());
    if(!activo) quitarPerfil(u.usuario);
    auditar('edicion','',(activo?'Administrador desbloqueado: ':'Administrador bloqueado: ')+u.nombre+' ('+u.usuario+')','');

  /* Eliminar definitivamente al segundo administrador: se borra su perfil (y los de
     restablecimientos anteriores) y su usuario queda libre. Sus registros se conservan. */
  function quitarAdmin(u){
    var b = writeBatch(db);
    S.usuarios.filter(function(x){ return x.uid===u.uid || (x.usuario===u.usuario && x.rol==='admin' && x.uid!==(S.perfil&&S.perfil.uid)); })
      .forEach(function(x){ b.delete(ref(COL.usuarios, x.uid)); });
    b.delete(ref(COL.alias, u.usuario));
    escribir(b.commit());
    S.usuarios = S.usuarios.filter(function(x){ return !(x.uid===u.uid || (x.usuario===u.usuario && x.rol==='admin' && x.uid!==(S.perfil&&S.perfil.uid))); });
    quitarPerfil(u.usuario);
    sincronizarPublicoAdmins();
    auditar('eliminacion','','Administrador eliminado: '+u.nombre+' ('+u.usuario+')','');
    toast('Administrador eliminado');
  }

      if(esTemporada(v.tema)){
        /* Estilo elegido a mano: queda fijo y se apagan las temporadas automáticas */
        if(!temaCfg.auto && temaCfg.tema===v.tema) return;
        guardarCfgTema({tema:v.tema, auto:false}, 'Estilo fijo: '+TEMAS[v.tema].nombre+' (automáticas apagadas)');

        var cfg = {tema:v.tema, color:v.color, auto:temaCfg.auto && !esTemporada(temaCfg.tema) ? true : temaCfg.auto};
        if(mismaCfg(normCfg(cfg), temaCfg)) return;
        var nom = v.tema==='personal' ? 'Color '+v.color : TEMAS[v.tema].nombre;
        guardarCfgTema(cfg, temaCfg.auto && temporadaDe(new Date()) ? 'Color base: '+nom+' (se verá cuando termine la temporada)' : 'Apariencia: '+nom);
      }
    }

  /* ============ GUARDAR ============ */
  function guardarRegistro(){
    if(!idValido()){ toast('El ID debe llevar exactamente '+ID_MID_LEN+' dígitos'); S.step='id'; render(); return; }
    var id=rolloId();
    var now=new Date();
    var master=S.rollosMaster[id]||{};
    var regId='r'+now.getTime()+Math.random().toString(36).slice(2,7);
    var batch=writeBatch(db);
    var fotoIds=S.fotos.map(function(f,i){
      if(f && f.fid) return f.fid;
      var fid=regId+'_'+i;
      S.fotoCache[fid]=f;
      batch.set(ref(COL.fotos,fid), {registroId:regId, rolloId:id, data:f, ts:now.getTime(), uid:S.perfil.uid});
      return fid;
    });
    var reg={
      id:regId,
      ts:now.getTime(), fecha:fechaHoy(now), hora:horaAhora(now), turno:turnoDe(now), rolloId:id,
      resultado:S.resultado||'Conforme',
      familia:S.familia?S.familia.name:'',
      defectoCode:S.defecto?S.defecto.code:'',
      defecto:S.defecto?S.defecto.name:'',
      variacion:S.variacion||'', ubicacion:S.ubicacion||'', severidad:S.severidad||'',
      inspector:usuarioActual(), inspectorUid:S.perfil.uid, inspectorUsuario:S.perfil.usuario||'',
      grado:master.grado||S.rolloData.grado||'',
      familiaSGF:master.familiaSGF||S.rolloData.familiaSGF||'',
      familiaDesc:master.familiaDesc||S.rolloData.familiaDesc||'',
      espesor:master.espesor||S.rolloData.espesor||'',
      ancho:master.ancho||S.rolloData.ancho||'',
      peso:master.peso||S.rolloData.peso||'',
      fechaProduccion:master.fecha||S.rolloData.fecha||'',
      enrollador:master.enrollador||S.rolloData.enrollador||'',
      fotoIds:fotoIds, comentario:S.comentario||'', ediciones:[],
      fueraRango: fueraDeRango(master.espesor||S.rolloData.espesor||'', master.ancho||S.rolloData.ancho||'').length>0
    };
    batch.set(ref(COL.registros,regId), reg);
    S.registros.unshift(reg);
    /* Datos del rollo: solo se completan los que falten, nunca se sobrescriben */
    var nuevos={};
    ['grado','familiaSGF','familiaDesc','espesor','ancho','peso','fecha','enrollador'].forEach(function(k){
      if(!master[k] && S.rolloData[k]) nuevos[k]=S.rolloData[k];
    });
    if(Object.keys(nuevos).length){
      nuevos.id=id;
      S.rollosMaster[id]=Object.assign({}, master, nuevos);
      batch.set(ref(COL.master,id), nuevos, {merge:true});
    }
    iniciarTracking(id, batch);
    escribir(batch.commit());
    auditar('creacion', id, 'Inspección registrada: '+etqResLarga(reg.resultado)+(reg.defecto?' · '+reg.defectoCode+' '+reg.defecto:''), '');
    toast(S.online ? 'Rollo guardado en '+ZONA_ORIGEN : 'Guardado sin señal · se subirá al reconectar');
    resetCaptureFlow();
    render();
  }

  function guardarEdicion(){
    var r=S.editReg;
    borradorEdicion();
    var D=S.editDraft||{};
    var motivo=(D.motivo||'').trim();

    var nuevoRes=D.resultado||r.resultado;
    var defCode=D.defectoCode||'';
    var def=defCode?buscarDefecto(defCode):null;
    if(nuevoRes!=='Conforme' && !def){ S.editErr='Para '+nuevoRes+' debes elegir un defecto.'; render(); return; }
    if(nuevoRes==='Conforme') def=null;
    var fam=def?familiaDeDefecto(def.code):null;
    var nuevo={
      resultado:nuevoRes,
      familia:fam?fam.name:'',
      defectoCode:def?def.code:'',
      defecto:def?def.name:'',
      variacion:def ? (D.variacion||'') : '',
      ubicacion:def ? (D.ubicacion||'') : '',
      severidad:def ? (D.severidad||'') : '',
      comentario:D.comentario!==undefined ? D.comentario : (r.comentario||'')
    };
    var etiquetas={resultado:'Resultado',familia:'Familia',defecto:'Defecto',variacion:'Variación',
      ubicacion:'Ubicación',severidad:'Severidad',comentario:'Comentario'};
    var cambios=[];
    Object.keys(etiquetas).forEach(function(k){
      var antes=r[k]||'', desp=nuevo[k]||'';
      if(k==='resultado'){ antes=etqResLarga(antes); desp=etqResLarga(desp); }
      if(antes!==desp) cambios.push(etiquetas[k]+': "'+(antes||'—')+'" → "'+(desp||'—')+'"');
    });
    var nNuevas=S.editFotos.length, quitar=S.editQuitar.slice();
    var cambiosDatos=cambios.length;
    if(nNuevas) cambios.push('Fotos agregadas: '+nNuevas);
    if(quitar.length) cambios.push('Fotos quitadas: '+quitar.length);
    if(!cambios.length){ S.editErr='No cambiaste ningún campo ni agregaste fotos.'; render(); return; }
    if((cambiosDatos || quitar.length) && motivo.length<10){
      S.editErr='Describe el motivo del cambio (mínimo 10 caracteres).'; render(); sacudir('#edit-motivo'); return;
    }
    if(!motivo) motivo='Se agregaron fotos';

    var now=new Date();
    var ed={ts:now.getTime(), fecha:fechaHoy(now), hora:horaAhora(now), turno:turnoDe(now),
      usuario:usuarioActual(), motivo:motivo, cambios:cambios.join(' | ')};
    var batch=writeBatch(db);
    var nuevosIds=S.editFotos.map(function(d,i){
      if(d && d.fid) return d.fid;
      var fid=r.id+'_'+now.getTime()+'_'+i;
      S.fotoCache[fid]=d;
      batch.set(ref(COL.fotos,fid), {registroId:r.id, rolloId:r.rolloId, data:d, ts:now.getTime(), uid:S.perfil.uid});
      return fid;
    });
    quitar.forEach(function(fid){ batch.delete(ref(COL.fotos,fid)); delete S.fotoCache[fid]; });
    borrarIndicesDe(quitar, batch);
    var datos=Object.assign({}, nuevo, {ediciones:arrayUnion(ed)});
    if(nNuevas || quitar.length){
      var ids=(r.fotoIds||[]).filter(function(fid){ return quitar.indexOf(fid)===-1; }).concat(nuevosIds);
      datos.fotoIds=ids; r.fotoIds=ids;
    }
    batch.update(ref(COL.registros,r.id), datos);
    escribir(batch.commit());
    r.ediciones=r.ediciones||[];
    r.ediciones.push(ed);
    Object.keys(nuevo).forEach(function(k){ r[k]=nuevo[k]; });
    auditar('edicion', r.rolloId, cambios.join(' | '), motivo);
    cerrarEdicion();
    toast(cambiosDatos ? 'Cambios guardados' : (nNuevas ? nNuevas+' foto(s) agregada(s)' : 'Cambios guardados'));
    render();
  }

  /* ============ DEMO Y BORRADO (solo administrador) ============ */
  function cargarDemo(){
    var base=Date.now(), batch=writeBatch(db);
    var demos=[
      {rolloId:'4A695767PM400',resultado:'Conforme',grado:'C14MC4',familiaSGF:'6',familiaDesc:'Grados comerciales Medios'},
      {rolloId:'4A695768PM400',resultado:'Defecto',familia:'Aspecto físico',defectoCode:'593',defecto:'Devanado',variacion:'Últimas vueltas flojas',ubicacion:'DIC',severidad:'Leve',grado:'T05CR8',familiaSGF:'41',familiaDesc:'> X70'},
      {rolloId:'4A695769PM400',resultado:'Defecto',familia:'Defectos superficiales',defectoCode:'19',defecto:'Rayas',ubicacion:'Centro',severidad:'Moderado',grado:'A06CR5',familiaSGF:'31',familiaDesc:'AHSS'},
      {rolloId:'4A695770PM400',resultado:'Scrap',familia:'Orilla',defectoCode:'765',defecto:'Orilla trozada',ubicacion:'Todo el rollo',comentario:'Rollo retenido en patio',grado:'SIAL20',familiaSGF:'27',familiaDesc:'Eléctricos'}
    ];
    demos.forEach(function(d,i){
      var t=new Date(base-(demos.length-i)*3600000);
      var reg=Object.assign({
        id:'demo'+t.getTime()+i, ts:t.getTime(), fecha:fechaHoy(t), hora:horaAhora(t), turno:turnoDe(t),
        inspector:i%2?'Ana Castillo':'Luis Ramírez', inspectorUid:'', inspectorUsuario:'',
        espesor:'2.50',ancho:'1200',peso:'18500',enrollador:'Enrollador 2',
        fechaProduccion:'',variacion:'',severidad:'',familia:'',defectoCode:'',defecto:'',
        comentario:'',fotoIds:[],ediciones:[],grado:'',familiaSGF:'',familiaDesc:''
      },d);
      batch.set(ref(COL.registros,reg.id), reg);
      if(!S.tracking[reg.rolloId]){
        var mov={zona:ZONA_ORIGEN,medio:'',usuario:reg.inspector,fecha:reg.fecha,hora:reg.hora,turno:reg.turno,ts:t.getTime(),nota:'Alta por inspección'};
        var tr={rolloId:reg.rolloId, zona:ZONA_ORIGEN, ultimoUsuario:reg.inspector, ultimaFecha:reg.fecha, ultimaHora:reg.hora,
          ultimoTurno:reg.turno, ultimoTs:t.getTime(), movimientos:[mov]};
        if(reg.rolloId==='4A695768PM400'){
          var t2=new Date(base-1800000);
          var mov2={zona:'Cooling Bay',medio:'MCA',usuario:'Ana Castillo',fecha:fechaHoy(t2),hora:horaAhora(t2),turno:turnoDe(t2),ts:t2.getTime(),nota:'Enfriamiento programado'};
          tr.movimientos.push(mov2);
          tr.zona='Cooling Bay'; tr.ultimoUsuario='Ana Castillo'; tr.ultimaFecha=mov2.fecha; tr.ultimaHora=mov2.hora; tr.ultimoTurno=mov2.turno; tr.ultimoTs=mov2.ts;
        }
        batch.set(ref(COL.tracking,reg.rolloId), tr);
      }
    });
    escribir(batch.commit().then(function(){ toast('Datos de ejemplo cargados'); }));
    auditar('creacion','','Carga de datos de ejemplo (4 rollos)','');
  }

  function borrarTodo(){
    toast('Borrando…');
    var cols=[COL.registros, COL.fotos, COL.tracking, COL.master, COL.auditoria];
    Promise.all(cols.map(function(c){ return getDocs(collection(db,c)); })).then(function(res){
      var ops=[];
      res.forEach(function(qs){ qs.docs.forEach(function(d){ ops.push({tipo:'delete', ref:d.ref}); }); });
      ops.push({ref:ref(COL.config,'catalogos'), data:sinMarca(migrarGrados({}))});
      ops.push({ref:ref(COL.config,'variaciones'), data:{mapa:copia(DEFAULT_VARIACIONES)}});
      return commitEnLotes(ops, function(i,n){ toast('Borrando… lote '+i+' de '+n); }).then(function(){ return ops.length; });
    }).then(function(n){
      S.fotoCache={};
      auditar('eliminacion','','Borrado total de la base ('+n+' documentos)','');
      toast('Base borrada'); render();
    }).catch(function(e){ console.error(e); toast('No se pudo borrar todo — revisa la conexión'); });
  }

  init();
})();
</script>
