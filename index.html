  /* Lee lo escrito en la pantalla de edición para no perderlo al redibujar */
  function borradorEdicion(){
    function v(id){ var n=root.querySelector(id); return n ? n.value : undefined; }
    var d = S.editDraft || {};
    var map = {resultado:'#edit-resultado', defectoCode:'#edit-defecto', variacion:'#edit-variacion',
               ubicacion:'#edit-ubicacion', severidad:'#edit-severidad', comentario:'#edit-comentario', motivo:'#edit-motivo'};
    Object.keys(map).forEach(function(k){ var x=v(map[k]); if(x!==undefined) d[k]=x; });
    S.editDraft = d;
  }
  function abrirEdicion(r){
    S.editVolver = S.tab; S.editReg=r; S.editErr=''; S.editFotos=[]; S.editQuitar=[]; S.editDraft=null;
    S.tab='captura'; render();
  }
  function cerrarEdicion(){
    var volver = S.editVolver || 'historial';
    S.editReg=null; S.editErr=''; S.editFotos=[]; S.editQuitar=[]; S.editDraft=null; S.editVolver='';
    S.tab = volver;

  /* ============ TRACKING ============ */
  function horasSinMover(t){
    return (Date.now() - (t.ultimoTs||Date.now())) / 3600000;
  }
  /* La alerta es solo para los rollos que siguen en la zona de contingencia:
     ahí nacen todos y la idea es que salgan de ahí. Un rollo marcado como
     "destino final" ya no alerta. */
  function estaDetenido(t){
    return t.zona===ZONA_ORIGEN && !t.finalizado && horasSinMover(t) >= HORAS_DETENIDO;
  }
  function textoFinal(t){
    if(!t.finalizado) return '';
    return 'En su destino final' + (t.finalizadoFecha?' desde '+t.finalizadoFecha:'') + (t.finalizadoPor?' · '+t.finalizadoPor:'');
  }
  function textoAntiguedad(t){
    var h = horasSinMover(t);
    if(h < 1) return 'hace menos de 1 h';
    if(h < 24) return 'hace '+Math.floor(h)+' h';
    var d = Math.floor(h/24);
    return 'hace '+d+' día'+(d===1?'':'s');
  }

  function trackingList(){
    return Object.keys(S.tracking).map(function(k){ return S.tracking[k]; })
      .sort(function(a,b){ return (b.ultimoTs||0)-(a.ultimoTs||0); });
  }

  function renderTracking(){
    if(S.trackVista==='detalle' && S.trackRollo) return screenTrackDetalle();
    var q = S.trackFiltro.trim().toLowerCase();
    var todos = trackingList();
    var detenidos = todos.filter(estaDetenido);
    var finalizados = todos.filter(function(t){ return t.finalizado; });
    var lista = todos.filter(function(t){
      if(S.trackZona==='Detenidos'){ if(!estaDetenido(t)) return false; }
      else if(S.trackZona==='Finalizados'){ if(!t.finalizado) return false; }
      else if(S.trackZona!=='Todas' && t.zona!==S.trackZona) return false;
      if(!q) return true;
      return t.rolloId.toLowerCase().indexOf(q)!==-1;
    });
    var porZona = {};
    todos.forEach(function(t){ porZona[t.zona]=(porZona[t.zona]||0)+1; });

    Object.keys(porZona).forEach(function(z){ if(listaZonas.indexOf(z)===-1) listaZonas.push(z); });

    var aviso = (detenidos.length && S.trackZona!=='Detenidos')

          '<div class="ra-meta"><b style="color:var(--info);">'+escHtml(t.zona)+'</b> · '+(t.movimientos.length)+' movimiento(s)</div>' +
          '<div class="ra-meta">Último: '+escHtml(t.ultimoUsuario||'')+' · '+escHtml(t.ultimaFecha||'')+' '+escHtml(t.ultimaHora||'')+(t.ultimoTurno?' · Turno '+escHtml(t.ultimoTurno):'')+'</div>' +

    var barraSel = '';

        return '<button class="ra-btn ra-btn-outline ra-btn-sm" data-mover-lote="'+escAttr(z)+'">'+escHtml(z)+'</button>';
      }).join('');
      barraSel = '<div class="ra-card" style="padding:14px;border-color:var(--ink);">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;">' +
            '<div><div class="ra-label" style="margin:0;">SELECCIÓN MÚLTIPLE</div>' +
            '<div class="ra-meta">'+S.trackSeleccion.length+' rollo(s) seleccionados</div></div>' +
            '<button class="ra-link" id="btn-sel-cancelar">Cancelar</button>' +
          '</div>' +
          '<div style="display:flex;gap:16px;margin-bottom:12px;">' +
            '<button class="ra-link" id="btn-sel-todos">Seleccionar los '+lista.length+' visibles</button>' +
            (S.trackSeleccion.length?'<button class="ra-link" id="btn-sel-ninguno">Quitar selección</button>':'') +
          '</div>' +
          (S.trackSeleccion.length
            ? (medios().length ? '<label class="ra-label">MEDIO DE TRANSPORTE</label><div class="ra-zchips" style="margin-bottom:14px;">' +
                medios().map(function(m){ return '<button class="ra-zchip'+(S.trackMedio===m?' on':'')+'" data-medio="'+escAttr(m)+'">'+escHtml(m)+'</button>'; }).join('') +
                '</div>' : '') +
              '<input class="ra-input" id="mover-nota-lote" placeholder="Nota (opcional)" autocomplete="off">' +
              chipsDestinoFinal() +
              '<label class="ra-label" style="margin-top:12px;">MOVER TODOS A</label><div class="ra-grid">'+zonasDestino+'</div>' +
              '<label class="ra-label" style="margin-top:14px;">O SIN MOVERLOS</label>' +
              '<button class="ra-btn ra-btn-conforme ra-btn-block ra-btn-sm" id="btn-final-lote" style="margin-bottom:6px;">Marcar como destino final</button>' +
              '<button class="ra-link" id="btn-quitar-final-lote">Quitar la marca de destino final</button>'

    return aviso +
      '<div class="ra-card" style="padding:14px;">' +
        '<label class="ra-label">FILTRAR POR ZONA</label>' +

        '<input class="ra-input" id="track-filtro" inputmode="search" placeholder="Ej. 695767 o 4A695767PM400" value="'+escAttr(S.trackFiltro)+'" autocomplete="off" style="margin-bottom:0;">' +

      '</div>' + barraSel +

          '<button class="ra-link" id="btn-quitar-final">Quitar la marca de destino final</button>' +

    } else if(t.zona===ZONA_ORIGEN){
      /* En contingencia no se puede marcar destino final: el objetivo es sacarlo de ahí */

    return '<div class="ra-topbar"><button class="ra-back" id="btn-track-back">‹ Todos los rollos</button></div>' +
      '<div class="ra-card">' +

          '<div class="ra-meta" style="margin-top:4px;">Desde '+escHtml(t.ultimaFecha||'')+' '+escHtml(t.ultimaHora||'')+(t.ultimoTurno?' · Turno '+escHtml(t.ultimoTurno):'')+' · '+escHtml(t.ultimoUsuario||'')+'</div></div>' +
        (t.finalizado?'<div class="ra-meta" style="color:var(--conforme);font-weight:600;margin:-6px 0 12px;">✓ '+escHtml(textoFinal(t))+'</div>':'') +

          ? '<label class="ra-label">MEDIO DE TRANSPORTE</label><div class="ra-zchips" style="margin-bottom:14px;">'+chipsMedio+'</div>'

  function cardEliminarSeguimiento(rid){
    var n = S.registros.filter(function(x){ return x.rolloId===rid; }).length;
    return '<div class="ra-card" style="border-left:3px solid var(--scrap);">' +
        '<div class="ra-label" style="color:var(--scrap);">SOLO ADMINISTRADOR</div>' +

        '<div class="ra-h2">'+(n ? 'Tiene '+n+' inspección(es); se conservan en el historial. Solo se borra su ubicación y recorrido.'
                                 : 'No tiene inspecciones guardadas (posible registro de prueba). Al quitarlo se podrá registrar otra vez desde cero.')+'</div>' +
        '<button class="ra-btn ra-btn-outline ra-btn-block" data-track-delete="'+escAttr(rid)+'" style="margin-bottom:0;color:var(--scrap);border-color:var(--scrap);">Eliminar de Ubicación</button>' +
      '</div>';
  }

  function camposTracking(t){
    return {rolloId:t.rolloId, zona:t.zona, ultimoUsuario:t.ultimoUsuario, ultimaFecha:t.ultimaFecha,
            ultimaHora:t.ultimaHora, ultimoTurno:t.ultimoTurno, ultimoTs:t.ultimoTs,
            finalizado:!!t.finalizado, finalizadoTs:t.finalizadoTs||0,
            finalizadoPor:t.finalizadoPor||'', finalizadoFecha:t.finalizadoFecha||''};
  }
  function nuevoMovimiento(zona, nota, medio, now){
    return {zona:zona, medio:medio||'', usuario:usuarioActual(), fecha:fechaHoy(now), hora:horaAhora(now),
            turno:turnoDe(now), ts:now.getTime(), nota:nota||''};
  }
  function aplicarMovimiento(t, mov){
    t.movimientos.push(mov);
    t.zona=mov.zona; t.ultimoUsuario=mov.usuario; t.ultimaFecha=mov.fecha; t.ultimaHora=mov.hora;
    t.ultimoTurno=mov.turno; t.ultimoTs=mov.ts;
    /* Si vuelve a moverse, deja de estar en su destino final */
    t.finalizado=false; t.finalizadoTs=0; t.finalizadoPor=''; t.finalizadoFecha='';
    /* arrayUnion: si dos equipos mueven el mismo rollo sin señal, se conservan ambos movimientos */
    return Object.assign(camposTracking(t), {movimientos:arrayUnion(mov)});
  }

  /* Marca los campos de destino final sobre un movimiento ya aplicado */
  function marcarFinalEnMovimiento(t, datos, now){
    t.finalizado=true; t.finalizadoTs=now.getTime();
    t.finalizadoPor=usuarioActual(); t.finalizadoFecha=fechaHoy(now);
    datos.finalizado=true; datos.finalizadoTs=t.finalizadoTs;
    datos.finalizadoPor=t.finalizadoPor; datos.finalizadoFecha=t.finalizadoFecha;
    return datos;
  }
  function moverRollo(rolloIdVal, zona, nota, medio, esFinal){
    var t = S.tracking[rolloIdVal];
    if(!t) return;
    var now = new Date();
    var mov = nuevoMovimiento(zona, nota, medio, now);
    var datos = aplicarMovimiento(t, mov);
    var final = !!esFinal && zona!==ZONA_ORIGEN;
    if(final) datos = marcarFinalEnMovimiento(t, datos, now);
    escribir(setDoc(ref(COL.tracking, rolloIdVal), datos, {merge:true}));
    auditar('movimiento', rolloIdVal, 'Movido a '+zona+(medio?' en '+medio:'')+(final?' · destino final':''), nota||'');
    S.trackMedio=''; S.trackFinal=false;
    toast('Rollo movido a '+zona+(final?' · destino final':(medio?' en '+medio:'')));
    if(esFinal && zona===ZONA_ORIGEN) toast(ZONA_ORIGEN+' no puede ser destino final');
    render();
  }

  function moverLote(ids, zona, nota, medio, esFinal){
    var now=new Date(), ops=[];
    var final = !!esFinal && zona!==ZONA_ORIGEN;
    ids.forEach(function(id){
      var t=S.tracking[id];
      if(!t || t.zona===zona) return;
      var mov = nuevoMovimiento(zona, nota||'Movimiento en lote', medio, now);
      var datos = aplicarMovimiento(t, mov);
      if(final) datos = marcarFinalEnMovimiento(t, datos, now);
      ops.push({ref:ref(COL.tracking,id), data:datos, merge:true});
    });
    if(!ops.length){ toast('Esos rollos ya están en '+zona); return; }
    escribir(commitEnLotes(ops));
    auditar('movimiento','('+ops.length+' rollos)','Movimiento en lote a '+zona+(medio?' en '+medio:'')+(final?' · destino final':'')+': '+ids.join(', '), nota||'');
    S.trackModoSel=false; S.trackSeleccion=[]; S.trackMedio=''; S.trackFinal=false;
    toast(ops.length+' rollo(s) movidos a '+zona+(final?' · destino final':''));
    if(esFinal && zona===ZONA_ORIGEN) toast(ZONA_ORIGEN+' no puede ser destino final');
    render();
  }

  /* Marca (o desmarca) rollos que ya llegaron a su destino final */
  function marcarFinal(ids, valor){
    var now=new Date(), ops=[], n=0;
    var enOrigen=0;
    ids.forEach(function(id){
      var t=S.tracking[id];
      if(!t || !!t.finalizado===valor) return;
      if(valor && t.zona===ZONA_ORIGEN){ enOrigen++; return; }
      t.finalizado=valor;
      t.finalizadoTs=valor?now.getTime():0;
      t.finalizadoPor=valor?usuarioActual():'';
      t.finalizadoFecha=valor?fechaHoy(now):'';
      ops.push({ref:ref(COL.tracking,id), merge:true, data:{finalizado:valor, finalizadoTs:t.finalizadoTs,
        finalizadoPor:t.finalizadoPor, finalizadoFecha:t.finalizadoFecha}});
      n++;
    });
    if(!n){
      toast(enOrigen ? ZONA_ORIGEN+' no puede ser destino final' : (valor?'Esos rollos ya estaban marcados':'No había marcas que quitar'));
      return;
    }
    if(enOrigen) toast(enOrigen+' rollo(s) siguen en '+ZONA_ORIGEN+' y no se marcaron');
    escribir(commitEnLotes(ops));
    auditar('movimiento', n===1?ids[0]:'('+n+' rollos)',
      valor?'Marcado como destino final':'Se quitó la marca de destino final', '');
    toast(valor ? (n===1?'Marcado como destino final':n+' rollo(s) marcados') : 'Marca de destino final quitada');
    S.trackModoSel=false; S.trackSeleccion=[];
    render();
  }

  /* Cuando un rollo se queda sin inspecciones, su ubicación deja de contar:
     así al volver a capturarlo no aparece como "ya registrado".
     El administrador borra el seguimiento y los datos del rollo; un inspector
     (que no puede borrar ubicaciones) lo deja anulado. */
  function liberarRolloSinRegistros(rid, batch){
    if(!rid) return false;
    var quedan = S.registros.some(function(x){ return x.rolloId===rid; });
    if(quedan || !S.tracking[rid]) return false;
    if(S.isAdmin){
      batch.delete(ref(COL.tracking, rid));
      if(S.rollosMaster[rid]){ batch.delete(ref(COL.master, rid)); delete S.rollosMaster[rid]; }
    } else {
      var now = new Date();
      batch.set(ref(COL.tracking, rid), {anulado:true, anuladoTs:now.getTime(), anuladoPor:usuarioActual()}, {merge:true});
      S.trackingAnulado[rid] = true;
    }
    delete S.tracking[rid];
    return true;
  }

  /* Solo administrador: quita un rollo de Ubicación (por ejemplo, uno de prueba).
     Las inspecciones del rollo, si las hay, se conservan en el historial. */
  function eliminarSeguimiento(rid){
    if(!S.isAdmin || !S.tracking[rid]) return;
    var n = S.registros.filter(function(x){ return x.rolloId===rid; }).length;
    var aviso = n ? '\n\nEste rollo tiene '+n+' inspección(es): se conservan en el historial, solo se borra su ubicación y recorrido.'
                  : '\n\nNo tiene inspecciones guardadas; también se borrarán sus datos (grado, medidas).';
    var motivo = prompt('¿Eliminar '+rid+' de Ubicación?'+aviso+'\n\nMotivo (obligatorio):', '');
    if(motivo===null) return;
    if(motivo.trim().length<5){ toast('Escribe un motivo de al menos 5 caracteres'); return; }
    var batch = writeBatch(db);
    batch.delete(ref(COL.tracking, rid));
    if(!n && S.rollosMaster[rid]){ batch.delete(ref(COL.master, rid)); delete S.rollosMaster[rid]; }
    delete S.tracking[rid];
    escribir(batch.commit());
    auditar('eliminacion', rid, 'Ubicación del rollo eliminada por el administrador'+(n?' ('+n+' inspección(es) conservadas)':''), motivo.trim());
    if(S.trackRollo===rid){ S.trackVista='lista'; S.trackRollo=null; }
    toast('Rollo quitado de Ubicación');
    render();
  }

  function iniciarTracking(rolloIdVal, batch){
    if(S.tracking[rolloIdVal]) return;
    var now = new Date();
    var mov = {zona:ZONA_ORIGEN, medio:'', usuario:usuarioActual(), fecha:fechaHoy(now), hora:horaAhora(now), turno:turnoDe(now), ts:now.getTime(), nota:'Alta por inspección'};
    var t = {rolloId:rolloIdVal, zona:ZONA_ORIGEN, ultimoUsuario:usuarioActual(), ultimaFecha:fechaHoy(now),
             ultimaHora:horaAhora(now), ultimoTurno:turnoDe(now), ultimoTs:now.getTime(), movimientos:[mov]};
    S.tracking[rolloIdVal] = t;
    var reinicio = !!S.trackingAnulado[rolloIdVal];
    /* Si el seguimiento anterior se anuló, se reemplaza completo (sin recorrido viejo) */
    var data = reinicio ? Object.assign(camposTracking(t), {movimientos:[mov], anulado:false})
                        : Object.assign(camposTracking(t), {movimientos:arrayUnion(mov)});
    var opts = reinicio ? {} : {merge:true};
    delete S.trackingAnulado[rolloIdVal];
    if(batch) batch.set(ref(COL.tracking, rolloIdVal), data, opts);
    else escribir(setDoc(ref(COL.tracking, rolloIdVal), data, opts));
  }

  /* ============ HISTORIAL ============ */
  function restarDias(n){
    var d=new Date(); d.setDate(d.getDate()-n); return fechaHoy(d);
  }
  function pasaFiltroFecha(r){
    var f=r.fecha||'';
    if(S.filtroFecha==='Hoy') return f===fechaHoy();
    if(S.filtroFecha==='Ayer') return f===restarDias(1);
    if(S.filtroFecha==='7 días') return f>=restarDias(6);
    if(S.filtroFecha==='Rango'){
      if(S.filtroDesde && f<S.filtroDesde) return false;
      if(S.filtroHasta && f>S.filtroHasta) return false;
      return true;
    }
    return true;
  }
  function inspectoresConHistorial(){
    var vistos={}, out=[];
    S.registros.forEach(function(r){ if(r.inspector && !vistos[r.inspector]){ vistos[r.inspector]=true; out.push(r.inspector); } });
    return out.sort(function(a,b){ return a.localeCompare(b); });
  }
  function filteredRegistros(){
    var q=S.filtro.trim().toLowerCase();
    var eMin=parseFloat(S.filtroEspMin), eMax=parseFloat(S.filtroEspMax);
    var aMin=parseFloat(S.filtroAnMin), aMax=parseFloat(S.filtroAnMax);
    return S.registros.filter(function(r){
      if(S.filtroResultado!=='Todos' && r.resultado!==S.filtroResultado) return false;
      if(S.filtroTurno!=='Todos' && (r.turno||'')!==S.filtroTurno) return false;
      if(S.filtroInspector && S.filtroInspector!=='Todos' && r.inspector!==S.filtroInspector) return false;
      if(!isNaN(eMin) && !(parseFloat(r.espesor)>=eMin)) return false;
      if(!isNaN(eMax) && !(parseFloat(r.espesor)<=eMax)) return false;
      if(!isNaN(aMin) && !(parseFloat(r.ancho)>=aMin)) return false;
      if(!isNaN(aMax) && !(parseFloat(r.ancho)<=aMax)) return false;
      if(!pasaFiltroFecha(r)) return false;
      if(!q) return true;
      return [r.rolloId,r.defecto,r.defectoCode,r.familia,r.inspector,r.ubicacion,r.comentario,r.grado,r.familiaSGF]
        .filter(Boolean).join(' ').toLowerCase().indexOf(q)!==-1;
    });
  }

  /* ---------- Resumen del día ---------- */
  function resumenHoyCard(){
    var hoy=fechaHoy();
    var delDia=S.registros.filter(function(r){ return r.fecha===hoy; });
    if(!delDia.length){
      return '<div class="ra-card" style="padding:16px 18px;">' +
        '<div class="ra-label">RESUMEN DE HOY</div>' +
        '<div class="ra-meta" style="margin-top:4px;">Todavía no hay rollos capturados hoy.</div></div>';
    }
    function conteo(arr,res){ return arr.filter(function(r){ return r.resultado===res; }).length; }
    var t1=delDia.filter(function(r){ return r.turno==='1'; });
    var t2=delDia.filter(function(r){ return r.turno==='2'; });
    var defectos={};
    delDia.forEach(function(r){
      if(r.defecto) { var k=r.defectoCode+' '+r.defecto; defectos[k]=(defectos[k]||0)+1; }
    });
    var top=Object.keys(defectos).sort(function(a,b){ return defectos[b]-defectos[a]; }).slice(0,3);
    var topHtml = top.length
      ? top.map(function(k){ return '<div class="ra-summary-line"><span>'+escHtml(k)+'</span><b>'+defectos[k]+'</b></div>'; }).join('')
      : '<div class="ra-meta">Sin defectos registrados hoy.</div>';
    function fila(nombre,arr){
      if(!arr.length) return '';
      return '<div class="ra-summary-line"><span>'+nombre+'</span><b>'+arr.length+
        ' <span style="color:var(--ink-soft);font-weight:400;">('+conteo(arr,'Defecto')+' def · '+conteo(arr,'Scrap')+' scrap)</span></b></div>';
    }
    return '<div class="ra-card" style="padding:16px 18px;">' +
        '<div class="ra-label">RESUMEN DE HOY · '+escHtml(hoy)+'</div>' +
        '<div style="display:flex;align-items:baseline;gap:10px;margin:6px 0 10px;">' +
          '<div style="font-size:30px;font-weight:800;letter-spacing:-.02em;">'+delDia.length+'</div>' +
          '<div class="ra-meta">rollos inspeccionados · '+conteo(delDia,'Conforme')+' aceptados</div>' +
        '</div>' +
        fila('Turno 1 (19:00–06:59)',t1) + fila('Turno 2 (07:00–18:59)',t2) +
        '<div class="ra-label" style="margin-top:14px;">DEFECTOS MÁS FRECUENTES</div>' + topHtml +
      '</div>';
  }

        '<div class="ra-grid">' +

          '<input class="ra-input" inputmode="decimal" id="filtro-esp-max" placeholder="Máx" value="'+escAttr(S.filtroEspMax)+'" style="margin-bottom:0;">' +
        '</div>' +
        '<label class="ra-label" style="margin-top:14px;">ANCHO (MM)</label>' +
        '<div class="ra-grid">' +
          '<input class="ra-input" inputmode="decimal" id="filtro-an-min" placeholder="Mín" value="'+escAttr(S.filtroAnMin)+'" style="margin-bottom:0;">' +
          '<input class="ra-input" inputmode="decimal" id="filtro-an-max" placeholder="Máx" value="'+escAttr(S.filtroAnMax)+'" style="margin-bottom:0;">' +
        '</div>';
    }
    var hayFiltro = S.filtroResultado!=='Todos' || S.filtroFecha!=='Todas' || S.filtroTurno!=='Todos' || S.filtro.trim() ||
      (S.filtroInspector && S.filtroInspector!=='Todos') || S.filtroEspMin || S.filtroEspMax || S.filtroAnMin || S.filtroAnMax;
    var items = regs.length ? regs.map(historyItem).join('') :
      (all.length ? '<div class="ra-empty">Ningún rollo coincide con los filtros.</div>'
                  : '<div class="ra-empty"><div class="big">▤</div>Aún no hay rollos capturados.</div>');
    return resumenHoyCard() +
      '<div class="ra-stats">'+stat(all.length,'TOTAL')+stat(c,'ACEPTADO')+stat(d,'DEFECTO')+'</div>' +
      (S.isAdmin ? '<button class="ra-btn ra-btn-primary ra-btn-block" id="btn-export">Exportar a Excel</button>' : '') +
      '<div class="ra-card" style="padding:14px;">' +
        '<input class="ra-input" id="input-filtro" placeholder="Buscar por rollo, defecto, grado o inspector" value="'+escAttr(S.filtro)+'" autocomplete="off">' +
        '<div class="ra-grid" style="grid-template-columns:repeat(3,1fr);gap:6px;">'+filtros+'</div>' +
        '<label class="ra-label" style="margin-top:14px;">FECHA</label><div class="ra-zchips">'+fechas+'</div>' + rango +
        '<label class="ra-label" style="margin-top:14px;">TURNO</label><div class="ra-zchips">'+turnos+'</div>' +
        filtrosAdmin +
        (hayFiltro ? '<div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;">' +
          '<span class="ra-meta">'+regs.length+' resultado(s)</span>' +
          '<button class="ra-link" id="btn-limpiar-filtros">Limpiar filtros</button></div>' : '') +
      '</div>' + items;
    function stat(n,l){ return '<div class="ra-stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }

  /* Convierte una tarjeta normal de Ajustes en sección desplegable (cerrada de inicio).
     El título sale del primer .ra-h1 de la tarjeta; el estado abierto/cerrado se recuerda mientras dure la sesión. */
  function plegar(clave, sub, html){
    if(!html) return '';
    var m = /^<div class="ra-card"([^>]*)>\s*<div class="ra-h1">([\s\S]*?)<\/div>/.exec(html);
    if(!m || html.slice(-6) !== '</div>') return html;
    S.plegables = S.plegables || {};
    var abierto = !!S.plegables[clave];
    var head = '<button class="ra-fold-head" data-plegar="'+clave+'" aria-expanded="'+abierto+'">' +
        '<span><span class="t">'+m[2]+'</span>'+(sub ? '<span class="m">'+escHtml(sub)+'</span>' : '')+'</span>' +
        '<span class="ra-fold-prev"><span class="chev">▾</span></span>' +
      '</button>';
    return '<div class="ra-card ra-fold'+(abierto?' open':'')+'"'+m[1]+'>' + head + '<div class="ra-fold-body">' +
      html.slice(m[0].length, -6) + '</div></div>';
  }

  function rangoMedidaCard(){

        '<div class="ra-label">ESPESOR (MM)</div>' +

  function estadisticasCard(){
    var head = '<button class="ra-fold-head" id="btn-estadisticas" aria-expanded="'+(S.estadisticas?'true':'false')+'">' +
        '<span><span class="t">Estadísticas</span><span class="m">Tendencias e inspectores</span></span>' +
        '<span class="ra-fold-prev"><span class="chev">▾</span></span>' +
      '</button>';
    if(!S.estadisticas) return '<div class="ra-card ra-fold">'+head+'</div>';
    var periodo = S.statsPeriodo || '7';
    var dias = periodo==='30' ? 30 : periodo==='todo' ? null : 7;
    var corte = dias!=null ? (Date.now() - dias*86400000) : null;
    var regs = S.registros.filter(function(r){ return corte==null || r.ts>=corte; });
    var total = regs.length;
    var conf = regs.filter(function(r){ return r.resultado==='Conforme'; }).length;
    var def = regs.filter(function(r){ return r.resultado==='Defecto'; }).length;
    var scr = regs.filter(function(r){ return r.resultado==='Scrap'; }).length;
    var fr = regs.filter(function(r){ return r.fueraRango; }).length;
    function pct(n){ return total ? Math.round(n/total*100) : 0; }
    var porInspector = {};
    regs.forEach(function(r){
      var k = r.inspector || '—';
      porInspector[k] = porInspector[k] || {total:0, hallazgo:0};
      porInspector[k].total++;
      if(r.resultado==='Defecto' || r.resultado==='Scrap') porInspector[k].hallazgo++;
    });
    var ranking = Object.keys(porInspector).map(function(n){
      var d=porInspector[n]; return {nombre:n, total:d.total, tasa: d.total ? Math.round(d.hallazgo/d.total*100) : 0};
    }).sort(function(a,b){ return b.total-a.total; }).slice(0,8);
    var rankHtml = ranking.length ? ranking.map(function(x){
      return '<div class="ra-summary-line"><span>'+escHtml(x.nombre)+'</span><b>'+x.total+
        ' <span style="color:var(--ink-soft);font-weight:400;">('+x.tasa+'% con hallazgo)</span></b></div>';
    }).join('') : '<div class="ra-meta">Sin datos en este periodo.</div>';
    var defectos={};
    regs.forEach(function(r){ if(r.defecto){ var k=r.defectoCode+' '+r.defecto; defectos[k]=(defectos[k]||0)+1; } });
    var topDef = Object.keys(defectos).sort(function(a,b){ return defectos[b]-defectos[a]; }).slice(0,5);
    var topHtml = topDef.length ? topDef.map(function(k){
      return '<div class="ra-summary-line"><span>'+escHtml(k)+'</span><b>'+defectos[k]+'</b></div>';
    }).join('') : '<div class="ra-meta">Sin defectos en este periodo.</div>';
    var chipsPeriodo = [['7','7 días'],['30','30 días'],['todo','Todo']].map(function(p){
      return '<button class="ra-btn ra-btn-sm '+(periodo===p[0]?'ra-btn-primary':'ra-btn-outline')+'" data-stats-periodo="'+p[0]+'" style="font-size:12px;margin-bottom:0;">'+p[1]+'</button>';
    }).join('');
    var hayRango = S.catalogs.rangoEspesorMin || S.catalogs.rangoEspesorMax || S.catalogs.rangoAnchoMin || S.catalogs.rangoAnchoMax;
    function stat(n,l){ return '<div class="ra-stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }
    return '<div class="ra-card ra-fold open">' + head +
        '<div class="ra-fold-body">' +
          '<div class="ra-grid" style="grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;">'+chipsPeriodo+'</div>' +
          '<div class="ra-stats" style="margin-top:14px;">'+stat(total,'TOTAL')+stat(pct(conf)+'%','ACEPTADO')+stat(pct(def+scr)+'%','CON HALLAZGO')+'</div>' +
          (hayRango ? '<div class="ra-meta" style="margin-top:8px;">'+fr+' de '+total+' rollos ('+pct(fr)+'%) tuvieron una medida fuera del rango esperado.</div>' : '') +
          '<div class="ra-label" style="margin-top:14px;">POR INSPECTOR</div>' + rankHtml +
          '<div class="ra-label" style="margin-top:14px;">DEFECTOS MÁS FRECUENTES</div>' + topHtml +
        '</div>' +
      '</div>';
  }

  /* Borrado del reporte de movimientos (solo el administrador principal) */
  function borrarAuditoria(ids, todo){
    if(!soyPrincipal() || !ids.length) return;
    var ops = ids.map(function(id){ return {tipo:'delete', ref:ref(COL.auditoria, id)}; });
    S.auditoria = S.auditoria.filter(function(a){ return ids.indexOf(a._id)<0; });
    S.repSel = null; render();
    commitEnLotes(ops).then(function(){
      if(todo) auditar('eliminacion','','Reporte de movimientos borrado ('+ids.length+' registros)','');
      toast(todo ? 'Reporte de movimientos borrado' : ids.length+' movimiento(s) eliminado(s)');
    }).catch(errFirebase);
  }

  /* ============ FOTOS ============ */
  function compressImage(file){
    function reducir(img, maxW, q){
      var scale=Math.min(1,maxW/img.width);
      var c=document.createElement('canvas');
      c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      return c.toDataURL('image/jpeg',q);
    }
    return new Promise(function(resolve,reject){
      var reader=new FileReader();
      reader.onload=function(e){
        var img=new Image();
        img.onload=function(){
          /* Cada foto va en su propio documento de Firestore (límite 1 MB) */
          var d=reducir(img,900,0.55);
          if(d.length>700000) d=reducir(img,700,0.45);
          if(d.length>700000) d=reducir(img,520,0.4);
          resolve(d);
        };
        img.onerror=reject; img.src=e.target.result;
      };
      reader.onerror=reject; reader.readAsDataURL(file);
    });
  }

  var PIXEL = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
  /* Fotos de un registro: nuevas (en la colección fotos) o antiguas (incrustadas) */
  function fotosDe(r){
    return (r.fotoIds||[]).map(function(id){ return {id:id}; })
      .concat((r.fotos||[]).map(function(d){ return {data:d}; }));
  }
  var fotosEnCamino = {};
  function cargarFoto(id){
    if(S.fotoCache[id]) return Promise.resolve(S.fotoCache[id]);
    if(fotosEnCamino[id]) return fotosEnCamino[id];
    fotosEnCamino[id] = getDoc(ref(COL.fotos, id)).then(function(s){
      delete fotosEnCamino[id];
      if(s.exists()) S.fotoCache[id] = s.data().data;
      return S.fotoCache[id] || null;
    }).catch(function(){ delete fotosEnCamino[id]; return null; });
    return fotosEnCamino[id];
  }
  /* Las fotos se descargan solo cuando se muestran y se guardan en memoria */
  function cargarFotosPendientes(){
    root.querySelectorAll('img[data-foto-id]').forEach(function(img){
      var id = img.getAttribute('data-foto-id');
      if(S.fotoCache[id]) return;
      cargarFoto(id).then(function(src){
        if(!src) return;
        root.querySelectorAll('img[data-foto-id="'+id+'"]').forEach(function(n){ n.src = src; });
      });

  function loadJsQR(){ return window.jsQR ? Promise.resolve() : loadScript("https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"); }
  function loadSheetJS(){ return window.XLSX ? Promise.resolve() : loadScript("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"); }

  function openScanner(){
    if(isInsecureContext()){ toast('La cámara requiere https — captura el ID manualmente'); return; }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('Este navegador no permite usar la cámara'); return; }
    loadJsQR().then(function(){
      var modal=el('<div class="ra-video-modal"><button class="close-scan" aria-label="Cerrar">✕</button><video autoplay playsinline muted></video><div class="ra-scan-frame"></div><div class="hint">Apunta al código QR del rollo</div></div>');
      document.body.appendChild(modal);
      var video=modal.querySelector('video');
      var canvas=document.createElement('canvas');
      var ctx=canvas.getContext('2d',{willReadFrequently:true});
      var stream=null, stop=false, torchOn=false;
      navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}}).then(function(s){
        stream=s; video.srcObject=s; video.play().catch(function(){});
        var track=s.getVideoTracks()[0];
        var caps=(track && track.getCapabilities)?(track.getCapabilities()||{}):{};
        if(caps.torch){
          var tb=el('<button class="torch-btn" aria-label="Linterna">☀</button>');
          modal.appendChild(tb);
          tb.addEventListener('click',function(){
            torchOn=!torchOn;
            track.applyConstraints({advanced:[{torch:torchOn}]}).catch(function(){});
            tb.classList.toggle('on',torchOn);
          });
        }
        requestAnimationFrame(tick);
      }).catch(function(){ toast('No se pudo abrir la cámara — revisa los permisos'); cerrar(); });

      function tick(){
        if(stop) return;
        if(video.readyState===video.HAVE_ENOUGH_DATA && video.videoWidth){
          var scale=Math.min(1,480/video.videoWidth);
          canvas.width=Math.max(1,Math.round(video.videoWidth*scale));
          canvas.height=Math.max(1,Math.round(video.videoHeight*scale));
          ctx.drawImage(video,0,0,canvas.width,canvas.height);
          try{
            var d=ctx.getImageData(0,0,canvas.width,canvas.height);
            var code=window.jsQR(d.data,d.width,d.height,{inversionAttempts:'attemptBoth'});
            if(code && code.data && code.data.trim()){
              aplicarIdEscaneado(code.data);
              if(navigator.vibrate) navigator.vibrate(60);
              cerrar(); render(); toast(rolloId());
              return;
            }
          }catch(e){}
        }
        requestAnimationFrame(tick);
      }
      function cerrar(){
        stop=true;
        if(stream) stream.getTracks().forEach(function(t){ t.stop(); });
        if(modal.parentNode) modal.remove();
      }
      modal.querySelector('.close-scan').addEventListener('click',cerrar);
    }).catch(function(){ toast('No se pudo cargar el lector de QR — revisa tu conexión'); });
  }

  /* ============ IMPORTAR GRADOS ============ */
  function importarGrados(file){
    var nombre = file.name.toLowerCase();
    if(nombre.slice(-4)==='.csv'){
      var reader=new FileReader();
      reader.onload=function(e){ procesarFilasGrados(parseCSV(e.target.result)); };
      reader.readAsText(file);
      return;
    }
    loadSheetJS().then(function(){
      var reader=new FileReader();
      reader.onload=function(e){
        try{
          var wb = window.XLSX.read(new Uint8Array(e.target.result), {type:'array'});
          var ws = wb.Sheets[wb.SheetNames[0]];
          var filas = window.XLSX.utils.sheet_to_json(ws, {header:1, blankrows:false});
          procesarFilasGrados(filas);
        }catch(err){ toast('No se pudo leer el archivo'); }
      };
      reader.readAsArrayBuffer(file);
    }).catch(function(){ toast('No se pudo cargar el lector de Excel'); });
  }

  function parseCSV(texto){
    return texto.split(/\r?\n/).filter(function(l){ return l.trim(); })
      .map(function(l){ return l.split(/[;,\t]/).map(function(c){ return c.trim().replace(/^"|"$/g,''); }); });
  }

  function procesarFilasGrados(filas){
    if(!filas || !filas.length){ toast('El archivo está vacío'); return; }
    var mapa = {};
    (S.catalogs.grados||[]).forEach(function(g){ mapa[g.grado] = {sgf:g.sgf||'', familia:g.familia||''}; });
    var añadidos = 0;
    filas.forEach(function(f, i){
      if(!f || f.length < 2) return;
      var grado = String(f[0]==null?'':f[0]).trim();
      var sgf = String(f[1]==null?'':f[1]).trim();
      var familia = f.length > 2 ? String(f[2]==null?'':f[2]).trim() : '';
      if(!grado) return;
      if(i===0 && /grado|planch/i.test(grado)) return; // encabezado
      if(mapa[grado] === undefined) añadidos++;
      mapa[grado] = {sgf:sgf, familia:familia};
    });
    S.catalogs.grados = Object.keys(mapa).sort().map(function(g){ return {grado:g, sgf:mapa[g].sgf, familia:mapa[g].familia}; });
    try{ set('catalogs', S.catalogs); }catch(e){ toast('No se pudo guardar el catálogo'); return; }
    auditar('edicion','', 'Importación de catálogo de grados: '+S.catalogs.grados.length+' registros', '');
    toast(añadidos+' grados nuevos · '+S.catalogs.grados.length+' en total');
    render();
  }

  /* Miniatura de la foto para que el Excel no pese de más */
  function miniFoto(dataURL, maxW){
    return new Promise(function(resolve){
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, (maxW||360)/img.width);
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width*scale));
        c.height = Math.max(1, Math.round(img.height*scale));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve({data:c.toDataURL('image/jpeg', 0.6), w:c.width, h:c.height});
      };
      img.onerror = function(){ resolve(null); };
      img.src = dataURL;
    });
  }

  function hojaDeFilas(wb, nombre, filas){
    var ws = wb.addWorksheet(nombre);
    if(!filas.length) return ws;
    var cols = Object.keys(filas[0]);
    ws.columns = cols.map(function(k){ return {header:k, key:k, width:Math.max(12, Math.min(46, k.length+6))}; });
    filas.forEach(function(f){ ws.addRow(f); });
    ws.getRow(1).font = {bold:true};
    ws.views = [{state:'frozen', ySplit:1}];
    ws.autoFilter = {from:{row:1, column:1}, to:{row:1, column:cols.length}};
    return ws;
  }

          'Fotos (cantidad)':fotosDe(r).length, 'Comentario':r.comentario||''
        };
      });

            'Cambios':ed.cambios,'Motivo':ed.motivo});
        });
      });

      hojaDeFilas(wb, 'AUDITORIA', S.auditoria.map(function(a){
        return {'Fecha':a.fecha,'Hora':a.hora,'Turno':a.turno||'','Usuario':a.usuario,'Tipo':a.tipo,'ID Rollo':a.rolloId,'Detalle':a.detalle,'Motivo':a.motivo};
      }));

      var cat=[]; FAMILIAS.forEach(function(f){ f.defectos.forEach(function(d){ cat.push({'Código':d.code,'Familia':f.name,'Defecto':d.name}); }); });
      hojaDeFilas(wb, 'CATALOGO_DEFECTOS', cat);
      hojaDeFilas(wb, 'CATALOGO_GRADOS', (S.catalogs.grados||[]).map(function(g){
        return {'Grado Planchón':g.grado,'SGF':g.sgf||'','Familia':g.familia||''};
      }));

      /* Hoja de fotos: una fila por inspección; si tiene varias fotos se acomodan
         hacia la derecha (Foto 1, Foto 2, Foto 3…) */
      function hojaFotos(){
        if(!incluirFotos || !conFoto.length) return Promise.resolve();
        var grupos = [], porReg = {};
        conFoto.forEach(function(item){
          var k = item.reg.id;
          if(!porReg[k]){ porReg[k] = {reg:item.reg, fotos:[]}; grupos.push(porReg[k]); }
          porReg[k].fotos.push(item.foto);
        });
        var maxFotos = grupos.reduce(function(m,g){ return Math.max(m, g.fotos.length); }, 1);
        var ws = wb.addWorksheet('FOTOS');
        var cols = [
          {header:'ID Rollo', width:20},{header:'Fecha', width:12},{header:'Hora', width:8},
          {header:'Turno', width:7},{header:'Inspector', width:20},{header:'Resultado', width:26},
          {header:'Defecto', width:26},{header:'Comentario', width:30}
        ];
        var COL_FOTO = cols.length;
        for(var c=1; c<=maxFotos; c++) cols.push({header:'Foto '+c, width:34});
        ws.columns = cols;
        ws.getRow(1).font = {bold:true};
        ws.views = [{state:'frozen', ySplit:1, xSplit:1}];
        var hechas = 0;
        var gi = 0;
        function siguienteGrupo(){
          if(gi >= grupos.length) return Promise.resolve();
          var g = grupos[gi], r = g.reg;
          var fila = ws.addRow({});
          var n = fila.number;
          ws.getCell('A'+n).value = r.rolloId||'';
          ws.getCell('B'+n).value = r.fecha||'';
          ws.getCell('C'+n).value = r.hora||'';
          ws.getCell('D'+n).value = r.turno||'';
          ws.getCell('E'+n).value = r.inspector||'';
          ws.getCell('F'+n).value = etqResLarga(r.resultado);
          ws.getCell('G'+n).value = r.defecto ? (r.defectoCode+' '+r.defecto) : '';
          ws.getCell('H'+n).value = r.comentario||'';
          ['A','B','C','D','E','F','G','H'].forEach(function(l){ ws.getCell(l+n).alignment = {wrapText:true, vertical:'top'}; });
          var alto = 110;
          fila.height = alto * 0.78;
          var k = 0;
          function siguienteFoto(){
            if(k >= g.fotos.length) return Promise.resolve();
            var foto = g.fotos[k];
            hechas++;
            if(hechas % 10 === 1) toast('Agregando fotos… '+hechas+' de '+conFoto.length);
            var p = foto.data ? Promise.resolve(foto.data) : cargarFoto(foto.id);
            return p.then(function(src){ return src ? miniFoto(src, 360) : null; }).then(function(mini){
              var col = COL_FOTO + k;
              if(mini){
                var h = alto, w = Math.round(h * (mini.w/mini.h));
                if(w > 230){ w = 230; h = Math.round(w * (mini.h/mini.w)); }
                var imgId = wb.addImage({base64: mini.data.split(',')[1], extension:'jpeg'});
                ws.addImage(imgId, {tl:{col:col+0.05, row:n-1+0.08}, ext:{width:w, height:h}});
              } else {
                ws.getCell(n, col+1).value = 'Foto no disponible sin conexión';
              }
              k++;
              return siguienteFoto();
            });
          }
          return siguienteFoto().then(function(){ gi++; return siguienteGrupo(); });
        }
        return siguienteGrupo();
      }

      return hojaFotos().then(function(){
        return wb.xlsx.writeBuffer();
      }).then(function(buf){
        var blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'inspeccion_rollos_'+fechaHoy()+'.xlsx';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
        toast('Excel generado'+(incluirFotos&&conFoto.length?' con '+conFoto.length+' foto(s)':''));
      });
    }).catch(function(e){ console.error(e); toast('No se pudo generar el Excel'); });
  }

  function descargarJSON(data, nombre){

  /* Importa a Firebase un respaldo JSON (de la versión con localStorage o de esta).
     Usa los mismos IDs: importar dos veces el mismo archivo no duplica nada. */
  function restoreBackup(file){
    if(!S.isAdmin) return;
    var reader=new FileReader();
    reader.onload=function(e){ importarDatos(safeParse(e.target.result,null)); };
    reader.readAsText(file);
  }
  function importarDatos(d){
      if(!S.isAdmin) return;
      if(!d || !Array.isArray(d.registros)){ toast('El archivo no es un respaldo válido'); return; }
      if(!navigator.onLine){ toast('Necesitas conexión para importar'); return; }
      var tracking = d.tracking||{}, master = d.rollosMaster||{}, audit = d.auditoria||[];
      var nFotos = 0;
      d.registros.forEach(function(r){ nFotos += (r.fotos||[]).length; });
      if(!confirm('Se importarán a Firebase:\n· '+d.registros.length+' registros ('+nFotos+' fotos)\n· '+Object.keys(tracking).length+' rollos en seguimiento\n· '+audit.length+' movimientos de auditoría\n\nLo que ya exista con el mismo ID se actualiza, no se duplica. ¿Continuar?')) return;
      var conCatalogos = !!d.catalogs && confirm('¿Reemplazar también los catálogos (grados, zonas, medios, defectos, enrolladores) y las variaciones por los del respaldo?\n\nAceptar = reemplazar · Cancelar = conservar los actuales');
      var ops=[], uid=S.perfil.uid;
      d.registros.forEach(function(r0){
        var r = copia(r0);
        if(!r.id) r.id = 'r'+(r.ts||Date.now())+Math.random().toString(36).slice(2,7);
        var fotoIds = (r.fotoIds||[]).slice();
        (r.fotos||[]).forEach(function(f, i){
          if(typeof f!=='string' || f.length>1000000) return;
          var fid = docId(r.id)+'_'+i;
          fotoIds.push(fid);
          ops.push({ref:ref(COL.fotos,fid), data:{registroId:r.id, rolloId:r.rolloId||'', data:f, ts:r.ts||0, uid:uid, importado:true}});
        });
        delete r.fotos;
        r.fotoIds = fotoIds;
        r.ediciones = r.ediciones||[];
        r.inspectorUid = r.inspectorUid||'';
        ops.push({ref:ref(COL.registros,r.id), data:r});
      });
      Object.keys(tracking).forEach(function(k){
        var t = copia(tracking[k]); t.rolloId = t.rolloId||k; t.movimientos = t.movimientos||[];
        ops.push({ref:ref(COL.tracking,k), data:t});
      });
      Object.keys(master).forEach(function(k){
        var m = copia(master[k]); m.id = m.id||k;
        ops.push({ref:ref(COL.master,k), data:m});
      });
      audit.forEach(function(a0){
        var a = copia(a0);
        if(!a.id) a.id = 'a'+(a.ts||Date.now())+Math.random().toString(36).slice(2,6);
        a.uid = a.uid||'';
        ops.push({ref:ref(COL.auditoria,a.id), data:a});
      });
      if(conCatalogos){
        ops.push({ref:ref(COL.config,'catalogos'), data:sinMarca(migrarGrados(copia(d.catalogs)))});
        if(d.variaciones) ops.push({ref:ref(COL.config,'variaciones'), data:{mapa:copia(d.variaciones)}});
      }
      toast('Importando…');
      commitEnLotes(ops, function(i,n){ toast('Importando… lote '+i+' de '+n); }).then(function(){
        auditar('edicion','','Importación de respaldo: '+d.registros.length+' registros, '+Object.keys(tracking).length+' rollos'+(conCatalogos?' y catálogos':''),'');
        var nombres = (d.usuarios||[]).map(function(u){ return u.nombre; }).filter(Boolean);
        alert('Importación terminada: '+ops.length+' documentos escritos.' +
          (nombres.length ? '\n\nLas cuentas no se importan (las contraseñas no viajan en el respaldo). Registra en «Inspectores» a quien siga activo:\n· '+nombres.join('\n· ') : ''));
      }).catch(function(err){
        console.error(err);
        alert('La importación se detuvo: '+(err && err.message ? err.message : err)+'\nPuedes volver a importar el mismo archivo; lo ya subido no se duplica.');
      });
  }

  /* ============ CUENTAS (solo administrador) ============ */
  var appAltas = null, authAltas = null;
  /* Segunda instancia de Firebase: crear cuentas ahí no cierra la sesión del admin */
  function authSecundaria(){
    if(!authAltas){
      appAltas = initializeApp(firebaseConfig, 'altas');
      authAltas = initializeAuth(appAltas, {persistence: inMemoryPersistence});
    }
    return authAltas;
  }
  function crearCuentaAuth(usuario, pin, n){
    var sa = authSecundaria(), email = correoDe(usuario, n);
    return createUserWithEmailAndPassword(sa, email, pin).then(function(cred){
      var uid = cred.user.uid;
      return signOut(sa).then(function(){ return {uid:uid, email:email, version:n}; });
    }, function(e){
      if(e && e.code==='auth/email-already-in-use' && n<20) return crearCuentaAuth(usuario, pin, n ? n+1 : 2);
      throw e;
    });
  }
  function mensajeAlta(e){
    var c=(e&&e.code)||'';
    if(c==='app/existe') return 'Ese usuario ya existe';
    if(c==='auth/network-request-failed') return 'Sin conexión: dar de alta requiere señal';
    if(c==='auth/weak-password') return 'Firebase rechazó la contraseña: usa al menos '+PASS_MIN+' caracteres';
    if(c==='auth/too-many-requests') return 'Demasiadas altas seguidas. Espera unos minutos.';
    if(c==='permission-denied') return 'Sin permiso para dar de alta usuarios';
    return 'No se pudo crear la cuenta'+(c?' ('+c+')':'');
  }
  /* Usuario interno a partir del nombre (juanperez); si ya existe se agrega un número */
  function usuarioDesdeNombre(nombre){
    var base = normUsuario(nombre).replace(/[^a-z0-9_-]/g,'').slice(0,16);
    if(base.length<3) base = (base+'admin').slice(0,16);
    return base;
  }
  function usuarioLibre(base, n){
    var u = n ? base+n : base;
    return getDoc(ref(COL.alias, u)).then(function(s){
      if(!s.exists()) return u;
      if(n>=30) throw {code:'app/existe'};
      return usuarioLibre(base, n ? n+1 : 2);
    });
  }

  function cambiarActivo(u, activo){

  /* Eliminar definitivamente al segundo administrador: se borra su perfil (y los de
     restablecimientos anteriores) y su usuario queda libre. Sus registros se conservan. */
  function quitarAdmin(u){
    var b = writeBatch(db);
    S.usuarios.filter(function(x){ return x.uid===u.uid || (x.usuario===u.usuario && x.rol==='admin' && x.uid!==(S.perfil&&S.perfil.uid)); })
      .forEach(function(x){ b.delete(ref(COL.usuarios, x.uid)); });
    b.delete(ref(COL.alias, u.usuario));
    escribir(b.commit());
    S.usuarios = S.usuarios.filter(function(x){ return !(x.uid===u.uid || (x.usuario===u.usuario && x.rol==='admin' && x.uid!==(S.perfil&&S.perfil.uid))); });
    quitarPerfil(u.usuario);
    sincronizarPublicoAdmins();
    auditar('eliminacion','','Administrador eliminado: '+u.nombre+' ('+u.usuario+')','');
    toast('Administrador eliminado');
  }

    function elegirTema(v){
      if(!S.isAdmin) return;
      v = normTema(v);
      if(esTemporada(v.tema)){
        /* Estilo elegido a mano: queda fijo y se apagan las temporadas automáticas */
        if(!temaCfg.auto && temaCfg.tema===v.tema) return;
        guardarCfgTema({tema:v.tema, auto:false}, 'Estilo fijo: '+TEMAS[v.tema].nombre+' (automáticas apagadas)');
      } else {
        var cfg = {tema:v.tema, color:v.color, auto:temaCfg.auto && !esTemporada(temaCfg.tema) ? true : temaCfg.auto};
        if(mismaCfg(normCfg(cfg), temaCfg)) return;
        var nom = v.tema==='personal' ? 'Color '+v.color : TEMAS[v.tema].nombre;
        guardarCfgTema(cfg, temaCfg.auto && temporadaDe(new Date()) ? 'Color base: '+nom+' (se verá cuando termine la temporada)' : 'Apariencia: '+nom);
      }
    }

  /* ============ GUARDAR ============ */
  function guardarRegistro(){
    if(!idValido()){ toast('El ID debe llevar exactamente '+ID_MID_LEN+' dígitos'); S.step='id'; render(); return; }
    var id=rolloId();
    var now=new Date();
    var master=S.rollosMaster[id]||{};
    var regId='r'+now.getTime()+Math.random().toString(36).slice(2,7);
    var batch=writeBatch(db);
    var fotoIds=S.fotos.map(function(f,i){
      var fid=regId+'_'+i;
      S.fotoCache[fid]=f;
      batch.set(ref(COL.fotos,fid), {registroId:regId, rolloId:id, data:f, ts:now.getTime(), uid:S.perfil.uid});
      return fid;
    });
    var reg={
      id:regId,
      ts:now.getTime(), fecha:fechaHoy(now), hora:horaAhora(now), turno:turnoDe(now), rolloId:id,
      resultado:S.resultado||'Conforme',
      familia:S.familia?S.familia.name:'',
      defectoCode:S.defecto?S.defecto.code:'',
      defecto:S.defecto?S.defecto.name:'',
      variacion:S.variacion||'', ubicacion:S.ubicacion||'', severidad:S.severidad||'',
      inspector:usuarioActual(), inspectorUid:S.perfil.uid, inspectorUsuario:S.perfil.usuario||'',
      grado:master.grado||S.rolloData.grado||'',
      familiaSGF:master.familiaSGF||S.rolloData.familiaSGF||'',
      familiaDesc:master.familiaDesc||S.rolloData.familiaDesc||'',
      espesor:master.espesor||S.rolloData.espesor||'',
      ancho:master.ancho||S.rolloData.ancho||'',
      peso:master.peso||S.rolloData.peso||'',
      fechaProduccion:master.fecha||S.rolloData.fecha||'',
      enrollador:master.enrollador||S.rolloData.enrollador||'',
      fotoIds:fotoIds, comentario:S.comentario||'', ediciones:[],
      fueraRango: fueraDeRango(master.espesor||S.rolloData.espesor||'', master.ancho||S.rolloData.ancho||'').length>0
    };
    batch.set(ref(COL.registros,regId), reg);
    S.registros.unshift(reg);
    /* Datos del rollo: solo se completan los que falten, nunca se sobrescriben */
    var nuevos={};
    ['grado','familiaSGF','familiaDesc','espesor','ancho','peso','fecha','enrollador'].forEach(function(k){
      if(!master[k] && S.rolloData[k]) nuevos[k]=S.rolloData[k];
    });
    if(Object.keys(nuevos).length){
      nuevos.id=id;
      S.rollosMaster[id]=Object.assign({}, master, nuevos);
      batch.set(ref(COL.master,id), nuevos, {merge:true});
    }
    iniciarTracking(id, batch);
    escribir(batch.commit());
    auditar('creacion', id, 'Inspección registrada: '+etqResLarga(reg.resultado)+(reg.defecto?' · '+reg.defectoCode+' '+reg.defecto:''), '');
    toast(S.online ? 'Rollo guardado en '+ZONA_ORIGEN : 'Guardado sin señal · se subirá al reconectar');
    resetCaptureFlow();
    render();
  }

  function guardarEdicion(){
    var r=S.editReg;
    borradorEdicion();
    var D=S.editDraft||{};
    var motivo=(D.motivo||'').trim();

    var nuevoRes=D.resultado||r.resultado;
    var defCode=D.defectoCode||'';
    var def=defCode?buscarDefecto(defCode):null;
    if(nuevoRes!=='Conforme' && !def){ S.editErr='Para '+nuevoRes+' debes elegir un defecto.'; render(); return; }
    if(nuevoRes==='Conforme') def=null;
    var fam=def?familiaDeDefecto(def.code):null;
    var nuevo={
      resultado:nuevoRes,
      familia:fam?fam.name:'',
      defectoCode:def?def.code:'',
      defecto:def?def.name:'',
      variacion:def ? (D.variacion||'') : '',
      ubicacion:def ? (D.ubicacion||'') : '',
      severidad:def ? (D.severidad||'') : '',
      comentario:D.comentario!==undefined ? D.comentario : (r.comentario||'')
    };
    var etiquetas={resultado:'Resultado',familia:'Familia',defecto:'Defecto',variacion:'Variación',
      ubicacion:'Ubicación',severidad:'Severidad',comentario:'Comentario'};
    var cambios=[];
    Object.keys(etiquetas).forEach(function(k){
      var antes=r[k]||'', desp=nuevo[k]||'';
      if(k==='resultado'){ antes=etqResLarga(antes); desp=etqResLarga(desp); }
      if(antes!==desp) cambios.push(etiquetas[k]+': "'+(antes||'—')+'" → "'+(desp||'—')+'"');
    });
    var nNuevas=S.editFotos.length, quitar=S.editQuitar.slice();
    var cambiosDatos=cambios.length;
    if(nNuevas) cambios.push('Fotos agregadas: '+nNuevas);
    if(quitar.length) cambios.push('Fotos quitadas: '+quitar.length);
    if(!cambios.length){ S.editErr='No cambiaste ningún campo ni agregaste fotos.'; render(); return; }
    if((cambiosDatos || quitar.length) && motivo.length<10){
      S.editErr='Describe el motivo del cambio (mínimo 10 caracteres).'; render(); sacudir('#edit-motivo'); return;
    }
    if(!motivo) motivo='Se agregaron fotos';

    var now=new Date();
    var ed={ts:now.getTime(), fecha:fechaHoy(now), hora:horaAhora(now), turno:turnoDe(now),
      usuario:usuarioActual(), motivo:motivo, cambios:cambios.join(' | ')};
    var batch=writeBatch(db);
    var nuevosIds=S.editFotos.map(function(d,i){
      var fid=r.id+'_'+now.getTime()+'_'+i;
      S.fotoCache[fid]=d;
      batch.set(ref(COL.fotos,fid), {registroId:r.id, rolloId:r.rolloId, data:d, ts:now.getTime(), uid:S.perfil.uid});
      return fid;
    });
    quitar.forEach(function(fid){ batch.delete(ref(COL.fotos,fid)); delete S.fotoCache[fid]; });
    var datos=Object.assign({}, nuevo, {ediciones:arrayUnion(ed)});
    if(nNuevas || quitar.length){
      var ids=(r.fotoIds||[]).filter(function(fid){ return quitar.indexOf(fid)===-1; }).concat(nuevosIds);
      datos.fotoIds=ids; r.fotoIds=ids;
    }
    batch.update(ref(COL.registros,r.id), datos);
    escribir(batch.commit());
    r.ediciones=r.ediciones||[];
    r.ediciones.push(ed);
    Object.keys(nuevo).forEach(function(k){ r[k]=nuevo[k]; });
    auditar('edicion', r.rolloId, cambios.join(' | '), motivo);
    cerrarEdicion();
    toast(cambiosDatos ? 'Cambios guardados' : (nNuevas ? nNuevas+' foto(s) agregada(s)' : 'Cambios guardados'));
    render();
  }

  /* ============ DEMO Y BORRADO (solo administrador) ============ */
  function cargarDemo(){
    var base=Date.now(), batch=writeBatch(db);
    var demos=[
      {rolloId:'4A695767PM400',resultado:'Conforme',grado:'C14MC4',familiaSGF:'6',familiaDesc:'Grados comerciales Medios'},
      {rolloId:'4A695768PM400',resultado:'Defecto',familia:'Aspecto físico',defectoCode:'593',defecto:'Devanado',variacion:'Últimas vueltas flojas',ubicacion:'DIC',severidad:'Leve',grado:'T05CR8',familiaSGF:'41',familiaDesc:'> X70'},
      {rolloId:'4A695769PM400',resultado:'Defecto',familia:'Defectos superficiales',defectoCode:'19',defecto:'Rayas',ubicacion:'Centro',severidad:'Moderado',grado:'A06CR5',familiaSGF:'31',familiaDesc:'AHSS'},
      {rolloId:'4A695770PM400',resultado:'Scrap',familia:'Orilla',defectoCode:'765',defecto:'Orilla trozada',ubicacion:'Todo el rollo',comentario:'Rollo retenido en patio',grado:'SIAL20',familiaSGF:'27',familiaDesc:'Eléctricos'}
    ];
    demos.forEach(function(d,i){
      var t=new Date(base-(demos.length-i)*3600000);
      var reg=Object.assign({
        id:'demo'+t.getTime()+i, ts:t.getTime(), fecha:fechaHoy(t), hora:horaAhora(t), turno:turnoDe(t),
        inspector:i%2?'Ana Castillo':'Luis Ramírez', inspectorUid:'', inspectorUsuario:'',
        espesor:'2.50',ancho:'1200',peso:'18500',enrollador:'Enrollador 2',
        fechaProduccion:'',variacion:'',severidad:'',familia:'',defectoCode:'',defecto:'',
        comentario:'',fotoIds:[],ediciones:[],grado:'',familiaSGF:'',familiaDesc:''
      },d);
      batch.set(ref(COL.registros,reg.id), reg);
      if(!S.tracking[reg.rolloId]){
        var mov={zona:ZONA_ORIGEN,medio:'',usuario:reg.inspector,fecha:reg.fecha,hora:reg.hora,turno:reg.turno,ts:t.getTime(),nota:'Alta por inspección'};
        var tr={rolloId:reg.rolloId, zona:ZONA_ORIGEN, ultimoUsuario:reg.inspector, ultimaFecha:reg.fecha, ultimaHora:reg.hora,
          ultimoTurno:reg.turno, ultimoTs:t.getTime(), movimientos:[mov]};
        if(reg.rolloId==='4A695768PM400'){
          var t2=new Date(base-1800000);
          var mov2={zona:'Cooling Bay',medio:'MCA',usuario:'Ana Castillo',fecha:fechaHoy(t2),hora:horaAhora(t2),turno:turnoDe(t2),ts:t2.getTime(),nota:'Enfriamiento programado'};
          tr.movimientos.push(mov2);
          tr.zona='Cooling Bay'; tr.ultimoUsuario='Ana Castillo'; tr.ultimaFecha=mov2.fecha; tr.ultimaHora=mov2.hora; tr.ultimoTurno=mov2.turno; tr.ultimoTs=mov2.ts;
        }
        batch.set(ref(COL.tracking,reg.rolloId), tr);
      }
    });
    escribir(batch.commit().then(function(){ toast('Datos de ejemplo cargados'); }));
    auditar('creacion','','Carga de datos de ejemplo (4 rollos)','');
  }

  function borrarTodo(){
    toast('Borrando…');
    var cols=[COL.registros, COL.fotos, COL.tracking, COL.master, COL.auditoria];
    Promise.all(cols.map(function(c){ return getDocs(collection(db,c)); })).then(function(res){
      var ops=[];
      res.forEach(function(qs){ qs.docs.forEach(function(d){ ops.push({tipo:'delete', ref:d.ref}); }); });
      ops.push({ref:ref(COL.config,'catalogos'), data:sinMarca(migrarGrados({}))});
      ops.push({ref:ref(COL.config,'variaciones'), data:{mapa:copia(DEFAULT_VARIACIONES)}});
      return commitEnLotes(ops, function(i,n){ toast('Borrando… lote '+i+' de '+n); }).then(function(){ return ops.length; });
    }).then(function(n){
      S.fotoCache={};
      auditar('eliminacion','','Borrado total de la base ('+n+' documentos)','');
      toast('Base borrada'); render();
    }).catch(function(e){ console.error(e); toast('No se pudo borrar todo — revisa la conexión'); });
  }

  init();
})();
</script>
