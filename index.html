<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0E1114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Inspección de rollos · Ternium</title>
<style>
  :root{
    --bg:#F1F2F4; --surface:#FFFFFF; --ink:#0E1114; --ink-mid:#3C444E; --ink-soft:#6B7481;
    --line:#DDE0E5; --line-strong:#C3C8D0; --brand:#0E1114;
    --conforme:#1F7A4C; --defecto:#B26A12; --scrap:#B32D25; --info:#2C5B7C;
    --radius:4px; --radius-lg:6px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);}
  body{font-family:"Helvetica Neue",Helvetica,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    color:var(--ink);overscroll-behavior-y:contain;-webkit-text-size-adjust:100%;}
  #rollo-app{min-height:100%;padding:0 0 96px 0;}

  .ra-logo{display:block;height:26px;width:auto;}
  .ra-logo-lg{height:52px;}

  .ra-header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;
    padding:calc(13px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .ra-header .sub{font-size:10.5px;color:#98A1AC;margin-top:6px;letter-spacing:.1em;}
  .ra-user{background:none;border:1px solid rgba(255,255,255,.3);border-radius:2px;padding:8px 12px;
    font-size:12.5px;font-weight:600;color:#fff;cursor:pointer;max-width:40vw;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;font-family:inherit;}
  .ra-steps{display:flex;background:var(--brand);padding:0 16px;}
  .ra-step-dot{height:3px;flex:1;background:rgba(255,255,255,.18);}
  .ra-step-dot.active{background:#fff;}
  .ra-step-dot.done{background:rgba(255,255,255,.55);}

  .ra-body{padding:18px 16px;max-width:540px;margin:0 auto;animation:raEnter .22s ease;}
  .ra-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px 18px;margin-bottom:14px;}
  .ra-h1{font-size:21px;font-weight:700;margin:0 0 5px;letter-spacing:-.01em;}
  .ra-h2{font-size:13.5px;color:var(--ink-soft);margin:0 0 16px;line-height:1.5;}
  .ra-label{font-size:11px;font-weight:700;color:var(--ink-soft);margin:0 0 7px;display:block;letter-spacing:.06em;}
  .ra-input{width:100%;padding:14px;font-size:16px;border-radius:var(--radius);border:1px solid var(--line-strong);
    background:#fff;color:var(--ink);margin-bottom:12px;font-family:inherit;}
  .ra-input:focus{outline:none;border-color:var(--ink);}
  .ra-pin-input{text-align:center;font-size:24px;letter-spacing:10px;font-weight:700;}
  .ra-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}

  .ra-idbox{display:flex;align-items:stretch;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;margin-bottom:9px;background:#fff;}
  .ra-idbox:focus-within{border-color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink);}
  .ra-idbox.ok{border-color:var(--conforme);box-shadow:inset 0 -2px 0 var(--conforme);}
  .ra-idfix{display:flex;align-items:center;padding:0 13px;background:#F4F5F7;font-size:18px;font-weight:700;
    color:var(--ink-mid);border-right:1px solid var(--line);flex:none;}
  .ra-idfix.suffix{border-right:none;border-left:1px solid var(--line);}
  .ra-idmid{flex:1;min-width:0;border:none;outline:none;padding:16px 6px;font-size:23px;font-weight:700;
    text-align:center;letter-spacing:.12em;font-family:inherit;color:var(--ink);background:transparent;}
  .ra-idpreview{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;}
  .ra-idpreview b{color:var(--ink);font-weight:700;letter-spacing:.05em;}
  .ra-idpreview.warn{color:var(--defecto);}

  .ra-btn{display:flex;align-items:center;justify-content:center;text-align:center;gap:9px;border:none;
    border-radius:var(--radius);cursor:pointer;font-family:inherit;font-size:15.5px;font-weight:700;color:#fff;
    padding:17px 14px;min-height:56px;line-height:1.2;transition:opacity .12s ease;}
  .ra-btn:active{opacity:.82;}
  .ra-btn:disabled{opacity:.35;cursor:default;}
  .ra-btn-block{width:100%;margin-bottom:9px;}
  .ra-btn-sm{min-height:44px;font-size:13.5px;padding:11px 12px;}
  .ra-btn-primary{background:var(--brand);}
  .ra-btn-conforme{background:var(--conforme);}
  .ra-btn-defecto{background:var(--defecto);}
  .ra-btn-scrap{background:var(--scrap);}
  .ra-btn-info{background:var(--info);}
  .ra-btn-outline{background:#fff;color:var(--ink);border:1px solid var(--line-strong);font-weight:600;}
  .ra-btn-outline:active{background:#F4F5F7;}

  .ra-choice{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:15px 14px;margin-bottom:7px;
    display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:15px;font-weight:600;gap:10px;}
  .ra-choice:active{background:#F4F5F7;}
  .ra-choice .code{font-size:11.5px;color:var(--ink-soft);font-weight:700;background:#F1F2F4;padding:4px 8px;
    border-radius:2px;margin-right:11px;flex:none;min-width:54px;text-align:center;}
  .ra-choice-row{display:flex;align-items:center;flex:1;min-width:0;}
  .ra-choice-text{flex:1;min-width:0;}
  .ra-chev{color:var(--ink-soft);font-size:13px;flex:none;font-weight:600;}

  .ra-topbar{display:flex;align-items:center;margin-bottom:14px;}
  .ra-back{background:none;border:none;font-size:14px;font-weight:600;color:var(--ink-mid);padding:8px 0;cursor:pointer;font-family:inherit;}
  .ra-pill{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:2px;background:var(--ink);color:#fff;margin-left:8px;letter-spacing:.08em;}
  .ra-summary-line{display:flex;justify-content:space-between;gap:14px;padding:9px 0;font-size:13.5px;border-bottom:1px solid var(--line);}
  .ra-summary-line:last-child{border-bottom:none;}
  .ra-summary-line span{color:var(--ink-soft);}
  .ra-summary-line b{font-weight:700;text-align:right;}

  .ra-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom,0);}
  .ra-nav button{flex:1;background:none;border:none;padding:12px 2px 10px;font-size:9.5px;font-weight:700;
    color:var(--ink-soft);cursor:pointer;font-family:inherit;letter-spacing:.05em;border-top:2px solid transparent;margin-top:-1px;}
  .ra-nav button.active{color:var(--ink);border-top-color:var(--ink);}
  .ra-nav .ico{display:block;font-size:16px;margin-bottom:4px;font-weight:400;}

  .ra-toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:13px 22px;border-radius:2px;font-size:13.5px;font-weight:600;z-index:300;opacity:0;pointer-events:none;
    transition:opacity .22s ease, top .22s ease;max-width:88vw;text-align:center;}
  .ra-toast.show{opacity:1;top:calc(58px + env(safe-area-inset-top,0px));}

  .ra-photo-row{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap;}
  .ra-photo-thumb{position:relative;width:78px;height:78px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line-strong);}
  .ra-photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .ra-photo-thumb button{position:absolute;top:3px;right:3px;background:rgba(14,17,20,.78);color:#fff;border:none;
    border-radius:2px;width:22px;height:22px;font-size:12px;line-height:1;cursor:pointer;}
  .ra-add-photo{width:78px;height:78px;border-radius:var(--radius);border:1px dashed var(--line-strong);display:flex;
    align-items:center;justify-content:center;font-size:22px;color:var(--ink-soft);background:#fff;cursor:pointer;}
  .ra-empty{text-align:center;padding:48px 20px;color:var(--ink-soft);font-size:13.5px;line-height:1.6;}
  .ra-empty .big{font-size:28px;margin-bottom:10px;opacity:.35;}

  .ra-item{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:9px;}
  .ra-item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;gap:10px;}
  .ra-item-id{font-weight:700;font-size:15px;word-break:break-all;letter-spacing:.02em;}
  .ra-badge{font-size:10px;font-weight:700;padding:4px 9px;border-radius:2px;color:#fff;white-space:nowrap;letter-spacing:.07em;}
  .ra-badge.conforme{background:var(--conforme);}
  .ra-badge.defecto{background:var(--defecto);}
  .ra-badge.scrap{background:var(--scrap);}
  .ra-badge.zona{background:var(--info);}
  .ra-meta{font-size:12.5px;color:var(--ink-soft);line-height:1.55;}
  .ra-actions{display:flex;gap:16px;margin-top:9px;flex-wrap:wrap;}

  .ra-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-bottom:14px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .ra-stat{background:#fff;padding:14px 6px;text-align:center;}
  .ra-stat .n{font-size:20px;font-weight:800;letter-spacing:-.02em;}
  .ra-stat .l{font-size:9.5px;color:var(--ink-soft);font-weight:700;letter-spacing:.08em;margin-top:3px;}

  .ra-section-title{font-size:12.5px;font-weight:700;color:var(--ink-mid);margin:14px 0 8px;}
  .ra-tag-list{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px;}
  .ra-tag{background:#F4F5F7;border:1px solid var(--line);border-radius:2px;padding:7px 10px 7px 12px;font-size:13px;display:flex;align-items:center;gap:9px;}
  .ra-tag button{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:14px;padding:0;line-height:1;}
  .ra-inline-form{display:flex;gap:7px;margin-bottom:8px;}
  .ra-inline-form input{flex:1;min-width:0;}
  .ra-small-btn{border:none;background:var(--brand);color:#fff;border-radius:var(--radius);padding:0 17px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;flex:none;}
  .ra-link{color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;background:none;border:none;padding:5px 0;font-family:inherit;text-decoration:underline;text-underline-offset:3px;}
  .ra-link.danger{color:var(--scrap);}

  /* Timeline estilo tracking */
  .ra-tl{position:relative;padding-left:30px;margin-top:6px;}
  .ra-tl:before{content:"";position:absolute;left:8px;top:8px;bottom:12px;width:2px;background:var(--line);}
  .ra-tl-item{position:relative;padding-bottom:22px;}
  .ra-tl-item:last-child{padding-bottom:4px;}
  .ra-tl-dot{position:absolute;left:-30px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;
    border:2px solid var(--line-strong);}
  .ra-tl-item.done .ra-tl-dot{background:var(--ink-soft);border-color:var(--ink-soft);}
  .ra-tl-item.current .ra-tl-dot{background:var(--conforme);border-color:var(--conforme);box-shadow:0 0 0 4px rgba(31,122,76,.16);}
  .ra-tl-zona{font-size:15px;font-weight:700;}
  .ra-tl-item.current .ra-tl-zona{color:var(--conforme);}
  .ra-tl-meta{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.5;}
  .ra-tl-nota{font-size:12.5px;color:var(--ink-mid);margin-top:4px;font-style:italic;}
  .ra-zona-actual{background:#F0F5F9;border-left:3px solid var(--info);padding:14px 15px;margin-bottom:14px;}
  .ra-zona-actual .z{font-size:19px;font-weight:700;margin-top:3px;}

  .ra-video-modal{position:fixed;inset:0;background:#000;z-index:200;display:flex;flex-direction:column;}
  .ra-video-modal video{flex:1;width:100%;object-fit:cover;}
  .ra-scan-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(68vw,280px);aspect-ratio:1;border:2px solid #fff;box-shadow:0 0 0 100vmax rgba(0,0,0,.55);pointer-events:none;}
  .ra-video-modal .close-scan,.ra-video-modal .torch-btn{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));
    background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:2px;width:42px;height:42px;font-size:17px;z-index:3;cursor:pointer;}
  .ra-video-modal .close-scan{right:16px;}
  .ra-video-modal .torch-btn{left:16px;}
  .ra-video-modal .torch-btn.on{background:#fff;color:#000;}
  .ra-video-modal .hint{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;
    color:#fff;font-size:13.5px;background:rgba(0,0,0,.55);padding:12px;margin:0 20px;z-index:3;}

  .ra-lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:250;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
  .ra-lightbox img{max-width:100%;max-height:74vh;object-fit:contain;}
  .ra-lightbox .lb-close{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;background:rgba(255,255,255,.16);
    color:#fff;border:none;border-radius:2px;width:42px;height:42px;font-size:17px;cursor:pointer;}
  .ra-lightbox .lb-meta{color:#C3C8D0;font-size:12.5px;margin-top:16px;text-align:center;}
  .ra-photos-mini{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;}
  .ra-photos-mini img{width:54px;height:54px;object-fit:cover;border-radius:2px;border:1px solid var(--line);cursor:pointer;}

  .ra-zchips{display:flex;flex-wrap:wrap;gap:7px;}
  .ra-zchip{background:#fff;border:1px solid var(--line-strong);border-radius:2px;padding:9px 12px;font-size:13px;
    font-weight:600;font-family:inherit;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:8px;}
  .ra-zchip b{background:#F1F2F4;border-radius:2px;padding:2px 7px;font-size:11.5px;color:var(--ink-soft);}
  .ra-zchip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .ra-zchip.on b{background:rgba(255,255,255,.2);color:#fff;}
  .ra-zchip.alerta{border-color:var(--defecto);color:var(--defecto);}
  .ra-zchip.alerta b{background:#FDF6E9;color:var(--defecto);}
  .ra-zchip.alerta.on{background:var(--defecto);color:#fff;border-color:var(--defecto);}
  .ra-zchip.alerta.on b{background:rgba(255,255,255,.22);color:#fff;}
  .ra-item.detenido{border-left:3px solid var(--defecto);}
  .ra-item.sel{border-color:var(--ink);background:#F7F8F9;}
  .ra-check{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:1.5px solid var(--line-strong);
    border-radius:2px;margin-right:9px;font-size:12px;vertical-align:middle;color:#fff;}
  .ra-check.on{background:var(--ink);border-color:var(--ink);}
  .ra-combo{position:relative;}
  .ra-combo-clear{position:absolute;right:8px;top:9px;background:#F1F2F4;border:1px solid var(--line);
    border-radius:2px;width:30px;height:30px;font-size:13px;color:var(--ink-soft);cursor:pointer;}
  .ra-combo-list{border:1px solid var(--line-strong);border-top:none;border-radius:0 0 var(--radius) var(--radius);
    max-height:238px;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-bottom:12px;background:#fff;}
  .ra-combo-opt{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;
    justify-content:space-between;align-items:center;gap:12px;font-size:15px;}
  .ra-combo-opt:last-child{border-bottom:none;}
  .ra-combo-opt:active{background:#F4F5F7;}
  .ra-combo-opt b{font-weight:700;letter-spacing:.03em;}
  .ra-combo-opt span{font-size:11.5px;color:var(--ink-soft);text-align:right;flex:none;max-width:56%;}
  .ra-combo-empty{padding:16px 14px;font-size:13px;color:var(--ink-soft);}
  textarea.ra-input{resize:vertical;min-height:76px;}
  select.ra-input{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 14 14'><path d='M3 5l4 4 4-4' fill='none' stroke='%236B7481' stroke-width='2'/></svg>");background-repeat:no-repeat;background-position:right 14px center;}
  .ra-warn{background:#FDF6E9;border-left:3px solid var(--defecto);padding:13px 14px;font-size:12.5px;color:#6E4B10;line-height:1.55;margin-bottom:14px;}
  .ra-note{background:#F4F5F7;border-left:3px solid var(--line-strong);padding:13px 14px;font-size:12.5px;color:var(--ink-mid);line-height:1.55;margin-bottom:14px;}
  .ra-err{color:var(--scrap);font-size:12.5px;margin:-6px 0 12px;font-weight:600;}
  button:focus-visible,.ra-choice:focus-visible,.ra-input:focus-visible,.ra-idmid:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

  /* Bienvenida */
  .ra-welcome{position:fixed;inset:0;z-index:400;background:var(--brand);color:#fff;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;animation:raFadeOut .55s ease forwards;animation-delay:1.75s;}
  .ra-welcome .w-logo{opacity:0;animation:raRise .55s cubic-bezier(.2,.7,.3,1) forwards;}
  .ra-welcome .w-hi{opacity:0;font-size:12.5px;letter-spacing:.22em;color:#98A1AC;text-align:center;
    animation:raRise .55s cubic-bezier(.2,.7,.3,1) .2s forwards;}
  .ra-welcome .w-name{display:block;font-size:27px;letter-spacing:-.01em;color:#fff;font-weight:700;margin-top:10px;}
  .ra-welcome .w-bar{width:130px;height:2px;background:rgba(255,255,255,.18);overflow:hidden;}
  .ra-welcome .w-bar i{display:block;height:100%;width:0;background:#fff;animation:raBar 1.45s cubic-bezier(.3,.6,.3,1) .25s forwards;}
  @keyframes raRise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  @keyframes raFadeOut{to{opacity:0;visibility:hidden;}}
  @keyframes raBar{to{width:100%;}}
  @keyframes raEnter{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .ra-shake{animation:raShake .34s ease;}
  @keyframes raShake{0%,100%{transform:none;}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}

  .ra-gate{min-height:100vh;background:var(--brand);display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px calc(32px + env(safe-area-inset-bottom,0px));}
  .ra-gate-inner{width:100%;max-width:400px;}
  .ra-gate-brand{text-align:center;margin-bottom:32px;color:#fff;}
  .ra-gate-brand .app-name{font-size:12px;font-weight:600;letter-spacing:.2em;margin-top:20px;color:#98A1AC;}
  .ra-gate-card{background:#fff;border-radius:var(--radius-lg);padding:24px 20px;animation:raEnter .26s ease;}

  @media (min-width:700px){
    .ra-body{max-width:700px;}
    .ra-grid{grid-template-columns:repeat(3,1fr);}
    .ra-header,.ra-steps{padding-left:28px;padding-right:28px;}
    .ra-nav{max-width:700px;left:50%;transform:translateX(-50%);right:auto;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div id="rollo-app"></div>

<script>
(function(){
  "use strict";

  var FAMILIAS = [
    {id:'SUP', name:'Defectos superficiales', defectos:[
      {code:'101', name:'Agujeros'},{code:'403/1019', name:'Caster fold / Grieta'},{code:'2', name:'Escamas'},
      {code:'205', name:'Inclusiones'},{code:'705', name:'Manchas negras cal'},{code:'8', name:'Marcas'},
      {code:'14', name:'Óxido de laminado'},{code:'1069', name:'Óxido de rodillos'},{code:'1527', name:'Oxido por temperatura'},
      {code:'414/510', name:'Óxido primario / Chispas de óxido'},{code:'214', name:'Óxido rojo'},
      {code:'1039', name:'Óxido sin descascarado'},{code:'1523', name:'Pitting'},{code:'1525', name:'Plastas'},
      {code:'19', name:'Rayas'},{code:'308', name:'Sombras'},{code:'26', name:'Tableado'}
    ]},
    {id:'ORI', name:'Orilla', defectos:[
      {code:'62', name:'Orilla defectuosa'},{code:'765', name:'Orilla trozada'},{code:'564', name:'Ramillado'}
    ]},
    {id:'ASP', name:'Aspecto físico', defectos:[
      {code:'1154', name:'Cola de pescado'},{code:'82', name:'Coleado'},{code:'593', name:'Devanado'},
      {code:'80/180', name:'Doblez transversal / Doblez pañuelo'},{code:'73', name:'Mal enrollado'},{code:'7', name:'Maltrato'},
      {code:'83', name:'Ovalado'},{code:'878', name:'Punta rasgada'},{code:'747', name:'Rollo cabezón'},
      {code:'573', name:'Rollo cazuela'},{code:'774', name:'Rollo corcholata'},{code:'106', name:'Rollo desenvuelto'},
      {code:'81', name:'Telescopiado'},{code:'78', name:'Tensión de enrollado'}

  function safeParse(s, fb){ try{ return JSON.parse(s); }catch(e){ return fb; } }
  var storageOK = (function(){
    try{ localStorage.setItem(PREFIX+'__t','1'); localStorage.removeItem(PREFIX+'__t'); return true; }catch(e){ return false; }
  })();
  function get(key, fb){
    if(!storageOK) return fb;
    var raw = localStorage.getItem(PREFIX+key);
    return raw === null ? fb : safeParse(raw, fb);
  }
  function set(key, val){
    if(!storageOK) throw new Error('sin almacenamiento');
    localStorage.setItem(PREFIX+key, JSON.stringify(val));
  }
  function persistAll(){
    set('usuarios',S.usuarios); set('adminPassword',S.adminPassword); set('catalogs',S.catalogs);

    set('tracking',S.tracking); set('auditoria',S.auditoria);
  }
  function estimateUsage(){
    var t=0;
    try{ for(var k in localStorage){ if(Object.prototype.hasOwnProperty.call(localStorage,k) && k.indexOf(PREFIX)===0) t+=(localStorage.getItem(k)||'').length; } }catch(e){}
    return t;

  function toast(msg){

    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  function migrarGrados(cat){
    if(!cat.grados || !cat.grados.length) cat.grados = JSON.parse(JSON.stringify(DEFAULT_GRADOS));
    cat.grados = cat.grados.map(function(g){
      if(typeof g === 'string') return {grado:g, sgf:'', familia:''};
      if(g.sgf === undefined) return {grado:g.grado, sgf:g.familia||'', familia:''};
      return g;
    });
    if(!cat.zonas || !cat.zonas.length) cat.zonas = DEFAULT_ZONAS.slice();
    if(!cat.enrolladores) cat.enrolladores = ['Enrollador 1','Enrollador 2','Enrollador 3'];
    return cat;
  }

  var inactTimer=null;
  function cerrarSesion(porInactividad){
    S.inspector=null; S.isAdmin=false; S.tab='captura';
    try{ set('sesion',null); }catch(e){}
    resetCaptureFlow();
    S.editReg=null; S.trackVista='lista'; S.trackRollo=null;
    S.trackModoSel=false; S.trackSeleccion=[];
    S.loginStep='pick'; S.loginPickedUser=null; S.showAdminUnlock=false; S.showChangePin=false;
    render();
    if(porInactividad) toast('Sesión cerrada por inactividad');
  }
  function reiniciarInactividad(){
    if(inactTimer) clearTimeout(inactTimer);
    if(!S.inspector && !S.isAdmin) return;
    inactTimer = setTimeout(function(){
      if(S.inspector || S.isAdmin) cerrarSesion(true);
    }, MINUTOS_INACTIVIDAD*60*1000);
  }
  ['click','keydown','touchstart','focusin'].forEach(function(ev){

  document.addEventListener('visibilitychange', function(){

  /* ============ HELPERS ============ */
  function el(html){ var d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }
  function escHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  var escAttr = escHtml;
  function pad(n){ return (n<10?'0':'')+n; }
  function fechaHoy(d){ d=d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function horaAhora(d){ d=d||new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
  function usuarioActual(){ return S.inspector || 'Administrador'; }
  /* Turno 1: 19:00 a 06:59 · Turno 2: 07:00 a 18:59 */
  function turnoDe(d){ d=d||new Date(); var h=d.getHours(); return (h>=7 && h<19) ? '2' : '1'; }
  function soloNumero(txt){
    var v = String(txt||'').replace(/[^0-9.]/g,'');
    var partes = v.split('.');
    if(partes.length > 2) v = partes[0] + '.' + partes.slice(1).join('');
    return v;
  }
  function buscarGrado(grado){
    return (S.catalogs.grados||[]).filter(function(x){ return x.grado===grado; })[0] || null;
  }
  function familiaDeGrado(grado){
    var g=buscarGrado(grado);
    return g ? (g.sgf||'') : '';
  }
  function descripcionDeGrado(grado){
    var g=buscarGrado(grado);
    return g ? (g.familia||'') : '';
  }
  function gradoValido(g){ return !g || !!buscarGrado(g); }
  function zonas(){ return S.catalogs.zonas || DEFAULT_ZONAS; }

  function auditar(tipo, rolloId, detalle, motivo){
    var now=new Date();
    S.auditoria.unshift({
      id:'a'+now.getTime()+Math.random().toString(36).slice(2,6), ts:now.getTime(),
      fecha:fechaHoy(now), hora:horaAhora(now), turno:turnoDe(now), usuario:usuarioActual(),
      tipo:tipo, rolloId:rolloId||'', detalle:detalle||'', motivo:motivo||''
    });
    if(S.auditoria.length > 800) S.auditoria = S.auditoria.slice(0,800);
    try{ set('auditoria', S.auditoria); }catch(e){}
  }

  function stepOrder(){
    var steps=['id','resultado'];
    if(S.resultado==='Conforme') steps.push('confirmar');
    if(S.resultado==='Defecto' || S.resultado==='Scrap'){
      steps.push('familia','defecto');
      var v=currentDefectVariaciones();
      if(v && v.length) steps.push('variacion');
      steps.push('ubicacion');
      if(S.resultado==='Defecto') steps.push('severidad');
      steps.push('evidencia');
    }
    return steps;
  }
  function currentDefectVariaciones(){
    if(!S.defecto) return null;
    return S.variacionesCat[S.defecto.code] || null;

  function isInsecureContext(){
    return (location.protocol==='file:') || (!window.isSecureContext && location.hostname!=='localhost');

      case 'resultado': return screenResultado();
      case 'familia':   return screenFamilia();
      case 'defecto':   return screenDefecto();
      case 'variacion': return screenVariacion();
      case 'ubicacion': return screenUbicacion();
      case 'severidad': return screenSeveridad();
      case 'evidencia': return screenEvidencia();
      case 'confirmar': return screenConfirmar();
      default:          return screenId();
    }
  }

  /* ============ TRACKING ============ */
  function horasSinMover(t){
    return (Date.now() - (t.ultimoTs||Date.now())) / 3600000;
  }
  function estaDetenido(t){
    return horasSinMover(t) >= HORAS_DETENIDO;
  }
  function textoAntiguedad(t){
    var h = horasSinMover(t);
    if(h < 1) return 'hace menos de 1 h';
    if(h < 24) return 'hace '+Math.floor(h)+' h';
    var d = Math.floor(h/24);
    return 'hace '+d+' día'+(d===1?'':'s');
  }

  function trackingList(){
    return Object.keys(S.tracking).map(function(k){ return S.tracking[k]; })
      .sort(function(a,b){ return (b.ultimoTs||0)-(a.ultimoTs||0); });
  }

  function renderTracking(){
    if(S.trackVista==='detalle' && S.trackRollo) return screenTrackDetalle();
    var q = S.trackFiltro.trim().toLowerCase();
    var todos = trackingList();
    var detenidos = todos.filter(estaDetenido);
    var lista = todos.filter(function(t){
      if(S.trackZona==='Detenidos'){ if(!estaDetenido(t)) return false; }
      else if(S.trackZona!=='Todas' && t.zona!==S.trackZona) return false;
      if(!q) return true;
      return t.rolloId.toLowerCase().indexOf(q)!==-1;
    });
    var porZona = {};
    todos.forEach(function(t){ porZona[t.zona]=(porZona[t.zona]||0)+1; });
    var listaZonas = zonas().slice();
    Object.keys(porZona).forEach(function(z){ if(listaZonas.indexOf(z)===-1) listaZonas.push(z); });
    var chips = ['Todas'].concat(listaZonas).map(function(z){
      var n = z==='Todas' ? todos.length : (porZona[z]||0);
      return '<button class="ra-zchip'+(S.trackZona===z?' on':'')+'" data-zona-filtro="'+escAttr(z)+'">' +
        escHtml(z)+'<b>'+n+'</b></button>';
    }).join('');
    if(detenidos.length){
      chips += '<button class="ra-zchip alerta'+(S.trackZona==='Detenidos'?' on':'')+'" data-zona-filtro="Detenidos">' +
        'Detenidos<b>'+detenidos.length+'</b></button>';
    }

    var aviso = (detenidos.length && S.trackZona!=='Detenidos')
      ? '<div class="ra-warn">'+detenidos.length+' rollo(s) llevan más de '+HORAS_DETENIDO+' h sin movimiento. ' +
        '<button class="ra-link" id="btn-ver-detenidos" style="color:#6E4B10;">Ver cuáles</button></div>' : '';

    var vacioTxt = S.trackZona==='Detenidos'
      ? 'No hay rollos detenidos. Todo se ha movido en las últimas '+HORAS_DETENIDO+' h.'
      : (S.trackZona!=='Todas'
          ? 'No hay rollos en '+escHtml(S.trackZona)+(q?' que coincidan con la búsqueda.':'.')
          : (q ? 'Ningún rollo coincide con la búsqueda.' : ''));

    var items = lista.length ? lista.map(function(t){
      var reg = S.registros.filter(function(r){ return r.rolloId===t.rolloId; })[0];
      var cls = reg ? (reg.resultado==='Conforme'?'conforme':reg.resultado==='Defecto'?'defecto':'scrap') : 'zona';
      var det = estaDetenido(t);
      var sel = S.trackSeleccion.indexOf(t.rolloId)!==-1;
      return '<div class="ra-item'+(det?' detenido':'')+(sel?' sel':'')+'"'+(S.trackModoSel?' data-sel-rollo="'+escAttr(t.rolloId)+'" style="cursor:pointer;"':'')+'>' +
          '<div class="ra-item-top">' +
            '<span class="ra-item-id">'+(S.trackModoSel?'<span class="ra-check'+(sel?' on':'')+'">'+(sel?'✓':'')+'</span>':'')+escHtml(t.rolloId)+'</span>' +
            (reg?'<span class="ra-badge '+cls+'">'+escHtml(reg.resultado.toUpperCase())+'</span>':'')+'</div>' +
          '<div class="ra-meta"><b style="color:var(--info);">'+escHtml(t.zona)+'</b> · '+(t.movimientos.length)+' movimiento(s)</div>' +

  function moverRollo(rolloIdVal, zona, nota){
    var t = S.tracking[rolloIdVal];
    if(!t) return;
    var now = new Date();
    t.movimientos.push({zona:zona, usuario:usuarioActual(), fecha:fechaHoy(now), hora:horaAhora(now), turno:turnoDe(now), ts:now.getTime(), nota:nota||''});
    t.zona = zona; t.ultimoUsuario = usuarioActual(); t.ultimaFecha = fechaHoy(now); t.ultimaHora = horaAhora(now); t.ultimoTurno = turnoDe(now); t.ultimoTs = now.getTime();
    try{ set('tracking', S.tracking); }catch(e){ toast('No se pudo guardar el movimiento'); return; }
    auditar('movimiento', rolloIdVal, 'Movido a '+zona, nota||'');
    toast('Rollo movido a '+zona);
    render();
  }

  function moverLote(ids, zona, nota){
    var now=new Date(), movidos=0;
    ids.forEach(function(id){
      var t=S.tracking[id];
      if(!t || t.zona===zona) return;
      t.movimientos.push({zona:zona, usuario:usuarioActual(), fecha:fechaHoy(now), hora:horaAhora(now),
        turno:turnoDe(now), ts:now.getTime(), nota:nota||'Movimiento en lote'});
      t.zona=zona; t.ultimoUsuario=usuarioActual(); t.ultimaFecha=fechaHoy(now);
      t.ultimaHora=horaAhora(now); t.ultimoTurno=turnoDe(now); t.ultimoTs=now.getTime();
      movidos++;
    });
    if(!movidos){ toast('Esos rollos ya están en '+zona); return; }
    try{ set('tracking', S.tracking); }catch(e){ toast('No se pudo guardar el movimiento'); return; }
    auditar('movimiento','('+movidos+' rollos)','Movimiento en lote a '+zona+': '+ids.join(', '), nota||'');
    S.trackModoSel=false; S.trackSeleccion=[];
    toast(movidos+' rollo(s) movidos a '+zona);
    render();
  }

  function iniciarTracking(rolloIdVal){
    if(S.tracking[rolloIdVal]) return;
    var now = new Date();
    S.tracking[rolloIdVal] = {
      rolloId:rolloIdVal, zona:ZONA_ORIGEN,
      ultimoUsuario:usuarioActual(), ultimaFecha:fechaHoy(now), ultimaHora:horaAhora(now), ultimoTurno:turnoDe(now), ultimoTs:now.getTime(),
      movimientos:[{zona:ZONA_ORIGEN, usuario:usuarioActual(), fecha:fechaHoy(now), hora:horaAhora(now), turno:turnoDe(now), ts:now.getTime(), nota:'Alta por inspección'}]
    };
    try{ set('tracking', S.tracking); }catch(e){}
  }

  /* ============ HISTORIAL ============ */
  function restarDias(n){
    var d=new Date(); d.setDate(d.getDate()-n); return fechaHoy(d);
  }
  function pasaFiltroFecha(r){
    var f=r.fecha||'';
    if(S.filtroFecha==='Hoy') return f===fechaHoy();
    if(S.filtroFecha==='Ayer') return f===restarDias(1);
    if(S.filtroFecha==='7 días') return f>=restarDias(6);
    if(S.filtroFecha==='Rango'){
      if(S.filtroDesde && f<S.filtroDesde) return false;
      if(S.filtroHasta && f>S.filtroHasta) return false;
      return true;
    }
    return true;
  }
  function filteredRegistros(){
    var q=S.filtro.trim().toLowerCase();
    return S.registros.filter(function(r){
      if(S.filtroResultado!=='Todos' && r.resultado!==S.filtroResultado) return false;
      if(S.filtroTurno!=='Todos' && (r.turno||'')!==S.filtroTurno) return false;
      if(!pasaFiltroFecha(r)) return false;
      if(!q) return true;
      return [r.rolloId,r.defecto,r.defectoCode,r.familia,r.inspector,r.ubicacion,r.comentario,r.grado,r.familiaSGF]
        .filter(Boolean).join(' ').toLowerCase().indexOf(q)!==-1;
    });
  }

  /* ---------- Resumen del día ---------- */
  function resumenHoyCard(){
    var hoy=fechaHoy();
    var delDia=S.registros.filter(function(r){ return r.fecha===hoy; });
    if(!delDia.length){
      return '<div class="ra-card" style="padding:16px 18px;">' +
        '<div class="ra-label">RESUMEN DE HOY</div>' +
        '<div class="ra-meta" style="margin-top:4px;">Todavía no hay rollos capturados hoy.</div></div>';
    }
    function conteo(arr,res){ return arr.filter(function(r){ return r.resultado===res; }).length; }
    var t1=delDia.filter(function(r){ return r.turno==='1'; });
    var t2=delDia.filter(function(r){ return r.turno==='2'; });
    var defectos={};
    delDia.forEach(function(r){
      if(r.defecto) { var k=r.defectoCode+' '+r.defecto; defectos[k]=(defectos[k]||0)+1; }
    });
    var top=Object.keys(defectos).sort(function(a,b){ return defectos[b]-defectos[a]; }).slice(0,3);
    var topHtml = top.length
      ? top.map(function(k){ return '<div class="ra-summary-line"><span>'+escHtml(k)+'</span><b>'+defectos[k]+'</b></div>'; }).join('')
      : '<div class="ra-meta">Sin defectos registrados hoy.</div>';
    function fila(nombre,arr){
      if(!arr.length) return '';
      return '<div class="ra-summary-line"><span>'+nombre+'</span><b>'+arr.length+
        ' <span style="color:var(--ink-soft);font-weight:400;">('+conteo(arr,'Defecto')+' def · '+conteo(arr,'Scrap')+' scrap)</span></b></div>';
    }
    return '<div class="ra-card" style="padding:16px 18px;">' +
        '<div class="ra-label">RESUMEN DE HOY · '+escHtml(hoy)+'</div>' +
        '<div style="display:flex;align-items:baseline;gap:10px;margin:6px 0 10px;">' +
          '<div style="font-size:30px;font-weight:800;letter-spacing:-.02em;">'+delDia.length+'</div>' +
          '<div class="ra-meta">rollos inspeccionados · '+conteo(delDia,'Conforme')+' conformes</div>' +
        '</div>' +
        fila('Turno 1 (19:00–06:59)',t1) + fila('Turno 2 (07:00–18:59)',t2) +
        '<div class="ra-label" style="margin-top:14px;">DEFECTOS MÁS FRECUENTES</div>' + topHtml +
      '</div>';
  }

    }).join('');

      '<div class="ra-card" style="padding:14px;">' +
        '<input class="ra-input" id="input-filtro" placeholder="Buscar por rollo, defecto, grado o inspector" value="'+escAttr(S.filtro)+'" autocomplete="off">' +
        '<div class="ra-grid" style="grid-template-columns:repeat(4,1fr);gap:6px;">'+filtros+'</div>' +
        '<label class="ra-label" style="margin-top:14px;">FECHA</label><div class="ra-zchips">'+fechas+'</div>' + rango +
        '<label class="ra-label" style="margin-top:14px;">TURNO</label><div class="ra-zchips">'+turnos+'</div>' +
        (hayFiltro ? '<div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;">' +
          '<span class="ra-meta">'+regs.length+' resultado(s)</span>' +
          '<button class="ra-link" id="btn-limpiar-filtros">Limpiar filtros</button></div>' : '') +
      '</div>' + items;
    function stat(n,l){ return '<div class="ra-stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }
  }

  function historyItem(r){
    var cls=r.resultado==='Conforme'?'conforme':r.resultado==='Defecto'?'defecto':'scrap';
    var meta=[r.familia, r.defectoCode?r.defectoCode+' '+r.defecto:'', r.variacion, r.ubicacion, r.severidad].filter(Boolean).join(' · ');
    var acero=[r.grado, r.familiaSGF?'SGF '+r.familiaSGF:'', r.familiaDesc].filter(Boolean).join(' · ');

        '<div class="ra-meta">'+(escHtml(meta)||'Sin defecto')+'</div>' +
        (acero?'<div class="ra-meta">'+escHtml(acero)+'</div>':'') +
        '<div class="ra-meta">'+escHtml(r.fecha||'')+' '+escHtml(r.hora||'')+(r.turno?' · Turno '+escHtml(r.turno):'')+' · '+escHtml(r.inspector||'')+(zona?' · '+escHtml(zona):'')+'</div>' +
        (r.comentario?'<div class="ra-meta" style="margin-top:5px;font-style:italic;">'+escHtml(r.comentario)+'</div>':'') +

  /* ============ FOTOS ============ */
  function compressImage(file){
    return new Promise(function(resolve,reject){
      var reader=new FileReader();
      reader.onload=function(e){
        var img=new Image();
        img.onload=function(){
          var maxW=900, scale=Math.min(1,maxW/img.width);
          var c=document.createElement('canvas');
          c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          resolve(c.toDataURL('image/jpeg',0.55));
        };
        img.onerror=reject; img.src=e.target.result;
      };
      reader.onerror=reject; reader.readAsDataURL(file);
    });
  }

  /* ============ QR ============ */
  function aplicarIdEscaneado(valor){
    var v = String(valor||'').trim().toUpperCase().replace(/\s+/g,'');
    var m = v.match(new RegExp('^'+ID_PREFIX+'(\\d{'+ID_MID_LEN+'})'+ID_SUFFIX+'$'));
    if(m){ S.idModo='guiado'; S.idMid=m[1]; }
    else { S.idModo='libre'; S.idFull=v; }
  }

  function loadScript(src){
    return new Promise(function(resolve,reject){
      var s=document.createElement('script');
      s.src=src; s.onload=resolve; s.onerror=reject;
      document.head.appendChild(s);
    });
  }
  function loadJsQR(){ return window.jsQR ? Promise.resolve() : loadScript("https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"); }
  function loadSheetJS(){ return window.XLSX ? Promise.resolve() : loadScript("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"); }

  function openScanner(){
    if(isInsecureContext()){ toast('La cámara requiere https — captura el ID manualmente'); return; }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('Este navegador no permite usar la cámara'); return; }
    loadJsQR().then(function(){
      var modal=el('<div class="ra-video-modal"><button class="close-scan" aria-label="Cerrar">✕</button><video autoplay playsinline muted></video><div class="ra-scan-frame"></div><div class="hint">Apunta al código QR del rollo</div></div>');
      document.body.appendChild(modal);
      var video=modal.querySelector('video');
      var canvas=document.createElement('canvas');
      var ctx=canvas.getContext('2d',{willReadFrequently:true});
      var stream=null, stop=false, torchOn=false;
      navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}}).then(function(s){
        stream=s; video.srcObject=s; video.play().catch(function(){});
        var track=s.getVideoTracks()[0];
        var caps=(track && track.getCapabilities)?(track.getCapabilities()||{}):{};
        if(caps.torch){
          var tb=el('<button class="torch-btn" aria-label="Linterna">☀</button>');
          modal.appendChild(tb);
          tb.addEventListener('click',function(){
            torchOn=!torchOn;
            track.applyConstraints({advanced:[{torch:torchOn}]}).catch(function(){});
            tb.classList.toggle('on',torchOn);
          });
        }
        requestAnimationFrame(tick);
      }).catch(function(){ toast('No se pudo abrir la cámara — revisa los permisos'); cerrar(); });

      function tick(){
        if(stop) return;
        if(video.readyState===video.HAVE_ENOUGH_DATA && video.videoWidth){
          var scale=Math.min(1,480/video.videoWidth);
          canvas.width=Math.max(1,Math.round(video.videoWidth*scale));
          canvas.height=Math.max(1,Math.round(video.videoHeight*scale));
          ctx.drawImage(video,0,0,canvas.width,canvas.height);
          try{
            var d=ctx.getImageData(0,0,canvas.width,canvas.height);
            var code=window.jsQR(d.data,d.width,d.height,{inversionAttempts:'attemptBoth'});
            if(code && code.data && code.data.trim()){
              aplicarIdEscaneado(code.data);
              if(navigator.vibrate) navigator.vibrate(60);
              cerrar(); render(); toast(rolloId());
              return;
            }
          }catch(e){}
        }
        requestAnimationFrame(tick);
      }
      function cerrar(){
        stop=true;
        if(stream) stream.getTracks().forEach(function(t){ t.stop(); });
        if(modal.parentNode) modal.remove();
      }
      modal.querySelector('.close-scan').addEventListener('click',cerrar);
    }).catch(function(){ toast('No se pudo cargar el lector de QR — revisa tu conexión'); });
  }

  /* ============ IMPORTAR GRADOS ============ */
  function importarGrados(file){
    var nombre = file.name.toLowerCase();
    if(nombre.slice(-4)==='.csv'){
      var reader=new FileReader();
      reader.onload=function(e){ procesarFilasGrados(parseCSV(e.target.result)); };
      reader.readAsText(file);
      return;
    }
    loadSheetJS().then(function(){
      var reader=new FileReader();
      reader.onload=function(e){
        try{
          var wb = window.XLSX.read(new Uint8Array(e.target.result), {type:'array'});
          var ws = wb.Sheets[wb.SheetNames[0]];
          var filas = window.XLSX.utils.sheet_to_json(ws, {header:1, blankrows:false});
          procesarFilasGrados(filas);
        }catch(err){ toast('No se pudo leer el archivo'); }
      };
      reader.readAsArrayBuffer(file);
    }).catch(function(){ toast('No se pudo cargar el lector de Excel'); });
  }

  function parseCSV(texto){
    return texto.split(/\r?\n/).filter(function(l){ return l.trim(); })
      .map(function(l){ return l.split(/[;,\t]/).map(function(c){ return c.trim().replace(/^"|"$/g,''); }); });
  }

  function procesarFilasGrados(filas){
    if(!filas || !filas.length){ toast('El archivo está vacío'); return; }
    var mapa = {};
    (S.catalogs.grados||[]).forEach(function(g){ mapa[g.grado] = {sgf:g.sgf||'', familia:g.familia||''}; });
    var añadidos = 0;
    filas.forEach(function(f, i){
      if(!f || f.length < 2) return;
      var grado = String(f[0]==null?'':f[0]).trim();
      var sgf = String(f[1]==null?'':f[1]).trim();
      var familia = f.length > 2 ? String(f[2]==null?'':f[2]).trim() : '';
      if(!grado) return;
      if(i===0 && /grado|planch/i.test(grado)) return; // encabezado
      if(mapa[grado] === undefined) añadidos++;
      mapa[grado] = {sgf:sgf, familia:familia};
    });
    S.catalogs.grados = Object.keys(mapa).sort().map(function(g){ return {grado:g, sgf:mapa[g].sgf, familia:mapa[g].familia}; });
    try{ set('catalogs', S.catalogs); }catch(e){ toast('No se pudo guardar el catálogo'); return; }
    auditar('edicion','', 'Importación de catálogo de grados: '+S.catalogs.grados.length+' registros', '');
    toast(añadidos+' grados nuevos · '+S.catalogs.grados.length+' en total');
    render();
  }

  /* ============ RESPALDO ============ */
  function downloadBackup(){
    var data={version:2,exportado:new Date().toISOString(),usuarios:S.usuarios,adminPassword:S.adminPassword,
      catalogs:S.catalogs,variaciones:S.variacionesCat,registros:S.registros,rollosMaster:S.rollosMaster,
      tracking:S.tracking,auditoria:S.auditoria};
    var blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='respaldo_inspeccion_'+fechaHoy()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },3000);
    toast('Respaldo descargado');
  }

  function restoreBackup(file){
    var reader=new FileReader();
    reader.onload=function(e){
      var d=safeParse(e.target.result,null);
      if(!d || !d.registros){ toast('El archivo no es un respaldo válido'); return; }
      if(!confirm('Esto reemplazará TODOS los datos de este equipo con los del respaldo. ¿Continuar?')) return;
      S.usuarios=d.usuarios||[]; S.adminPassword=d.adminPassword||DEFAULT_ADMIN_PASS;
      S.catalogs=migrarGrados(d.catalogs||{}); S.variacionesCat=d.variaciones||S.variacionesCat;
      S.registros=d.registros||[]; S.rollosMaster=d.rollosMaster||{};
      S.tracking=d.tracking||{}; S.auditoria=d.auditoria||[];
      try{ persistAll(); toast('Respaldo restaurado'); }catch(err){ toast('No se pudo guardar — espacio insuficiente'); }
      render();
    };
    reader.readAsText(file);
  }

  /* ============ EVENTOS ============ */
  function on(sel,ev,fn){ var n=root.querySelector(sel); if(n) n.addEventListener(ev,fn); }
  function each(sel,fn){ root.querySelectorAll(sel).forEach(fn); }

  function bindEvents(){
    each('.ra-nav [data-tab]',function(b){
      b.addEventListener('click',function(){
        S.tab=b.getAttribute('data-tab');
        if(S.tab!=='rollos'){ S.trackVista='lista'; S.trackRollo=null; }
        render();
      });
    });
    on('#btn-user','click',function(){ S.tab='ajustes'; render(); });

    /* acceso */
    each('[data-pick-user]',function(b){
      b.addEventListener('click',function(){
        S.loginPickedUser=b.getAttribute('data-pick-user'); S.loginStep='pin'; S.loginError='';
        render(); setTimeout(function(){ var i=root.querySelector('#login-pin-input'); if(i) i.focus(); },50);
      });
    });
    on('#btn-login-back','click',function(){ S.loginStep='pick'; S.loginPickedUser=null; S.loginError=''; render(); });
    function doLogin(){
      var i=root.querySelector('#login-pin-input');
      var pin=i?i.value.trim():'';
      var u=S.usuarios.filter(function(x){ return x.nombre===S.loginPickedUser; })[0];
      if(u && u.pin===pin){
        var nombre = S.loginPickedUser;
        S.inspector=nombre;
        try{ set('sesion',nombre); }catch(e){}
        S.loginStep='pick'; S.loginPickedUser=null; S.loginError=''; S.tab='captura';
        mostrarBienvenida(nombre);
        render();
      } else { S.loginError='PIN incorrecto'; render(); sacudir('.ra-gate-card'); }
    }
    on('#btn-login-submit','click',doLogin);
    on('#login-pin-input','keydown',function(e){ if(e.key==='Enter') doLogin(); });

    on('#btn-show-admin-unlock','click',function(){ S.showAdminUnlock=true; S.adminUnlockError=''; render(); });
    on('#btn-hide-admin-unlock','click',function(){ S.showAdminUnlock=false; render(); });
    function doAdmin(){
      var i=root.querySelector('#admin-unlock-pass');
      if(i && i.value===S.adminPassword){
        S.isAdmin=true; S.showAdminUnlock=false; S.adminUnlockError='';
        if(!S.inspector) mostrarBienvenida('Administrador');
        render();
      } else { S.adminUnlockError='Clave incorrecta'; render(); sacudir('.ra-gate-card'); }
    }
    on('#btn-admin-unlock-submit','click',doAdmin);
    on('#admin-unlock-pass','keydown',function(e){ if(e.key==='Enter') doAdmin(); });

    /* ID */
    var mid=root.querySelector('#input-id-mid');
    if(mid){
      mid.addEventListener('input',function(){
        S.idMid = mid.value.replace(/\D/g,'').slice(0,ID_MID_LEN);
        refreshIdScreen('#input-id-mid');
      });
      mid.addEventListener('keydown',function(e){
        if(e.key==='Enter'){
          if(idValido()){ collectManualFields(); S.step='resultado'; render(); }
          else toast('El ID debe llevar exactamente '+ID_MID_LEN+' dígitos');
        }
      });
    }
    var full=root.querySelector('#input-id-full');
    if(full){
      full.addEventListener('input',function(){ S.idFull=full.value; refreshIdScreen('#input-id-full'); });
      full.addEventListener('keydown',function(e){ if(e.key==='Enter' && idValido()){ collectManualFields(); S.step='resultado'; render(); } });
    }
    var inGrado=root.querySelector('#field-grado');
    if(inGrado){
      inGrado.addEventListener('input',function(){
        S.gradoQuery = inGrado.value;
        S.rolloData.grado = '';
        S.gradoAbierto = true;
        refreshIdScreen('#field-grado');
      });
      inGrado.addEventListener('focus',function(){
        if(!S.rolloData.grado){ S.gradoAbierto = true; refreshIdScreen('#field-grado'); }
      });
      inGrado.addEventListener('keydown',function(e){
        if(e.key==='Enter'){
          e.preventDefault();
          var opt=root.querySelector('[data-pick-grado]');
          if(opt) elegirGrado(opt.getAttribute('data-pick-grado'));
        }
        if(e.key==='Escape'){ S.gradoAbierto=false; refreshIdScreen('#field-grado'); }
      });
    }
    each('[data-pick-grado]',function(b){
      b.addEventListener('mousedown',function(ev){ ev.preventDefault(); });
      b.addEventListener('click',function(){ elegirGrado(b.getAttribute('data-pick-grado')); });
    });
    on('#btn-clear-grado','click',function(){
      S.rolloData.grado=''; S.rolloData.familiaSGF=''; S.gradoQuery=''; S.gradoAbierto=true;
      refreshIdScreen('#field-grado');
    });
    on('#btn-modo-libre','click',function(){ S.idModo='libre'; S.idFull = idValido()? rolloId() : ''; render(); });
    on('#btn-modo-guiado','click',function(){
      S.idModo='guiado';
      var m = S.idFull.toUpperCase().match(new RegExp('^'+ID_PREFIX+'(\\d{'+ID_MID_LEN+'})'+ID_SUFFIX+'$'));
      S.idMid = m ? m[1] : '';
      render();
    });
    on('#btn-scan','click',openScanner);
    on('#btn-continue-id','click',function(){
      if(!idValido()){ toast('El ID debe llevar exactamente '+ID_MID_LEN+' dígitos'); sacudir('.ra-idbox'); return; }
      collectManualFields(); S.step='resultado'; render();
    });

    each('[data-resultado]',function(b){
      b.addEventListener('click',function(){
        S.resultado=b.getAttribute('data-resultado');
        S.step = (S.resultado==='Conforme') ? 'confirmar' : 'familia';
        render();
      });
    });
    each('[data-familia]',function(b){
      function pick(){ S.familia=FAMILIAS.filter(function(f){ return f.id===b.getAttribute('data-familia'); })[0]; S.step='defecto'; render(); }
      b.addEventListener('click',pick);
      b.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); } });
    });
    each('[data-defecto]',function(b){
      function pick(){
        var code=b.getAttribute('data-defecto');
        S.defecto=S.familia.defectos.filter(function(d){ return d.code===code; })[0];
        var v=currentDefectVariaciones();
        S.step=(v && v.length)?'variacion':'ubicacion'; render();
      }
      b.addEventListener('click',pick);
      b.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); } });
    });
    each('[data-variacion]',function(b){
      function pick(){ S.variacion=b.getAttribute('data-variacion'); S.step='ubicacion'; render(); }
      b.addEventListener('click',pick);
      b.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); } });
    });
    each('[data-ubicacion]',function(b){
      b.addEventListener('click',function(){
        S.ubicacion=b.getAttribute('data-ubicacion');
        S.step=(S.resultado==='Defecto')?'severidad':'evidencia'; render();
      });
    });
    each('[data-severidad]',function(b){
      b.addEventListener('click',function(){ S.severidad=b.getAttribute('data-severidad'); S.step='evidencia'; render(); });
    });
    each('[data-goto]',function(b){ b.addEventListener('click',function(){ S.step=b.getAttribute('data-goto'); render(); }); });

    var foto=root.querySelector('#input-foto');
    if(foto) foto.addEventListener('change',function(){
      if(foto.files && foto.files[0]){
        compressImage(foto.files[0]).then(function(d){ S.fotos.push(d); render(); })
        .catch(function(){ toast('No se pudo procesar la foto'); });
      }
    });
    each('[data-remove-foto]',function(b){
      b.addEventListener('click',function(){ S.fotos.splice(parseInt(b.getAttribute('data-remove-foto'),10),1); render(); });
    });
    var com=root.querySelector('#input-comentario');
    if(com) com.addEventListener('input',function(){ S.comentario=com.value; });
    on('#btn-guardar','click',guardarRegistro);

    /* edición */
    each('[data-edit-registro]',function(b){
      b.addEventListener('click',function(){
        var id=b.getAttribute('data-edit-registro');
        var r=S.registros.filter(function(x){ return x.id===id; })[0];
        if(!r) return;
        S.editReg=r; S.editErr=''; S.tab='captura'; render();
      });
    });
    on('#btn-cancel-edit','click',function(){ S.editReg=null; S.editErr=''; S.tab='historial'; render(); });
    var editFam=root.querySelector('#edit-familia');
    if(editFam) editFam.addEventListener('change',function(){
      var f=FAMILIAS.filter(function(x){ return x.id===editFam.value; })[0];
      var sel=root.querySelector('#edit-defecto');
      sel.innerHTML='<option value="">—</option>'+(f?f.defectos.map(function(d){
        return '<option value="'+escAttr(d.code)+'">'+escHtml(d.code+' — '+d.name)+'</option>';
      }).join(''):'');
      var selVar=root.querySelector('#edit-variacion');
      if(selVar) selVar.innerHTML='<option value="">—</option>';
    });
    var editDef=root.querySelector('#edit-defecto');
    if(editDef) editDef.addEventListener('change',function(){
      var vars=S.variacionesCat[editDef.value]||[];
      var selVar=root.querySelector('#edit-variacion');
      if(selVar) selVar.innerHTML='<option value="">—</option>'+vars.map(function(v){ return '<option value="'+escAttr(v)+'">'+escHtml(v)+'</option>'; }).join('');
    });
    on('#btn-save-edit','click',guardarEdicion);

    /* tracking */
    var tf=root.querySelector('#track-filtro');
    if(tf) tf.addEventListener('input',function(){
      S.trackFiltro=tf.value;
      var pos=tf.selectionStart; render();
      var n=root.querySelector('#track-filtro');
      if(n){ n.focus(); n.setSelectionRange(pos,pos); }
    });
    each('[data-zona-filtro]',function(b){
      b.addEventListener('click',function(){
        S.trackZona = b.getAttribute('data-zona-filtro');
        render();
      });
    });
    ['#field-espesor','#field-ancho','#field-peso'].forEach(function(sel){
      var n=root.querySelector(sel);
      if(!n) return;
      n.addEventListener('input',function(){
        var limpio=soloNumero(n.value);
        if(limpio!==n.value){
          var pos=n.selectionStart-(n.value.length-limpio.length);
          n.value=limpio;
          try{ n.setSelectionRange(pos,pos); }catch(e){}
        }
      });
      n.addEventListener('keypress',function(e){
        if(e.key && e.key.length===1 && !/[0-9.]/.test(e.key)) e.preventDefault();
      });
      n.addEventListener('blur',function(){ n.value=soloNumero(n.value).replace(/\.$/,''); });
    });
    on('#btn-ver-detenidos','click',function(){ S.trackZona='Detenidos'; S.tab='rollos'; render(); });
    on('#btn-sel-modo','click',function(){ S.trackModoSel=true; S.trackSeleccion=[]; render(); });
    on('#btn-sel-cancelar','click',function(){ S.trackModoSel=false; S.trackSeleccion=[]; render(); });
    on('#btn-sel-ninguno','click',function(){ S.trackSeleccion=[]; render(); });
    on('#btn-sel-todos','click',function(){
      var q=S.trackFiltro.trim().toLowerCase();
      S.trackSeleccion = trackingList().filter(function(t){
        if(S.trackZona==='Detenidos'){ if(!estaDetenido(t)) return false; }
        else if(S.trackZona!=='Todas' && t.zona!==S.trackZona) return false;
        return !q || t.rolloId.toLowerCase().indexOf(q)!==-1;
      }).map(function(t){ return t.rolloId; });
      render();
    });
    each('[data-sel-rollo]',function(b){
      b.addEventListener('click',function(){
        var id=b.getAttribute('data-sel-rollo');
        var i=S.trackSeleccion.indexOf(id);
        if(i===-1) S.trackSeleccion.push(id); else S.trackSeleccion.splice(i,1);
        render();
      });
    });
    each('[data-mover-lote]',function(b){
      b.addEventListener('click',function(){
        var zona=b.getAttribute('data-mover-lote');
        var n=S.trackSeleccion.length;
        if(!n) return;
        if(!confirm('¿Mover '+n+' rollo(s) a '+zona+'?')) return;
        var nota=root.querySelector('#mover-nota-lote');
        moverLote(S.trackSeleccion.slice(), zona, nota?nota.value.trim():'');
      });
    });
    each('[data-track-open]',function(b){
      b.addEventListener('click',function(){
        var id=b.getAttribute('data-track-open');
        if(!S.tracking[id]){ toast('Este rollo aún no tiene seguimiento'); return; }
        S.trackRollo=id; S.trackVista='detalle'; S.tab='rollos'; render();
      });
    });
    on('#btn-track-back','click',function(){ S.trackVista='lista'; S.trackRollo=null; render(); });
    each('[data-mover-zona]',function(b){
      b.addEventListener('click',function(){
        var nota=root.querySelector('#mover-nota');
        moverRollo(S.trackRollo, b.getAttribute('data-mover-zona'), nota?nota.value.trim():'');
      });
    });

    /* historial */
    on('#btn-export','click',exportExcel);
    on('#btn-export-auditoria','click',exportAuditoria);
    each('[data-rep-filtro]',function(b){ b.addEventListener('click',function(){ S.reporteFiltro=b.getAttribute('data-rep-filtro'); render(); }); });
    var filtro=root.querySelector('#input-filtro');
    if(filtro) filtro.addEventListener('input',function(){
      S.filtro=filtro.value;
      var pos=filtro.selectionStart; render();
      var nf=root.querySelector('#input-filtro');
      if(nf){ nf.focus(); nf.setSelectionRange(pos,pos); }
    });
    each('[data-filtro-res]',function(b){ b.addEventListener('click',function(){ S.filtroResultado=b.getAttribute('data-filtro-res'); render(); }); });
    each('[data-filtro-fecha]',function(b){ b.addEventListener('click',function(){ S.filtroFecha=b.getAttribute('data-filtro-fecha'); render(); }); });
    each('[data-filtro-turno]',function(b){ b.addEventListener('click',function(){ S.filtroTurno=b.getAttribute('data-filtro-turno'); render(); }); });
    var fDesde=root.querySelector('#filtro-desde');
    if(fDesde) fDesde.addEventListener('change',function(){ S.filtroDesde=fDesde.value; render(); });
    var fHasta=root.querySelector('#filtro-hasta');
    if(fHasta) fHasta.addEventListener('change',function(){ S.filtroHasta=fHasta.value; render(); });
    on('#btn-limpiar-filtros','click',function(){
      S.filtroResultado='Todos'; S.filtroFecha='Todas'; S.filtroTurno='Todos';
      S.filtroDesde=''; S.filtroHasta=''; S.filtro='';
      render();
    });
    each('[data-foto-reg]',function(img){
      img.addEventListener('click',function(){
        var r=S.registros.filter(function(x){ return x.id===img.getAttribute('data-foto-reg'); })[0];
        if(!r) return;
        var i=parseInt(img.getAttribute('data-foto-idx'),10);
        abrirFoto(r.fotos[i], r.rolloId+' · '+(r.fecha||'')+' '+(r.hora||'')+' · '+(r.inspector||''));
      });
    });
    each('[data-delete-registro]',function(b){
      b.addEventListener('click',function(){
        var id=b.getAttribute('data-delete-registro');
        var r=S.registros.filter(function(x){ return x.id===id; })[0];
        if(!r) return;
        var motivo=prompt('Motivo de la eliminación (obligatorio):','');
        if(motivo===null) return;
        if(motivo.trim().length<5){ toast('Escribe un motivo de al menos 5 caracteres'); return; }
        S.registros=S.registros.filter(function(x){ return x.id!==id; });
        try{ set('registros',S.registros); }catch(e){}
        auditar('eliminacion', r.rolloId, 'Registro eliminado ('+r.resultado+')', motivo.trim());
        toast('Registro eliminado');
        render();
      });
    });

    /* ajustes */
    on('#btn-logout','click',function(){ cerrarSesion(false); });
    on('#btn-backup','click',downloadBackup);
    var restore=root.querySelector('#input-restore');
    if(restore) restore.addEventListener('change',function(){ if(restore.files && restore.files[0]) restoreBackup(restore.files[0]); });

    on('#btn-change-pin','click',function(){ S.showChangePin=true; S.changePinError=''; render(); });
    on('#btn-cancel-change-pin','click',function(){ S.showChangePin=false; render(); });
    on('#btn-change-pin-submit','click',function(){
      var cur=root.querySelector('#cp-current').value.trim();
      var nw=root.querySelector('#cp-new').value.trim();
      var me=S.usuarios.filter(function(u){ return u.nombre===S.inspector; })[0];
      if(!me || me.pin!==cur){ S.changePinError='PIN actual incorrecto'; render(); return; }
      if(!/^\d{4,6}$/.test(nw)){ S.changePinError='El PIN nuevo debe tener de 4 a 6 dígitos'; render(); return; }
      me.pin=nw;
      try{ set('usuarios',S.usuarios); S.showChangePin=false; S.changePinError=''; toast('PIN actualizado'); }
      catch(e){ S.changePinError='No se pudo guardar'; }
      render();
    });

    each('[data-del-usuario]',function(b){
      b.addEventListener('click',function(){
        var i=parseInt(b.getAttribute('data-del-usuario'),10);
        if(!confirm('¿Quitar a '+S.usuarios[i].nombre+'? Sus registros anteriores se conservan.')) return;
        var nombre=S.usuarios[i].nombre;
        S.usuarios.splice(i,1);
        if(S.inspector===nombre){ S.inspector=null; try{ set('sesion',null); }catch(e){} }
        try{ set('usuarios',S.usuarios); }catch(e){}
        auditar('edicion','','Inspector dado de baja: '+nombre,'');
        render();
      });
    });
    each('[data-edit-usuario]',function(b){ b.addEventListener('click',function(){ S.editingUserIdx=parseInt(b.getAttribute('data-edit-usuario'),10); render(); }); });
    each('[data-save-pin]',function(b){
      b.addEventListener('click',function(){
        var i=parseInt(b.getAttribute('data-save-pin'),10);
        var val=root.querySelector('#edit-pin-input').value.trim();
        if(!/^\d{4,6}$/.test(val)){ toast('El PIN debe tener de 4 a 6 dígitos'); return; }
        S.usuarios[i].pin=val;
        try{ set('usuarios',S.usuarios); toast('PIN actualizado'); }catch(e){ toast('No se pudo guardar'); }
        S.editingUserIdx=null; render();
      });
    });
    on('#btn-add-usuario','click',function(){
      var name=root.querySelector('#new-usuario-nombre').value.trim();
      var pin=root.querySelector('#new-usuario-pin').value.trim();
      if(!name){ toast('Escribe el nombre del inspector'); return; }
      if(!/^\d{4,6}$/.test(pin)){ toast('El PIN debe tener de 4 a 6 dígitos'); return; }
      if(S.usuarios.some(function(u){ return u.nombre.toLowerCase()===name.toLowerCase(); })){ toast('Ese nombre ya existe'); return; }
      S.usuarios.push({nombre:name,pin:pin});
      try{ set('usuarios',S.usuarios); toast('Inspector agregado'); }catch(e){ toast('No se pudo guardar'); }
      auditar('edicion','','Inspector dado de alta: '+name,'');
      render();
    });
    on('#btn-save-admin-pass','click',function(){
      var val=root.querySelector('#new-admin-pass').value.trim();
      if(val.length<4){ toast('La clave debe tener al menos 4 caracteres'); return; }
      S.adminPassword=val;
      try{ set('adminPassword',val); toast('Clave actualizada'); }catch(e){ toast('No se pudo guardar'); }
      render();
    });

    /* grados */
    on('#btn-add-grado','click',function(){
      var g=root.querySelector('#new-grado').value.trim().toUpperCase();
      var sgf=root.querySelector('#new-grado-sgf').value.trim();
      var f=root.querySelector('#new-grado-familia').value.trim();
      if(!g){ toast('Escribe el grado'); return; }
      S.catalogs.grados=S.catalogs.grados||[];
      if(S.catalogs.grados.some(function(x){ return x.grado.toUpperCase()===g; })){ toast('Ese grado ya existe'); return; }
      S.catalogs.grados.push({grado:g, sgf:sgf, familia:f});
      S.catalogs.grados.sort(function(a,b){ return a.grado.localeCompare(b.grado); });
      try{ set('catalogs',S.catalogs); }catch(e){ toast('No se pudo guardar'); }
      render();
    });
    each('[data-del-grado]',function(b){
      b.addEventListener('click',function(){
        S.catalogs.grados.splice(parseInt(b.getAttribute('data-del-grado'),10),1);
        try{ set('catalogs',S.catalogs); }catch(e){}
        render();
      });
    });
    on('#btn-clear-grados','click',function(){
      if(!confirm('¿Vaciar todo el catálogo de grados?')) return;
      S.catalogs.grados=[];
      try{ set('catalogs',S.catalogs); }catch(e){}
      render();
    });
    var impGrados=root.querySelector('#input-import-grados');
    if(impGrados) impGrados.addEventListener('change',function(){
      if(impGrados.files && impGrados.files[0]) importarGrados(impGrados.files[0]);
    });

    /* zonas */
    on('#btn-add-zona','click',function(){
      var z=root.querySelector('#new-zona').value.trim();
      if(!z) return;
      S.catalogs.zonas=S.catalogs.zonas||[];
      if(S.catalogs.zonas.indexOf(z)!==-1){ toast('Esa zona ya existe'); return; }
      S.catalogs.zonas.push(z);
      try{ set('catalogs',S.catalogs); }catch(e){ toast('No se pudo guardar'); }
      auditar('edicion','','Zona agregada: '+z,'');
      render();
    });
    each('[data-del-zona]',function(b){
      b.addEventListener('click',function(){
        var i=parseInt(b.getAttribute('data-del-zona'),10);
        var z=S.catalogs.zonas[i];
        if(z===ZONA_ORIGEN) return;
        if(!confirm('¿Quitar la zona «'+z+'»? Los movimientos ya registrados se conservan.')) return;
        S.catalogs.zonas.splice(i,1);
        try{ set('catalogs',S.catalogs); }catch(e){}
        auditar('edicion','','Zona eliminada: '+z,'');
        render();
      });
    });

    each('[data-add-simple]',function(b){
      b.addEventListener('click',function(){
        var kind=b.getAttribute('data-add-simple');
        var input=root.querySelector('#new-'+kind);
        var val=input.value.trim();
        if(!val) return;
        S.catalogs[kind]=S.catalogs[kind]||[];
        if(S.catalogs[kind].indexOf(val)!==-1){ toast('Ya existe'); return; }
        S.catalogs[kind].push(val);
        try{ set('catalogs',S.catalogs); }catch(e){ toast('No se pudo guardar'); }
        render();
      });
    });
    each('[data-del-simple]',function(b){
      b.addEventListener('click',function(){
        var kind=b.getAttribute('data-del-simple');
        S.catalogs[kind].splice(parseInt(b.getAttribute('data-idx'),10),1);
        try{ set('catalogs',S.catalogs); }catch(e){}
        render();
      });
    });
    each('[data-add-var]',function(b){
      b.addEventListener('click',function(){
        var code=b.getAttribute('data-add-var');
        var input=root.querySelector('[data-var-input="'+(window.CSS&&CSS.escape?CSS.escape(code):code)+'"]');
        var val=input?input.value.trim():'';
        if(!val) return;
        S.variacionesCat[code]=S.variacionesCat[code]||[];
        S.variacionesCat[code].push(val);
        try{ set('variaciones',S.variacionesCat); }catch(e){ toast('No se pudo guardar'); }
        render();
      });
    });
    each('[data-del-var]',function(b){
      b.addEventListener('click',function(){
        var code=b.getAttribute('data-del-var');
        S.variacionesCat[code].splice(parseInt(b.getAttribute('data-idx'),10),1);
        if(!S.variacionesCat[code].length) delete S.variacionesCat[code];
        try{ set('variaciones',S.variacionesCat); }catch(e){}
        render();
      });
    });

    on('#btn-demo','click',function(){ if(confirm('Se agregarán inspectores y rollos de ejemplo. ¿Continuar?')) cargarDemo(); });
    on('#btn-wipe','click',function(){
      if(!confirm('Se borrarán TODOS los inspectores, registros, movimientos y catálogos. ¿Continuar?')) return;
      if(!confirm('Última confirmación: esta acción no se puede deshacer.')) return;
      try{ Object.keys(localStorage).filter(function(k){ return k.indexOf(PREFIX)===0; }).forEach(function(k){ localStorage.removeItem(k); }); }catch(e){}
      location.reload();
    });
  }

  function refreshIdScreen(focusSel){
    var body=root.querySelector('.ra-body');
    if(!body) return;
    body.innerHTML=screenId();
    bindEvents();
    var i=root.querySelector(focusSel||'#input-id-mid');
    if(i){ i.focus(); try{ i.setSelectionRange(i.value.length,i.value.length); }catch(e){} }
  }

  function elegirGrado(g){
    S.rolloData.grado = g;
    S.rolloData.familiaSGF = familiaDeGrado(g);
    S.rolloData.familiaDesc = descripcionDeGrado(g);
    S.gradoQuery = g;
    S.gradoAbierto = false;
    refreshIdScreen('#field-espesor');
  }

  function collectManualFields(){
    [['#field-enrollador','enrollador'],['#field-espesor','espesor'],
     ['#field-ancho','ancho'],['#field-peso','peso'],['#field-fecha','fecha']].forEach(function(p){
      var n=root.querySelector(p[0]);
      if(n && n.value) S.rolloData[p[1]]=n.value;
    });
    var g=root.querySelector('#field-grado');
    if(g){
      var txt=(g.value||'').trim().toUpperCase();
      if(txt && buscarGrado(txt)) S.rolloData.grado = txt;
    }
    if(S.rolloData.grado){
      S.rolloData.familiaSGF = familiaDeGrado(S.rolloData.grado);
      S.rolloData.familiaDesc = descripcionDeGrado(S.rolloData.grado);
    }
  }

  /* ============ GUARDAR ============ */
  function guardarRegistro(){
    if(!idValido()){ toast('El ID debe llevar exactamente '+ID_MID_LEN+' dígitos'); S.step='id'; render(); return; }
    var id=rolloId();
    var now=new Date();
    var master=S.rollosMaster[id]||{};
    var reg={
      id:'r'+now.getTime()+Math.random().toString(36).slice(2,7),
      ts:now.getTime(), fecha:fechaHoy(now), hora:horaAhora(now), turno:turnoDe(now), rolloId:id,
      resultado:S.resultado||'Conforme',
      familia:S.familia?S.familia.name:'',
      defectoCode:S.defecto?S.defecto.code:'',
      defecto:S.defecto?S.defecto.name:'',
      variacion:S.variacion||'', ubicacion:S.ubicacion||'', severidad:S.severidad||'',
      inspector:usuarioActual(),
      grado:master.grado||S.rolloData.grado||'',
      familiaSGF:master.familiaSGF||S.rolloData.familiaSGF||'',
      familiaDesc:master.familiaDesc||S.rolloData.familiaDesc||'',
      espesor:master.espesor||S.rolloData.espesor||'',
      ancho:master.ancho||S.rolloData.ancho||'',
      peso:master.peso||S.rolloData.peso||'',
      fechaProduccion:master.fecha||S.rolloData.fecha||'',
      enrollador:master.enrollador||S.rolloData.enrollador||'',
      fotos:S.fotos.slice(), comentario:S.comentario||'', ediciones:[]
    };
    var backupRegs=S.registros.slice();
    S.registros.unshift(reg);
    try{ set('registros',S.registros); }
    catch(e){
      S.registros=backupRegs;
      toast('Sin espacio — descarga un respaldo y borra registros antiguos');
      return;
    }
    if(!master.grado && (S.rolloData.grado||S.rolloData.enrollador||S.rolloData.espesor)){
      S.rollosMaster[id]={id:id,grado:S.rolloData.grado||'',familiaSGF:S.rolloData.familiaSGF||'',familiaDesc:S.rolloData.familiaDesc||'',
        espesor:S.rolloData.espesor||'',ancho:S.rolloData.ancho||'',peso:S.rolloData.peso||'',
        fecha:S.rolloData.fecha||'',enrollador:S.rolloData.enrollador||''};
      try{ set('rollosMaster',S.rollosMaster); }catch(e){}
    }
    iniciarTracking(id);
    auditar('creacion', id, 'Inspección registrada: '+reg.resultado+(reg.defecto?' · '+reg.defectoCode+' '+reg.defecto:''), '');
    toast('Rollo guardado en '+ZONA_ORIGEN);
    resetCaptureFlow();
    render();
  }

  function guardarEdicion(){
    var r=S.editReg;
    var motivo=(root.querySelector('#edit-motivo').value||'').trim();
    if(motivo.length<10){ S.editErr='Describe el motivo del cambio (mínimo 10 caracteres).'; render(); sacudir('#edit-motivo'); return; }

    var famId=root.querySelector('#edit-familia').value;
    var fam=FAMILIAS.filter(function(f){ return f.id===famId; })[0];
    var defCode=root.querySelector('#edit-defecto').value;
    var def=defCode&&DEFECT_INDEX[defCode]?DEFECT_INDEX[defCode].defecto:null;
    var nuevo={
      resultado:root.querySelector('#edit-resultado').value,
      familia:fam?fam.name:'',
      defectoCode:def?def.code:'',
      defecto:def?def.name:'',
      variacion:root.querySelector('#edit-variacion').value,
      ubicacion:root.querySelector('#edit-ubicacion').value,
      severidad:root.querySelector('#edit-severidad').value,
      comentario:root.querySelector('#edit-comentario').value
    };
    var etiquetas={resultado:'Resultado',familia:'Familia',defecto:'Defecto',variacion:'Variación',
      ubicacion:'Ubicación',severidad:'Severidad',comentario:'Comentario'};
    var cambios=[];
    Object.keys(etiquetas).forEach(function(k){
      var antes=r[k]||'', desp=nuevo[k]||'';
      if(antes!==desp) cambios.push(etiquetas[k]+': "'+(antes||'—')+'" → "'+(desp||'—')+'"');
    });
    if(!cambios.length){ S.editErr='No cambiaste ningún campo.'; render(); return; }

    var now=new Date();
    r.ediciones=r.ediciones||[];
    r.ediciones.push({ts:now.getTime(), fecha:fechaHoy(now), hora:horaAhora(now), turno:turnoDe(now),
      usuario:usuarioActual(), motivo:motivo, cambios:cambios.join(' | ')});
    Object.keys(nuevo).forEach(function(k){ r[k]=nuevo[k]; });
    r.defectoCode=nuevo.defectoCode;

    try{ set('registros',S.registros); }
    catch(e){ toast('No se pudo guardar el cambio'); return; }
    auditar('edicion', r.rolloId, cambios.join(' | '), motivo);
    S.editReg=null; S.editErr=''; S.tab='historial';
    toast('Cambios guardados');
    render();
  }

  /* ============ DEMO ============ */
  function cargarDemo(){
    [{nombre:'Luis Ramírez',pin:'1234'},{nombre:'Ana Castillo',pin:'5678'}].forEach(function(u){
      if(!S.usuarios.some(function(x){ return x.nombre===u.nombre; })) S.usuarios.push(u);
    });
    if(!(S.catalogs.grados||[]).length){ S.catalogs.grados=JSON.parse(JSON.stringify(DEFAULT_GRADOS)); }
    var base=Date.now();
    var demos=[
      {rolloId:'4A695767PM400',resultado:'Conforme',grado:'C14MC4',familiaSGF:'6',familiaDesc:'Grados comerciales Medios'},
      {rolloId:'4A695768PM400',resultado:'Defecto',familia:'Aspecto físico',defectoCode:'593',defecto:'Devanado',variacion:'Últimas vueltas flojas',ubicacion:'DIC',severidad:'Leve',grado:'T05CR8',familiaSGF:'41',familiaDesc:'> X70'},
      {rolloId:'4A695769PM400',resultado:'Defecto',familia:'Defectos superficiales',defectoCode:'19',defecto:'Rayas',ubicacion:'Centro',severidad:'Moderado',grado:'A06CR5',familiaSGF:'31',familiaDesc:'AHSS'},
      {rolloId:'4A695770PM400',resultado:'Scrap',familia:'Orilla',defectoCode:'765',defecto:'Orilla trozada',ubicacion:'Todo el rollo',comentario:'Rollo retenido en patio',grado:'SIAL20',familiaSGF:'27',familiaDesc:'Eléctricos'}
    ];
    demos.forEach(function(d,i){
      var t=new Date(base-(demos.length-i)*3600000);
      var reg=Object.assign({
        id:'demo'+t.getTime()+i, ts:t.getTime(), fecha:fechaHoy(t), hora:horaAhora(t),
        inspector:i%2?'Ana Castillo':'Luis Ramírez',
        espesor:'2.50',ancho:'1200',peso:'18500',enrollador:'Enrollador 2',
        fechaProduccion:'',variacion:'',severidad:'',familia:'',defectoCode:'',defecto:'',
        comentario:'',fotos:[],ediciones:[],grado:'',familiaSGF:'',familiaDesc:''
      },d);
      S.registros.unshift(reg);
      if(!S.tracking[reg.rolloId]){
        S.tracking[reg.rolloId]={rolloId:reg.rolloId, zona:ZONA_ORIGEN,
          ultimoUsuario:reg.inspector, ultimaFecha:reg.fecha, ultimaHora:reg.hora, ultimoTs:t.getTime(),
          movimientos:[{zona:ZONA_ORIGEN,usuario:reg.inspector,fecha:reg.fecha,hora:reg.hora,ts:t.getTime(),nota:'Alta por inspección'}]};
      }
    });
    var t2=new Date(base-1800000);
    var demoMov=S.tracking['4A695768PM400'];
    if(demoMov && demoMov.movimientos.length===1){
      demoMov.movimientos.push({zona:'Cooling Bay',usuario:'Ana Castillo',fecha:fechaHoy(t2),hora:horaAhora(t2),ts:t2.getTime(),nota:'Enfriamiento programado'});
      demoMov.zona='Cooling Bay'; demoMov.ultimoUsuario='Ana Castillo'; demoMov.ultimaFecha=fechaHoy(t2); demoMov.ultimaHora=horaAhora(t2); demoMov.ultimoTs=t2.getTime();
    }
    try{ persistAll(); toast('Datos de ejemplo cargados'); }catch(e){ toast('No se pudo guardar'); }
    render();
  }

  init();
})();
</script>
